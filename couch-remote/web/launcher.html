<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couch Launcher</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* OLED cinema x Steel Ball Run. Obsidian surfaces and frosted glass; the show's key art (and then the
     focused game's art) fills the screen. The SBR identity is the signature: pink Couch script with a cyan
     rim, the gold horseshoe, Gyro's steel ball on the focused tile, ゴゴゴ, and Johnny's cyan as the
     ice-blue focus glow. Layout, buttons and prompts follow the PS5. */
  :root {
    --obsidian: #0b0d12; --glass: rgba(22, 26, 36, .56); --glass-hi: rgba(26, 30, 42, .84); --line: rgba(255, 255, 255, .11);
    --ink: #f4f6fb; --dim: #aeb6c8; --faint: #7d859a;
    --ice: #8fe3ff; --pink: #e0306e; --johnny: #5ec8ef; --gyro: #6fae3e; --gold: #f2b844;
    --ps-cross: #7ea6ff; --ps-circle: #ff6f7d; --ps-tri: #43d6b0; --ps-square: #f08bd8;
    --logo: "Lobster", "Segoe Script", cursive;
    --ui: "Archivo", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --spring: cubic-bezier(.22, 1, .36, 1);
    --tile: 17vh; --poster-h: 27vh; --pad: 5vw;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--obsidian); color: var(--ink); font: 500 2.2vh/1.3 var(--ui); cursor: default; user-select: none; }

  /* ---------- full-bleed hero: the show's key art at home, the focused game's art over it, crossfaded */
  .sky, .bg { position: fixed; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
  /* the art (set as --art) twice: blurred and dim across the whole screen, then sharp on the right, its left edge
     faded into the blur so there's no seam, drifting slowly while it's up */
  .sky { overflow: hidden; }
  .sky::before, .sky::after { content: ""; position: absolute; inset: 0; background: var(--art) no-repeat; }
  .sky::before { background-size: cover; background-position: center; filter: blur(48px) saturate(1.25) brightness(.42); transform: scale(1.15); }
  .sky::after { background-size: auto 100%; background-position: right center; transform-origin: 80% 40%;
    --fade: linear-gradient(90deg, transparent var(--f0, 22%), #000 var(--f1, 52%));
    -webkit-mask-image: var(--fade); mask-image: var(--fade); }
  .sky.on::after { animation: sky-drift 22s ease-out both; }
  .sky:not(.on)::after { transform: scale(1.06); }  /* fading out: hold where the drift ended, no snap back */
  @keyframes sky-drift { from { transform: scale(1.0); } to { transform: scale(1.06); } }
  .sky.on, .bg.on { opacity: 1; }
  .bg { background-size: cover; background-position: center 30%; background-color: var(--obsidian); filter: saturate(1.08) brightness(.66); }
  .shade { position: fixed; inset: 0; pointer-events: none; transition: opacity .6s ease; background:
      linear-gradient(90deg, rgba(11,13,18,.97) 0%, rgba(11,13,18,.84) 30%, rgba(11,13,18,.32) 60%, rgba(11,13,18,.06) 100%),
      linear-gradient(0deg, rgba(11,13,18,.98) 0%, rgba(11,13,18,.6) 36%, rgba(11,13,18,0) 62%),
      linear-gradient(180deg, rgba(11,13,18,.72) 0%, rgba(11,13,18,0) 20%); }
  .spiral-mark { position: fixed; right: -14vh; bottom: -20vh; width: 78vh; height: 78vh; opacity: .05; color: var(--gold); pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .app-shell { position: relative; height: 100%; animation: enter .7s var(--spring); transition: opacity .35s ease; }
  @keyframes enter { from { opacity: 0; transform: translateY(2vh); } }

  /* ---------- header */
  header { display: flex; align-items: center; justify-content: space-between; height: 11vh; padding: 2.8vh var(--pad) 0; }
  .brand { display: flex; align-items: center; gap: 1.2vw; }
  .brand h1 { margin: 0; font: 400 5.8vh/1 var(--logo); color: var(--pink); -webkit-text-stroke: .18vh #fff;
              text-shadow: .35vh .35vh 0 var(--johnny), .7vh .7vh 1.6vh rgba(0,0,0,.5); transform: rotate(-4deg); }
  .brand .mark { width: 4.6vh; height: 4.6vh; filter: drop-shadow(0 .3vh .4vh rgba(0,0,0,.5)); }
  .status { display: flex; align-items: center; gap: 2.6vw; }
  .time { text-align: right; }
  #clock { font: 650 4.2vh/1 var(--ui); font-variant-numeric: tabular-nums; }
  #date { color: var(--dim); font-size: 2.1vh; margin-top: .7vh; }
  #pad { display: flex; align-items: center; gap: 1vh; color: var(--dim); font-size: 2.1vh; }
  #pad svg { width: 5.2vh; height: 2.8vh; color: var(--ink); }
  #pad.low, #pad.low svg { color: var(--ps-circle); }
  /* idle: nothing still and bright on the TV, just a dim clock that moves every minute */
  #idle { position: fixed; inset: 0; background: #05060a; opacity: 0; pointer-events: none; transition: opacity 1.2s; z-index: 30; }
  body.idle #idle { opacity: 1; }
  #idle-clock { position: absolute; font: 600 6vh/1 var(--ui); color: #6f7790; font-variant-numeric: tabular-nums; }

  /* ---------- details of the focused tile (PS5 game hub) */
  .details { position: relative; height: 21vh; padding: .4vh var(--pad) 0; }
  #d-title { margin: 0; font: 800 7.6vh/1.02 var(--ui); font-stretch: 75%; max-width: 64vw;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 .4vh 2vh rgba(0,0,0,.65); }
  #d-meta { color: var(--dim); font-size: 2.6vh; margin-top: .7vh; min-height: 1.3em; max-width: 64vw;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cta { display: inline-flex; align-items: center; gap: 1.2vh; margin-top: 1.5vh; padding: 1.1vh 3.4vh 1.1vh 1.3vh; border-radius: 99vh;
         background: #fff; color: var(--obsidian); font: 800 2.5vh/1 var(--ui); box-shadow: 0 1vh 3vh rgba(0,0,0,.45); }
  .cta .glyph { background: var(--obsidian); }
  body:not(.chosen) .cta { visibility: hidden; } /* ✕ does nothing until a tile is selected */
  .details.swap #d-title { animation: dash .5s var(--spring); }
  @keyframes dash { from { opacity: 0; transform: translateX(-3vw) skewX(-12deg); } to { opacity: 1; transform: none; } }
  #sfx { position: absolute; right: 7vw; top: 0; font: 900 6vh/1 "Yu Gothic UI", "Meiryo", "MS Gothic", sans-serif; color: var(--pink);
         -webkit-text-stroke: .22vh #fff; letter-spacing: -.05em; opacity: 0; transform: skewX(-14deg); pointer-events: none;
         text-shadow: .3vh .3vh 0 var(--johnny); }
  #sfx span { display: inline-block; }
  .details.swap #sfx { animation: menace 1.6s ease-out; }
  .details.swap #sfx span:nth-child(1) { animation: shake .18s 4 linear; }
  .details.swap #sfx span:nth-child(2) { animation: shake .18s .06s 4 linear; font-size: .82em; }
  .details.swap #sfx span:nth-child(3) { animation: shake .18s .12s 4 linear; font-size: .66em; }
  @keyframes menace { 0% { opacity: 0; transform: skewX(-14deg) translateY(1vh) scale(.9); } 12% { opacity: .95; transform: skewX(-14deg) scale(1.04); }
                      70% { opacity: .75; } 100% { opacity: 0; transform: skewX(-14deg) translateY(-1vh); } }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(.25vh,-.2vh); } 75% { transform: translate(-.25vh,.2vh); } }

  /* ---------- rows: carousels that glide on a spring */
  main { height: calc(100% - 11vh - 21vh - 8vh); overflow: hidden;
         -webkit-mask-image: linear-gradient(#000 calc(100% - 4vh), transparent); mask-image: linear-gradient(#000 calc(100% - 4vh), transparent); }
  #rows { transition: transform .6s var(--spring); }
  section { padding: .2vh 0; opacity: .5; transition: opacity .45s ease; }
  section.active, body:not(.chosen) section { opacity: 1; }
  section h2 { margin: 0 0 0 var(--pad); font: 650 2.5vh/1 var(--ui); color: var(--dim); }
  section.active h2 { color: var(--ink); }
  .strip { padding: 3vh var(--pad) 2.2vh; overflow: hidden; }
  .track { position: relative; display: flex; gap: 1.5vw; transition: transform .6s var(--spring); }

  .item { flex: 0 0 auto; position: relative; border-radius: 1.4vh; outline: none; cursor: pointer;
          box-shadow: 0 1.4vh 3vh rgba(0,0,0,.5);
          transition: transform .5s var(--spring), box-shadow .35s ease, filter .35s ease; filter: brightness(.8) saturate(.92); }
  .item::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                 box-shadow: inset 0 0 0 1px var(--line); }  /* the 1px inner light edge, drawn over art too */
  .item.focus { transform: scale(1.07); z-index: 3; filter: none;
                box-shadow: 0 0 0 .32vh #fff, 0 0 0 .8vh rgba(143,227,255,.28), 0 0 6vh .6vh rgba(143,227,255,.32), 0 2.6vh 5vh rgba(0,0,0,.6); }
  .item .badge { position: absolute; top: -2vh; right: -2vh; width: 5.8vh; height: 5.8vh; opacity: 0; z-index: 2;
                 transform: scale(.4) rotate(-90deg); transition: opacity .2s, transform .5s var(--spring); pointer-events: none;
                 filter: drop-shadow(0 .3vh .6vh rgba(0,0,0,.7)); }
  .item.focus .badge { opacity: 1; transform: scale(1); }
  .item .badge img { width: 100%; height: 100%; display: block; }
  .item.focus .badge img { animation: spin .9s linear infinite; }

  .app { width: var(--tile); height: var(--tile); display: flex; flex-direction: column; justify-content: flex-end; padding: 1.8vh; background: var(--c); }
  .app .name { font: 800 3.3vh/.95 var(--ui); font-stretch: 75%; }
  /* with the app's real icon: a dark card tinted by the brand colour, the icon centred, the name as a caption */
  .app.logo { justify-content: center; align-items: center; background: color-mix(in srgb, var(--c) 24%, #10131a); }
  .app.logo .appicon { width: 9vh; height: 9vh; object-fit: contain; margin-bottom: 2.4vh; filter: drop-shadow(0 .6vh 1.2vh rgba(0,0,0,.4)); }
  .app.logo .name { position: absolute; left: 1vh; right: 1vh; bottom: 1.5vh; text-align: center; font: 700 1.9vh/1.1 var(--ui); color: var(--dim);
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app.logo.focus .name { color: #fff; }

  .poster { width: calc(var(--poster-h) * 2 / 3); height: var(--poster-h); background: #161a24; }
  .poster .art { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; opacity: 0; transition: opacity .5s ease; }
  .poster.loaded .art { opacity: 1; }
  .poster .name { position: absolute; inset: auto 0 0 0; padding: 4vh 1.3vh 1.3vh; font: 700 2vh/1.15 var(--ui);
                  background: linear-gradient(transparent, rgba(11,13,18,.94)); border-radius: 0 0 1.4vh 1.4vh; }
  .poster.loaded .name { display: none; }  /* the name shows until the art arrives, or if there is none */
  .poster.noart .art { display: none; }

  .sys { width: 15vh; height: 15vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4vh;
         font: 700 2.1vh/1.1 var(--ui); text-align: center; background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); }
  .sys svg.icon { width: 5vh; height: 5vh; color: #fff; }
  .sys.danger svg.icon { color: var(--ps-circle); }
  .empty { color: var(--dim); padding: 2vh 0; font-size: 2.4vh; }

  /* ---------- PlayStation button glyphs (SVG) */
  .glyph { display: inline-grid; place-items: center; width: 3.7vh; height: 3.7vh; border-radius: 50%; flex: none;
           background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 .14vh rgba(255,255,255,.24); vertical-align: middle; }
  .glyph svg { width: 2vh; height: 2vh; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .g-cross svg { stroke: var(--ps-cross); } .g-circle svg { stroke: var(--ps-circle); } .g-tri svg { stroke: var(--ps-tri); } .g-square svg { stroke: var(--ps-square); }
  .sh { display: inline-grid; place-items: center; flex: none; color: var(--ink); }
  .sh svg { width: 6.2vh; height: 3.7vh; }

  /* ---------- context-aware prompt bar */
  footer { position: fixed; left: 0; right: 0; bottom: 0; height: 8vh; display: flex; align-items: center; gap: 3vw; padding: 0 var(--pad);
           font: 600 2.4vh/1 var(--ui); color: var(--ink); background: rgba(11,13,18,.5); backdrop-filter: blur(22px) saturate(1.3);
           box-shadow: inset 0 1px 0 var(--line); z-index: 12; }
  footer .p { display: inline-flex; align-items: center; gap: 1.1vh; white-space: nowrap; }
  footer .p .sh + .sh { margin-left: -.4vh; }
  footer .sound { margin-left: auto; color: var(--dim); font-weight: 500; }
  footer .sound svg { width: 2.8vh; height: 2.8vh; }

  /* ---------- toast, overlays, dialogs: frosted glass with a 1px inner light edge */
  #toast { position: fixed; right: var(--pad); top: 3vh; transform: translateY(-2vh); opacity: 0; transition: opacity .35s ease, transform .5s var(--spring);
           background: var(--glass-hi); backdrop-filter: blur(24px); color: #fff; padding: 1.6vh 3vh; border-radius: 99vh;
           font: 600 2.3vh/1.25 var(--ui); box-shadow: inset 0 0 0 1px var(--line), 0 1.4vh 3vh rgba(0,0,0,.5); pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; transform: none; }
  .overlay { position: fixed; inset: 0; background: rgba(5,6,9,.6); backdrop-filter: blur(16px) saturate(1.1); display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.show { display: flex; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; } }
  .card { position: relative; background: var(--glass-hi); backdrop-filter: blur(30px) saturate(1.2); color: #fff; border-radius: 2.8vh; padding: 4.4vh 4.6vw;
          text-align: center; max-width: 80vw; box-shadow: inset 0 0 0 1px var(--line), 0 4vh 8vh rgba(0,0,0,.6); animation: pop .45s var(--spring); }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } }
  .card h3 { margin: 0 0 1vh; font: 800 4vh/1.1 var(--ui); }
  .card p { margin: .8vh 0; color: var(--dim); font-size: 2.3vh; }
  .card .choices { display: flex; gap: 1.4vw; justify-content: center; margin-top: 3.2vh; }
  .card .choice { display: inline-flex; align-items: center; gap: 1.2vh; padding: 1.7vh 4.2vh; border-radius: 99vh; font: 700 2.4vh/1 var(--ui);
                  background: rgba(255,255,255,.1); color: #fff; filter: none; box-shadow: inset 0 0 0 1px var(--line); }
  .card .choice::after { display: none; }
  .card .choice.focus { background: #fff; color: var(--obsidian); transform: scale(1.06); box-shadow: 0 0 0 .3vh #fff, 0 0 4vh rgba(143,227,255,.4); }
  .card .choice.danger.focus { color: #c0203a; }
  .card .choice .dev { width: 2.8vh; height: 2.8vh; flex: none; color: var(--dim); }
  .card .choice.focus .dev { color: var(--obsidian); }
  /* list dialogs (menu, audio outputs): rows with a second line and a check on the current one */
  .card .choices.vertical { flex-direction: column; align-items: stretch; gap: .9vh; min-width: 42vw; }
  .card .choices.vertical .choice { gap: 2vh; padding: 1.4vh 2.4vh; border-radius: 1.6vh; text-align: left; transform-origin: center; }
  .card .choices.vertical .choice.focus { transform: scale(1.03); }
  .card .choices.vertical .dev { width: 3.4vh; height: 3.4vh; }
  .card .choice small { display: block; margin-top: .5vh; font: 500 1.8vh/1.2 var(--ui); color: var(--dim); }
  .card .choice.focus small { color: #4d5568; }
  .card .choice .bar { margin-left: auto; width: 14vh; height: .8vh; border-radius: 99vh; background: rgba(255,255,255,.14); overflow: hidden; flex: none; }
  .card .choice .bar i { display: block; height: 100%; background: var(--ice); border-radius: inherit; transition: width .3s var(--spring); }
  .card .choice.focus .bar { background: rgba(11,13,18,.15); }
  .card .choice.focus .bar i { background: var(--obsidian); }
  .card .choice .check { width: 2.8vh; height: 2.8vh; margin-left: auto; flex: none; color: var(--ice); }
  .card .choice.focus .check { color: var(--obsidian); }
  /* game details (□): the cover beside its facts and actions */
  #dlg-art { display: none; }
  .card.art { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4.4vh; align-items: center; text-align: left; max-width: 76vw; }
  .card.art #dlg-art { display: block; width: 27vh; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 1.6vh; box-shadow: 0 2vh 4vh rgba(0,0,0,.5); }
  .card.art h3 { font: 800 6vh/1.02 var(--ui); font-stretch: 75%; }
  .card.art .choices { justify-content: flex-start; }
  #dlg-lines { list-style: none; padding: 0; margin: 1.4vh 0 0; display: grid; gap: .9vh; font-size: 2.5vh; color: var(--dim); }
  #dlg-lines[hidden], #dlg-text[hidden] { display: none; }
  #dlg-lines li::before { content: ""; display: inline-block; width: .9vh; height: .9vh; margin: 0 1.4vh .25vh 0; border-radius: 50%; background: var(--gold); }

  /* ---------- △ search: on-screen keyboard and results */
  #search { align-items: flex-start; }
  .search { width: 90vw; margin-top: 7vh; }
  .sq { display: flex; align-items: center; gap: 2vh; height: 9vh; padding: 0 3vh; border-radius: 2vh; background: var(--glass-hi);
        box-shadow: inset 0 0 0 1px var(--line); font: 700 4.4vh/1 var(--ui); }
  .sq svg { width: 4vh; height: 4vh; color: var(--dim); flex: none; }
  .sq-hint { color: var(--faint); font-weight: 500; font-size: 3vh; }
  .caret { width: .35vh; height: 5vh; background: var(--ice); margin-left: -1.2vh; }
  .keys { display: grid; grid-template-columns: repeat(13, 1fr); gap: 1vh; margin: 3vh 0 2vh; }
  .key { height: 7.4vh; display: grid; place-items: center; border-radius: 1.3vh; background: rgba(255,255,255,.07);
         box-shadow: inset 0 0 0 1px var(--line); font: 700 3vh/1 var(--ui); transition: transform .4s var(--spring), background .2s, color .2s; }
  .key .kicon { width: 3.4vh; height: 3.4vh; }
  .key.focus { background: #fff; color: var(--obsidian); transform: scale(1.08); box-shadow: 0 0 0 .3vh #fff, 0 0 4vh rgba(143,227,255,.45); }
  .results-wrap h2 { margin: 0; font: 650 2.5vh/1 var(--ui); color: var(--dim); min-height: 2.5vh; }
  .results-wrap .strip { padding: 3vh 1.6vh 2vh; margin: 0 -1.6vh; }  /* room for the focus glow */
  #results { --poster-h: 24vh; --tile: 15vh; }

  /* ---------- starting a game: the steel ball spins over the game's own art until its window takes over */
  #starting { background: radial-gradient(60vw 60vh at 50% 50%, rgba(11,13,18,.6), rgba(11,13,18,.12)); backdrop-filter: none; }
  body.starting .app-shell { opacity: 0; }
  body.starting .shade { opacity: .55; }
  body.starting .bg { filter: saturate(1.1) brightness(.8); transition: opacity .7s ease, filter .6s ease; }
  .launch { text-align: center; max-width: 80vw; }
  .launch .ball { width: 13vh; height: 13vh; animation: spin .9s linear infinite; filter: drop-shadow(0 1vh 2vh rgba(0,0,0,.6)); }
  .launch h3 { margin: 3.4vh 0 1.2vh; font: 800 7.2vh/1.02 var(--ui); font-stretch: 75%; text-shadow: 0 .4vh 2vh rgba(0,0,0,.7); }
  .launch p { margin: 0; color: var(--dim); font-size: 2.4vh; }
  #qr { background: #fff; padding: 1.4vh; border-radius: 1.4vh; display: inline-block; margin: 2vh 0; }
  #qr svg { display: block; width: 30vh; height: 30vh; }
  .url { font-family: Consolas, monospace; color: #fff !important; }

  /* Windows "Animation effects" off: ゴゴゴ becomes a fade; nothing spins, shakes, slides or zooms */
  @media (prefers-reduced-motion: reduce) {
    .sky::after, .app-shell, .details.swap #d-title, .details.swap #sfx span, .item.focus .badge img, .card, .overlay.show, .launch .ball { animation: none !important; }
    .details.swap #sfx { animation: fade-sfx 1.6s ease-out; }
    #rows, .track, .item, .item .badge, .key { transition: opacity .2s, box-shadow .2s, filter .2s; }
    .item.focus, .card .choice.focus, .key.focus { transform: none; }
  }
  @keyframes fade-sfx { 12% { opacity: .95; } 70% { opacity: .75; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="sky" id="skyA"></div><div class="sky" id="skyB"></div>
<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
<div class="shade"></div>
<svg class="spiral-mark" viewBox="0 0 2 2"><use href="#spiral"/></svg>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="spiral" viewBox="-1 -1 2 2"><path id="spiral-path" fill="none" stroke="currentColor" stroke-width=".06" stroke-linecap="round"/></symbol>
    <symbol id="horseshoe" viewBox="-1 -1 2 2"><path d="M-.55-.82V-.05A.55.55 0 0 0 .55-.05V-.82" fill="none" stroke="#f2b844" stroke-width=".3" stroke-linecap="round"/><path d="M-.55-.82V-.05A.55.55 0 0 0 .55-.05V-.82" fill="none" stroke="#ffe19a" stroke-width=".08" stroke-linecap="round" transform="translate(-.05 -.03)"/><g fill="#6b4a10"><circle cx="-.55" cy="-.5" r=".05"/><circle cx="-.5" cy="-.15" r=".05"/><circle cx=".55" cy="-.5" r=".05"/><circle cx=".5" cy="-.15" r=".05"/></g></symbol>
    <!-- PlayStation buttons -->
    <symbol id="g-cross" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol>
    <symbol id="g-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>

<script>

let info = null;
let rows = [];            // arrays of focusable elements, one per row
let pos = { r: 1, c: 0 };  // where the first press lands (first game)
let chosen = false;        // nothing is selected until you move, so ✕ can't launch by accident
const lastCol = [];
let modal = null;         // { els, i, onBack, move?, activate?, del?, search? }

// ---------- golden spiral (r grows by the golden ratio every quarter turn)
(() => {
  const phi = (1 + Math.sqrt(5)) / 2, b = Math.log(phi) / (Math.PI / 2), turns = 4.25, steps = 260;
  const maxT = turns * 2 * Math.PI, a = 0.92 / Math.exp(b * maxT);
  let d = "";
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * maxT, r = a * Math.exp(b * t);
    d += (i ? "L" : "M") + (r * Math.cos(t)).toFixed(4) + " " + (r * Math.sin(t)).toFixed(4);
  }
  $("#spiral-path").setAttribute("d", d);
})();
const badge = () => '<span class="badge"><img src="/steelball.png" alt=""></span>';
const icon = (name, cls = "icon") =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${name}"/></svg>`;
// PlayStation button glyphs for prompts, all SVG
const GLYPH = {
  cross: '<span class="glyph g-cross"><svg viewBox="0 0 24 24"><use href="#g-cross"/></svg></span>',
  circle: '<span class="glyph g-circle"><svg viewBox="0 0 24 24"><use href="#g-circle"/></svg></span>',
  square: '<span class="glyph g-square"><svg viewBox="0 0 24 24"><use href="#g-square"/></svg></span>',
  tri: '<span class="glyph g-tri"><svg viewBox="0 0 24 24"><use href="#g-tri"/></svg></span>',
  l1: '<span class="sh"><svg viewBox="0 0 44 26"><use href="#g-l1"/></svg></span>',
  r1: '<span class="sh"><svg viewBox="0 0 44 26"><use href="#g-r1"/></svg></span>',
  options: '<span class="sh"><svg viewBox="0 0 44 26"><use href="#g-options"/></svg></span>',

// ---------- a wireless DualSense's speaker and grips: Windows can't play to them, so the server sends them what
// this page plays (padspeaker.py). This runs in the audio thread. Input 0 (everything) becomes the speaker: mono,
// resampled to the controller's 45 kHz. Input 1 (the menu sounds, not music) becomes what the grips feel: how loud
// its low end (below ~400 Hz) is sets a 150 Hz buzz, full strength at once and fading in ~25 ms, so each sound
// lands as a crisp tap the way the PS5 menu's do. Each report's worth (2048 bytes: 960 16-bit samples, then
// 64 x 2 grips of 8-bit at 3 kHz) is handed over in one block; after 0.5 s of quiet it rests.
function padTapWorklet() {
  const A = 1 - Math.exp(-2 * Math.PI * 400 / 45000), R = Math.exp(-1 / (0.025 * 45000)), W = 2 * Math.PI * 150 / 3000;
  const clamp = x => Math.max(-1, Math.min(1, x));

    constructor() {
      super(); this.step = sampleRate / 45000; this.t = 0; this.prev = 0; this.prevH = 0; this.lp1 = 0; this.lp2 = 0; this.env = 0; this.ph = 0;
      this.buf = new ArrayBuffer(2048); this.block = new Int16Array(this.buf, 0, 960); this.feel = new Int8Array(this.buf, 1920, 128);
      this.n = 0; this.loud = false; this.quiet = 99;
    }
    process([a, f]) {
      const [l, r = l] = a, [fl, fr = fl] = f, len = (l || fl)?.length || 128;
      for (let i = 0; i < len; i++) {
        const s = l ? (l[i] + r[i]) / 2 : 0, h = fl ? (fl[i] + fr[i]) / 2 : 0;
        for (; this.t < 1; this.t += this.step) this.push(this.prev + (s - this.prev) * this.t, this.prevH + (h - this.prevH) * this.t);
        this.t -= 1; this.prev = s; this.prevH = h;
      }
      return true;
    }
    push(v, h) {
      if (v > 1e-4 || v < -1e-4 || h > 1e-4 || h < -1e-4) this.loud = true;
      this.block[this.n] = clamp(v) * 32767;
      this.lp1 += (h - this.lp1) * A; this.lp2 += (this.lp1 - this.lp2) * A;  // two gentle low-pass stages
      this.env = Math.max(Math.abs(this.lp2) * 120, this.env * R);            // instant attack, ~25 ms fade
      if (this.n % 15 === 14) {  // every 15th sample (45 kHz -> 3 kHz): the buzz, the same in both grips
        const k = (this.n - 14) / 15 * 2;
        this.ph = (this.ph + W) % (2 * Math.PI);
        this.feel[k] = this.feel[k + 1] = Math.min(1, this.env) * Math.sin(this.ph) * 127;
      }
      if (++this.n < 960) return;
      this.quiet = this.loud ? 0 : this.quiet + 1;
      if (this.quiet < 24) this.port.postMessage(this.buf.slice(0));
      this.n = 0; this.loud = false;
    }
  });
}
// Posts the blocks in order, one request at a time (blocks that pile up meanwhile go together).
const PadLink = {
  q: [], busy: false,
  async send(block) {
    this.q.push(block);
    if (this.busy) return;
    this.busy = true;
    while (this.q.length) {
      const blocks = this.q.splice(0, 50), body = new Uint8Array(blocks.length * 2048);
      blocks.forEach((b, i) => body.set(new Uint8Array(b), i * 2048));
      const ok = await fetch("/api/padaudio", { method: "POST", headers: { "X-Couch": "1" }, body }).then(r => r.ok, () => false);
      if (!ok) { this.q.length = 0; Out.detect(); break; }  // that controller's gone: back to the TV
    }

};

// ---------- sound: synthesized menu sounds, plus your intro music if there's a file for it
const Sound = (() => {
  let ctx, out, bus, sfx, padIn, padReady, music = null, bgm = null, on = store.get("couchSound") !== "off", foot = 0;
  let sfxVol = +(store.get("couchSfxVol") ?? 0.8), musicOn = store.get("couchMusic") !== "off";
  let musicVol = +(store.get("couchMusicVol") ?? 0.35), voiceOn = store.get("couchVoice") !== "off";
  // Your clips from web/audio/sbr, decoded once at load: slot -> [{ buf, voice, name }]. Variants
  // (launch-1, launch-2...) play at random; files with "-voice" in the name are character voice lines.
  const clips = {};
  const SLOT_OF = n => ({ "nav-move": "move", "tab-switch": "tab", "confirm-launch": "launch", launch: "launch", back: "back",
                          "control-center": "menu", "bgm-loop": "bgm" })[n.replace(/\.[^.]+$/, "").replace("-voice", "").replace(/-\d+$/, "")];

    if (!ctx) {
      ctx = new AudioContext();
      bus = ctx.createGain(); bus.connect(ctx.destination);  // every sound meets here; route() points it
      sfx = ctx.createGain(); sfx.connect(bus);              // the menu sounds (not music), which the grips feel too
      out = ctx.createGain(); out.gain.value = 0.55 * sfxVol;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 9000;

  let T = null;
  const now = () => { if (T === null) { T = ac().currentTime; queueMicrotask(() => { T = null; }); } return T; };
  function tone(freq, t0, dur, type = "sine", gain = 0.1, toFreq) {
    const c = ac(), t = now() + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t0, dur, f0, f1, gain = 0.12, q = 1.2, attack = 0.01) {
    const c = ac(), t = now() + t0, len = Math.ceil(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = "bandpass"; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + dur + 0.01);
    s.onended = () => { s.disconnect(); f.disconnect(); g.disconnect(); };

  function bell(freq, t0, dur, gain = 0.05, ratio = 1.41, bright = 1.2) {

    m.frequency.value = freq * ratio; o.frequency.value = freq;
    mg.gain.setValueAtTime(freq * bright, t); mg.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.8);  // bright strike, mellowing
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }

  // Slightly different every time, so a run of moves sounds like a horse, not a metronome.
  const clop = (t0, hi) => {
    const v = 0.96 + Math.random() * 0.08;

  const whir = t0 => { tone(150, t0, 0.3, "triangle", 0.04, 700); noise(t0, 0.28, 600, 3600, 0.2, 2.5); };  // steel ball spin-up
  const play = fn => { if (on) try { fn(); } catch {} };

  function clip(slot, gain = sfxVol) {
    const list = (clips[slot] || []).filter(c => voiceOn || !c.voice);
    if (!list.length) return false;

  // hear it most), bump, back and tab, menu and select, battery, launch; measured offline, 4 to 10 dB apart.
  const synth = {
    move: () => clop(0, (foot ^= 1)),                                 // clip-clop as you move
    tab: () => { noise(0, 0.2, 700, 3800, 0.33, 2); tone(170, 0, 0.18, "triangle", 0.075, 680); bell(1319, 0.07, 0.35, 0.075); },  // a steel ball spins and rings
    back: () => { noise(0, 0.16, 2800, 600, 0.34, 1.2); tone(240, 0, 0.05, "sine", 0.09, 110); },  // rope swish, with a light tap
    menu: () => { noise(0, 0.26, 400, 3000, 0.26, 1); bell(784, 0.12, 0.5, 0.08, 1.41, 0.8); bell(1175, 0.2, 0.45, 0.056, 1.41, 0.8); },  // swoosh up, two-note chime
    launch: () => {                                                   // gallop off + golden chord

      [392, 494, 587, 784].forEach((f, i) => bell(f, 0.62 + i * 0.07, 1.1, 0.1, 2, 0.5)); whir(0.55);

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(musicVol, 0.001), t + 2.5);
    s.connect(g).connect(bus); s.start(t);

    try { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t); g.gain.exponentialRampToValueAtTime(0.0001, t + fade); s.stop(t + fade + 0.05); } catch {}
  }
  function stopMusic(fade = 0.6) {
    if (!music) return;
    const t = ac().currentTime, { s, g } = music; music = null;
    try { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t); g.gain.exponentialRampToValueAtTime(0.0001, t + fade); s.stop(t + fade + 0.05); } catch {}
  }

    get on() { return on; },
    toggle() { on = !on; store.set("couchSound", on ? "on" : "off"); if (on) { this.select(); startBgm(); } else { stopMusic(); stopBgm(); } },
    unlock() { if (ctx && ctx.state === "suspended") ctx.resume(); },  // browsers start audio on the first press
    async loadClips(names) {

        const slot = SLOT_OF(name);
        if (!slot) return;
        try {
          const buf = await ac().decodeAudioData(await (await fetch("/audio/sbr/" + encodeURIComponent(name))).arrayBuffer());

        } catch {}  // a file that won't decode is skipped; the built-in sound stays

    has: slot => !!clips[slot]?.length,
    names: slot => (clips[slot] || []).map(c => c.name),
    get sfxVol() { return sfxVol; },
    set sfxVol(v) { sfxVol = v; store.set("couchSfxVol", v); if (out) out.gain.value = 0.55 * v; },
    get musicOn() { return musicOn; },
    set musicOn(v) { musicOn = v; store.set("couchMusic", v ? "on" : "off"); v ? startBgm() : stopBgm(); },
    get musicVol() { return musicVol; },
    set musicVol(v) { musicVol = v; store.set("couchMusicVol", v); if (bgm) bgm.g.gain.setTargetAtTime(Math.max(v, 0.0001), ac().currentTime, 0.1); },
    get voiceOn() { return voiceOn; },
    set voiceOn(v) { voiceOn = v; store.set("couchVoice", v ? "on" : "off"); },
    startBgm, stopBgm,
    test(slot) {  // the soundboard: plays a slot even with sounds off
      if (slot === "bgm") { if (clips.bgm) this.music(clips.bgm[0].buf, 8, Math.max(musicVol, 0.05), true); return; }
      clip(slot) || synth[slot]();
    },
    // where everything plays: "" = Windows' default (the TV), a device id = the DualSense speaker on USB,
    // "bt" = the TV and a DualSense over Bluetooth (through the server)
    async route(id) {
      const c = ac();
      if (id === "bt") padReady ||= c.audioWorklet.addModule(URL.createObjectURL(new Blob([`(${padTapWorklet})()`], { type: "text/javascript" })))
        .then(() => {
          const tap = new AudioWorkletNode(c, "pad-tap", { numberOfInputs: 2, numberOfOutputs: 0 }), lift = c.createGain(), limit = c.createDynamicsCompressor();
          tap.port.onmessage = e => PadLink.send(e.data);

          limit.threshold.value = -9; limit.knee.value = 3; limit.ratio.value = 20; limit.attack.value = 0.002; limit.release.value = 0.15;
          lift.connect(limit).connect(tap, 0, 0);

        });

      bus.disconnect(); bus.connect(c.destination);

      if (padIn) { bus.connect(padIn.lift); sfx.connect(padIn.tap, 0, 1); }  // speaker: everything; grips: menu sounds

    music(buf, seconds, gain, force, padOnly) {  // fades in, plays `seconds`, fades out (padOnly: not on the TV)

    stopMusic,
    move: () => cue("move"),
    tab: () => cue("tab"),
    menu: () => cue("menu"),
    bump: () => play(() => { tone(110, 0, 0.11, "sine", 0.23, 55); noise(0, 0.025, 500, 350, 0.29, 1.5, 0.002); }),  // can't go further: a dull wooden thud
    select: () => play(() => { tone(330, 0, 0.05, "sine", 0.15, 140); bell(659, 0, 0.22, 0.09, 2, 0.6); bell(988, 0.06, 0.32, 0.09, 2, 0.6); jingle(0.05); }),  // rising fifth + spurs
    back: () => cue("back"),
    open: () => play(synth.menu),
    battery: () => play(() => { bell(880, 0, 0.18, 0.105, 2, 0.4); bell(587, 0.2, 0.3, 0.105, 2, 0.4); }),  // controller low: falling, soft
    launch: () => { stopBgm(0.5); cue("launch"); },
    fanfare: () => play(() => {                                      // original "race start": gallop, bugle call, spurs
      [0, .11, .24, .42, .53, .66, .84, .95, 1.08].forEach((t, i) => clop(t, i % 3 === 2));
      [[392, 1.2, .2], [523, 1.4, .2], [659, 1.6, .2], [784, 1.8, 1]].forEach(([f, t, d]) => { tone(f, t, d, "sawtooth", 0.09); tone(f * 2, t, d, "triangle", 0.075); });

    }),

})();

// ---------- where launcher sounds play: the DualSense speaker, otherwise the TV. On a USB cable Windows has it
// as a sound device (device names need a media permission; the server pre-grants it in this page's own Edge
// profile, allow_audio_names, so there is no prompt). Over Bluetooth the server plays it ("bt", see PadLink).
const Out = {
  id: "", where: "TV",
  async detect() {
    if (PREVIEW) return;
    let id = "";
    try {
      const md = navigator.mediaDevices;
      let devs = await md.enumerateDevices();
      if (!devs.some(d => d.kind === "audiooutput" && d.label)) {
        const s = await md.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop());
        devs = await md.enumerateDevices();
      }
      id = devs.find(d => d.kind === "audiooutput" && /wireless controller|dualsense/i.test(d.label))?.deviceId || "";
    } catch {}
    if (!id) try { if ((await api("/api/padspeaker")).ok) id = "bt"; } catch {}
    if (id !== this.id) { this.id = id; this.where = { "": "TV", bt: "TV and controller" }[id] || "controller"; Sound.route(id); if (info) build(); updatePrompts(); }
  },
};
navigator.mediaDevices?.addEventListener?.("devicechange", () => Out.detect());

// Intro music: the first file in web/audio (e.g. the SBR opening, from your own copy). At startup it plays where
// the menu sounds do; when a game starts, only on the controller, so it never plays over the game on the TV.
const Intro = {
  buf: null,
  async get() {
    if (!info?.intro) return null;
    if (!this.buf) try { this.buf = await Sound.decode(await (await fetch("/audio/intro")).arrayBuffer()); } catch { return null; }
    return this.buf;
  },
  async play(when) {
    if (!Sound.on || (when === "launch" && !Out.id)) return;
    const buf = await this.get();
    if (buf) Sound.music(buf, when === "launch" ? 25 : 45, Out.id ? 0.6 : 0.35, false, when === "launch");
    else if (when === "startup") Sound.fanfare();
  },
};

// ---------- clock

// ---------- idle: after 10 minutes without input, a dark screen and a wandering clock; the next press only wakes it
const IDLE_MS = 10 * 60 * 1000;
let lastInput = Date.now();
function wake() {
  lastInput = Date.now();

  document.body.classList.remove("idle");

}

// ---------- controller battery (sent by the server as pad:<level>): a DualSense-style battery icon

    + (level === "wired" ? '<path d="M16.5 3l-5 7h4l-2 5 6-8h-4z" fill="#0b0d12"/>' : "") + `</svg><span>${label}</span>`;

// ---------- home backdrop: the show's official key art, crossfading slowly; a focused game's art covers it
const SKIES = ["/poster.webp", "/img/sbr-riders.jpg", "/img/sbr-race.jpg"];
let skyFront = $("#skyA"), skyBack = $("#skyB"), skyN = 0;
function nextSky() {
  const url = SKIES[skyN++ % SKIES.length], img = new Image();
  img.onload = () => {
    skyBack.style.setProperty("--art", `url("${url}")`);
    // fade from where the picture starts: a tall poster begins well right of a wide one

    skyBack.style.setProperty("--f0", Math.max(22, left) + "%");
    skyBack.style.setProperty("--f1", Math.max(52, left + 14) + "%");

    [skyFront, skyBack] = [skyBack, skyFront];

}
nextSky();
setInterval(() => { if (!document.hidden && !bgWant) nextSky(); }, 20000);

// ---------- backdrop: the focused game's art, crossfaded
let bgFront = $("#bgA"), bgBack = $("#bgB"), bgWant = null, bgTimer;
function setBackdrop(url) {
  if (url === bgWant) return;
  bgWant = url; clearTimeout(bgTimer);
  bgTimer = setTimeout(() => {
    if (!url) { bgFront.classList.remove("on"); return; }
    const img = new Image();
    img.onload = () => {

// ---------- details line for the focused tile

let updateTimer;
function build() {
  // what's running (launched from here, window still open): Resume / Close, like the PS5's first tile
  const now = $("#now"); now.innerHTML = "";
  $("#now-row").hidden = !info.running;
  if (info.running) {
    const name = info.running.name, g = info.games.find(g => g.name === name);
    for (const [ic, label, cta, cls, fn] of [
      ["resume", "Resume", "Resume", "", () => { padLight(gameLight); windowAction("resume"); }],
      ["close", "Close", "Close game", "danger", () => confirmAction(`Close ${name}?`, "Progress since your last save will be lost.", "Close game", async () => {
        toast(`Closing ${name}…`);
        await windowAction("close-game");
        setTimeout(refresh, 2500); setTimeout(refresh, 6000);
      })],
    ]) {
      const t = el("div", "item sys " + cls, `${icon(ic)}<span>${label}</span>${badge()}`);
      t.dataset.title = name; t.dataset.meta = "Running now"; t.dataset.cta = cta;
      if (g) t.dataset.hero = g.hero || `/art/${g.appid}/hero`;
      t.onactivate = fn; now.append(t);

  }

  const apps = $("#apps"); apps.innerHTML = "";
  for (const a of info.apps) {
    const t = el("div", "item app", `<span class="name">${esc(a.name)}</span>${badge()}`);
    const logo = new Image(); logo.alt = ""; logo.className = "appicon";  // the app's own icon, taken from its program by the server
    logo.onload = () => { t.classList.add("logo"); t.prepend(logo); };
    logo.src = `/appicon/${encodeURIComponent(a.id)}`;
    t.style.setProperty("--c", a.color || "#555");
    t.dataset.title = a.name;
    t.dataset.meta = a.meta || (a.kind === "web" ? "Opens full screen" : "");
    t.onactivate = () => launch({ id: a.id }, a.name, a.color && hexColor(a.color));
    apps.append(t);
  }

  const games = $("#games"); games.innerHTML = "";
  if (!info.games.length) games.append(el("div", "empty", info.hidden?.length ? "All your games are hidden. Show them again from the PC row." : "No Steam games installed."));
  for (const g of info.games) {
    const t = el("div", "item poster", `<img class="art" alt="" loading="lazy"><div class="name">${esc(g.name)}</div>${badge()}`);
    const img = t.querySelector(".art");
    img.onload = () => t.classList.add("loaded");
    img.onerror = () => {

      else t.classList.add("noart");
    };

    t.dataset.title = g.name;
    t.dataset.meta = g.update || g.meta || [ago(g.lastPlayed), playtime(g.playtime)].filter(Boolean).join(", ");
    t.dataset.hero = g.hero || `/art/${g.appid}/hero`;
    t.dataset.cta = g.update ? "Open Steam" : "Play";  // mid-update, Steam opens its download page, not the game
    t.game = g;  // for □ Details
    t.onactivate = () => launch(g.id ? { id: g.id } : { game: g.appid }, g.name, artColor(img));

  clearTimeout(updateTimer);
  if (info.games.some(g => g.update)) updateTimer = setTimeout(refresh, 20000);  // keep an update's % moving

  const sys = $("#system"); sys.innerHTML = "";
  for (const p of pcItems()) {
    const t = el("div", "item sys " + (p.cls || ""), `${icon(p.icon)}<span>${esc(p.label)}</span>${badge()}`);
    t.dataset.title = p.label; t.dataset.meta = p.meta; t.dataset.cta = p.cta;

  rows.forEach((row, r) => row.forEach((e, c) => {

    e.addEventListener("mouseenter", () => { if (!modal && performance.now() - lastPadAt > 1500 && (pos.r !== r || pos.c !== c)) { focus(r, c); Sound.move(); } });
    e.addEventListener("click", () => { if (!modal) { focus(r, c); Sound.select(); e.onactivate(); } });
  }));
  if (chosen) focus(Math.min(pos.r, rows.length - 1), lastCol[pos.r] ?? 0);

// Horizontal: glide the row (on a spring) so the tile is in view
function slide(e) {
  const track = e.parentElement, strip = track.parentElement;
  const padL = parseFloat(getComputedStyle(strip).paddingLeft) || 0, view = strip.clientWidth - 2 * padL;
  let x = +track.dataset.x || 0;
  const left = e.offsetLeft, w = e.offsetWidth;
  if (left < x) x = left; else if (left + w > x + view) x = left + w - view;
  x = Math.max(0, Math.min(x, Math.max(0, track.scrollWidth - view)));
  track.dataset.x = x; track.style.transform = `translateX(${-x}px)`;
}

function focus(r, c) {
  document.querySelectorAll("#rows .focus").forEach(e => e.classList.remove("focus"));
  r = Math.max(0, Math.min(rows.length - 1, r));
  c = Math.max(0, Math.min(rows[r].length - 1, c));
  pos = { r, c }; lastCol[r] = c; chosen = true;
  const e = rows[r][c]; e.classList.add("focus");
  document.querySelectorAll("#rows section").forEach(sec => sec.classList.toggle("active", sec.contains(e)));
  document.body.classList.add("chosen");
  showDetails(e);
  slide(e);
  // vertical: slide rows so the focused row is visible
  const sec = e.closest("section"), main = $("main");
  // rects, not offsetTop: once #rows has a transform it becomes the offsetParent.
  // Clamp at the bottom, but snap to a row start so no half-row peeks under the header.
  const box = $("#rows"), y0 = box.getBoundingClientRect().top;
  const tops = [...box.children].map(s => s.getBoundingClientRect().top - y0 - 4);
  const want = Math.min(sec.getBoundingClientRect().top - y0 - 4, box.scrollHeight - main.clientHeight);
  const shift = Math.max(0, tops.find(t => t >= want));
  box.style.transform = `translateY(${-shift}px)`;
  updatePrompts();
}

function move(dir) {
  if (modal) {
    if (modal.move) return modal.move(dir);
    const cur = modal.els[modal.i];
    if ((dir === "left" || dir === "right") && cur?.choice?.adjust) return cur.choice.adjust(dir === "left" ? -1 : 1, cur);
    const step = { left: -1, up: -1, right: 1, down: 1 }[dir];  // rows of buttons and lists alike
    if (step) {
      const i = Math.max(0, Math.min(modal.els.length - 1, modal.i + step));
      if (i === modal.i) return Sound.bump();
      modal.i = i; Sound.move();
      modal.els.forEach((e, k) => e.classList.toggle("focus", k === modal.i));
    }
    return;
  }
  if (!chosen) { focus(pos.r, 0); return Sound.move(); }  // first press just shows the highlight
  const before = pos.r + ":" + pos.c;
  if (dir === "left") focus(pos.r, pos.c - 1);
  if (dir === "right") focus(pos.r, pos.c + 1);
  if (dir === "up" && pos.r > 0) focus(pos.r - 1, lastCol[pos.r - 1] ?? 0);
  if (dir === "down" && pos.r < rows.length - 1) focus(pos.r + 1, lastCol[pos.r + 1] ?? 0);
  (pos.r + ":" + pos.c === before) ? Sound.bump() : Sound.move();
}
// L1/R1: previous/next category (row)
function category(step) {
  if (modal) return Sound.bump();
  if (!chosen) { focus(pos.r, 0); return Sound.move(); }
  const r = pos.r + step;
  if (r < 0 || r >= rows.length) return Sound.bump();
  focus(r, lastCol[r] ?? 0); Sound.tab();
}
function activate() {
  if (modal) {
    if (modal.activate) return modal.activate();
    const e = modal.els[modal.i]; if (e) { Sound.select(); e.onactivate(); } return;
  }
  if (!chosen) return;
  Sound.select(); rows[pos.r][pos.c].onactivate();
}
function back() { if (modal) { Sound.back(); modal.onBack(); } }

// ---------- the controllers' light bar (the server sets it): Steel Ball Run gold in the menu, and while a game
// starts and plays, its own colour: the most vivid part of its cover, or a store app's brand colour
const GOLD = [242, 184, 68];  // --gold
let gameLight = null;
const padLight = rgb => { if (!PREVIEW) api("/api/light", { rgb: rgb || GOLD }).catch(() => {}); };
// LED-ready: part of the grey taken out, then full brightness (a pastel would just light up white)
const ledColor = rgb => { const lo = Math.min(...rgb) * 0.6, c = rgb.map(v => v - lo), m = Math.max(...c); return m ? c.map(v => Math.round(v * 255 / m)) : null; };
const hexColor = h => ledColor([1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
function artColor(img) {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 16;
    const x = c.getContext("2d"); x.drawImage(img, 0, 0, 16, 16);
    const d = x.getImageData(0, 0, 16, 16).data, sum = [0, 0, 0]; let w = 0;
    for (let i = 0; i < d.length; i += 4) {
      const hi = Math.max(d[i], d[i + 1], d[i + 2]), lo = Math.min(d[i], d[i + 1], d[i + 2]);
      const k = hi ? ((hi - lo) / hi) ** 2 * hi / 255 : 0;  // saturated, bright pixels count most
      for (let j = 0; j < 3; j++) sum[j] += d[i + j] * k;
      w += k;
    }
    return w > 4 ? ledColor(sum) : null;  // a grey cover, or art from another site (unreadable): gold
  } catch { return null; }
}

// ---------- actions
let launching = false;
async function launch(body, name, rgb) {
  if (launching) return;
  launching = true; setTimeout(() => launching = false, 3000);
  gameLight = rgb; padLight(rgb);
  Sound.launch();
  Intro.play("launch");
  showStarting(name);
  try {
    const r = await api("/api/launch", body);
    if (!r.ok) { hideStarting(); toast(r.error || "Couldn't start it"); }
  } catch { hideStarting(); toast("Couch server isn't responding"); }
}

// The starting screen stays until the game's window takes the screen (the launcher loses focus),
// ○ hides it, or a minute passes. Hiding it never stops the game from starting.
let startTimer, slowTimer;
function showStarting(name) {
  $("#starting-title").textContent = name;
  $("#starting-note").textContent = "Starting…";
  clearTimeout(slowTimer); slowTimer = setTimeout(() => $("#starting-note").textContent = "Still starting. Big games can take a minute.", 10000);
  $("#starting").classList.add("show"); document.body.classList.add("modal", "starting");
  modal = { els: [], i: 0, onBack: hideStarting };
  clearTimeout(startTimer); startTimer = setTimeout(hideStarting, 60000);
  updatePrompts();
}
function hideStarting() {
  clearTimeout(startTimer); clearTimeout(slowTimer);
  document.body.classList.remove("starting");
  if (modal?.onBack === hideStarting) closeModal($("#starting"));
  updatePrompts();
}
addEventListener("blur", hideStarting);

function openModal(overlay, els, onBack, start = 0, sound = "open") {
  overlay.classList.add("show"); document.body.classList.add("modal"); Sound[sound]();
  modal = { els, i: start, onBack: onBack || (() => closeModal(overlay)) };
  els.forEach((e, i) => { e.classList.toggle("focus", i === start); e.onclick = () => { Sound.select(); e.onactivate(); }; });
  updatePrompts();
}
function closeModal(overlay) { overlay.classList.remove("show"); document.body.classList.remove("modal"); modal = null; updatePrompts(); }

// A dialog of choices ({label, sub, fn, cls, check, icon}); ○ closes it.
// vertical: a list (menu, audio outputs); start: which one is focused first; art + lines: a game's details.
function choose(title, text, choices, { vertical = false, start = 0, art = "", lines = [], sound = "open" } = {}) {
  const d = $("#dialog"), card = $("#dlg-card"), pic = $("#dlg-art");
  card.classList.toggle("art", !!art);
  if (art) pic.src = art; else pic.removeAttribute("src");
  $("#dlg-title").textContent = title;
  $("#dlg-text").textContent = text; $("#dlg-text").hidden = !text;
  $("#dlg-lines").innerHTML = lines.map(l => `<li>${esc(l)}</li>`).join(""); $("#dlg-lines").hidden = !lines.length;
  const els = choices.map(ch => {
    const { label, sub, fn, cls = "", check, icon: ic, stay, bar } = ch;
    const b = el("div", "item choice " + cls,
      `${ic ? icon(ic, "dev") : ""}<span>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</span>`
      + (bar != null ? `<span class="bar"><i style="width:${Math.round(bar * 100)}%"></i></span>` : "") + (check ? icon("check", "check") : ""));
    b.choice = ch;
    b.onactivate = () => { if (!stay) closeModal(d); if (fn) fn(b); };
    return b;
  });
  const c = $("#dlg-choices"); c.innerHTML = ""; c.append(...els); c.classList.toggle("vertical", vertical);
  openModal(d, els, null, start, sound);
}
// Cancel is focused first: these actions can't be undone
function confirmAction(title, text, yesLabel, onYes) {
  choose(title, text, [{ label: "Cancel" }, { label: yesLabel, fn: onYes, cls: "danger" }]);
}

// Audio output: Windows' default for everything; the server keeps it there when devices come and go
// "SAMSUNG (NVIDIA High Definition Audio)" -> ["Samsung", "NVIDIA High Definition Audio"]
function deviceName(full) {
  const m = /^(.*) \(([^()]*)\)$/.exec(full) || [, full, ""];
  const name = m[1] === m[1].toUpperCase() && m[1].length > 3 ? m[1][0] + m[1].slice(1).toLowerCase() : m[1];
  return [name, m[2]];
}
const deviceIcon = full => /headphone|headset|earbud|arctis|airpods|buds/i.test(full) ? "headphones"
  : /nvidia|amd|intel.*display|hdmi|displayport|samsung|lg|sony|tv/i.test(full) ? "tv" : "speaker";
async function pickAudio() {
  const a = await api("/api/audio").catch(() => null);
  if (!a) return toast("Couch server isn't responding");
  const list = a.devices.length ? a.devices : a.current ? [a.current] : [];
  if (!list.length) return toast("No audio outputs are on");
  choose("Audio output", "Games, videos and the PC play here, and it stays that way until you change it.",
    list.map(d => {
      const [label, sub] = deviceName(d.name);
      return { label, sub, icon: deviceIcon(d.name), check: d.id === a.current?.id, fn: () => setAudio(d) };
    }), { vertical: true, start: Math.max(0, list.findIndex(d => d.id === a.current?.id)) });
}
async function setAudio(d) {
  const r = await api("/api/audio", { id: d.id }).catch(() => null);
  if (!r?.ok) return toast(r?.error || "Couch server isn't responding");
  toast(`Sound now plays on ${deviceName(r.name)[0]}`);
  refresh();
}
function confirmPower(action, title, text) {
  confirmAction(title + "?", text, title, () => { toast(title + "…"); api("/api/power", { action }).catch(() => {}); });
}
function padOff() {
  api("/api/padoff", {}).then(r => toast(r.off ? "Controller off" : "No wireless controller connected")).catch(() => {});
}
function sleepNow() { toast("Sleeping…"); api("/api/power", { action: "sleep" }).catch(() => {}); }
function rebuildKeepFocus() { const r = pos.r, c = pos.c; build(); if (chosen) focus(r, c); }

// Sound settings (Menu > Sound): effects, volumes, menu music, voice lines, and a soundboard to test your clips.
// Up/down moves; left/right changes a volume.
function soundSettings(start = 0) {
  const pct = v => `${Math.round(v * 100)}%`;
  const slider = key => ({
    sub: `${pct(Sound[key])}. Left and right change it`, bar: Sound[key], stay: true,
    adjust(step, b) {
      Sound[key] = Math.max(0, Math.min(1, Math.round((Sound[key] + step * 0.1) * 10) / 10));
      b.querySelector(".bar i").style.width = pct(Sound[key]);
      b.querySelector("small").textContent = `${pct(Sound[key])}. Left and right change it`;
      if (key === "sfxVol") Sound.move();
    },
  });
  const again = i => () => { rebuildKeepFocus(); soundSettings(i); };
  choose("Sound", "", [
    { label: "Sound effects", sub: Sound.on ? `On, playing on the ${Out.where}` : "Off", icon: Sound.on ? "sound" : "mute",
      check: Sound.on, fn: () => { Sound.toggle(); again(0)(); } },
    { label: "Effects volume", icon: "sound", ...slider("sfxVol") },
    { label: "Menu music", icon: "music", check: Sound.musicOn,
      sub: !Sound.musicOn ? "Off" : Sound.has("bgm") ? "On" : "On, once you add bgm-loop.mp3",
      fn: () => { Sound.musicOn = !Sound.musicOn; again(2)(); } },
    { label: "Music volume", icon: "music", ...slider("musicVol") },
    { label: "Voice lines", icon: "voice", check: Sound.voiceOn, sub: Sound.voiceOn ? "On" : "Off: effects only",
      fn: () => { Sound.voiceOn = !Sound.voiceOn; again(4)(); } },
    { label: "Test sounds", icon: "resume", sub: "Hear each slot, with your clips or the built-in sounds", fn: soundboard },
  ], { vertical: true, start });
}
const SLOTS = [["move", "Move", "nav-move"], ["tab", "Category (L1 / R1)", "tab-switch"], ["launch", "Start a game", "launch-1"],
               ["back", "Back", "back"], ["menu", "Menu", "control-center"], ["bgm", "Menu music", "bgm-loop"]];
function soundboard() {
  choose("Test sounds", "Clips go in couch-remote/web/audio/sbr. A slot without one uses the built-in sound.",
    SLOTS.map(([slot, label, file]) => ({
      label, icon: "resume", stay: true, fn: () => Sound.test(slot),
      sub: Sound.has(slot) ? Sound.names(slot).join(", ") : slot === "bgm" ? `None yet (add ${file}.mp3)` : `Built-in (add ${file}.mp3)`,
    })), { vertical: true });
}
async function windowAction(action) {
  const r = await api("/api/window", { action }).catch(() => null);
  if (!r?.ok) { toast(r?.error || "Couch server isn't responding"); refresh(); }
}

// □ Details on a game: its cover, facts, and Play / Pin to front / Hide (the server keeps pins and hides)
function gameDetails() {
  const t = !modal && chosen && rows[pos.r][pos.c], g = t && t.game;
  if (!g) return Sound.bump();
  const gb = n => `${(n / 1e9).toFixed(n > 1e10 ? 0 : 1)} GB`;
  const lines = [ago(g.lastPlayed), g.playtime ? playtime(g.playtime).replace(" in total", " played") : "",
                 [g.size && `${gb(g.size)} on disk`, g.free && `${gb(g.free)} free`].filter(Boolean).join(", "),
                 g.appid ? "Steam" : g.meta || ""].filter(Boolean);
  choose(g.name, "", [
    { label: "Play", icon: "resume", fn: () => t.onactivate() },
    { label: g.pinned ? "Unpin" : "Pin to front", icon: "pin", fn: () => setChoice(g.pinned ? "unpin" : "pin", g) },
    { label: "Hide", icon: "eye", fn: () => setChoice("hide", g) },
  ], { art: t.classList.contains("loaded") ? t.querySelector(".art").src : "", lines });
}
async function setChoice(action, g) {
  const r = await api("/api/games", { action, key: g?.key }).catch(() => null);
  if (!r?.ok) return toast(r?.error || "Couch server isn't responding");
  toast({ pin: `${g?.name} pinned`, unpin: `${g?.name} unpinned`, hide: `${g?.name} hidden. Show it again from the PC row.`, "unhide-all": "Hidden games are back" }[action]);
  await refresh();
  if (g) {  // follow a pinned or unpinned game to its new place
    const i = rows[pos.r].findIndex(t => t.game?.key === g.key);
    if (i >= 0) focus(pos.r, i);
  } else {  // "Show all": go to the games, not to whatever slid under the cursor (Sleep)
    const r = rows.findIndex(row => row[0].closest("#games"));
    if (r >= 0) focus(r, 0);
  }
}

// Options button: the quick menu (everything in the PC row, from anywhere)
function quickMenu() {
  if (modal || !info) return Sound.bump();
  choose("Menu", "", pcItems().map(p => ({ label: p.label, sub: p.meta, icon: p.icon, fn: p.fn, cls: p.cls })), { vertical: true, sound: "menu" });
}

function showPhone() {
  const p = $("#phone");
  const url = info.urls?.[0];
  $("#phone-url").textContent = url || "(no Wi-Fi/Ethernet address found)";
  const q = $("#qr"); q.innerHTML = ""; q.style.display = "";
  if (url && window.qrcode) {
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    q.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  } else q.style.display = "none";
  openModal(p, [], () => closeModal(p));
}

// ---------- △ Search: an on-screen keyboard (or the phone's keyboard) filters your games and apps
const KEYS = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789", "space", "del"];
const keyPos = i => i < 26 ? [Math.floor(i / 13), i % 13, 1] : i < 36 ? [2, i - 26, 1] : i === 36 ? [2, 10, 2] : [2, 12, 1];  // [row, col, span]
let S = null;  // { q, zone: "keys" | "results", k, r, results: [{ el, orig }] }
function openSearch() {
  if (!info) return;
  S = { q: "", zone: "keys", k: 0, r: 0, results: [] };
  const keys = $("#keys"); keys.innerHTML = "";
  KEYS.forEach((k, i) => {
    const b = el("div", "key", k === "space" ? "Space" : k === "del" ? icon("del", "kicon") : k);
    b.style.gridColumn = `span ${keyPos(i)[2]}`;
    b.onclick = () => { S.zone = "keys"; S.k = i; searchActivate(); };
    keys.append(b);
  });
  $("#search").classList.add("show"); document.body.classList.add("modal"); Sound.open();
  modal = { search: true, els: [], i: 0, onBack: closeSearch, move: searchMove, activate: searchActivate, del: () => searchDelete() };
  renderSearch();
}
function closeSearch() { S = null; closeModal($("#search")); }
function renderSearch() {
  $("#sq-text").textContent = S.q;
  $("#sq-hint").hidden = !!S.q;
  const q = S.q.trim().toLowerCase();
  const pool = rows.flat().filter(t => t.closest("#apps, #games"));
  const hits = q ? pool.filter(t => (t.dataset.title || "").toLowerCase().includes(q)) : [];
  const box = $("#results"); box.innerHTML = ""; box.dataset.x = 0; box.style.transform = "";
  S.results = hits.map(orig => {
    const c = orig.cloneNode(true); c.classList.remove("focus");
    c.onclick = () => { closeSearch(); orig.onactivate(); };
    box.append(c); return { el: c, orig };
  });
  $("#sr-title").textContent = !q ? "" : hits.length ? `${hits.length} result${hits.length === 1 ? "" : "s"}` : "Nothing matches";
  if (!S.results.length) S.zone = "keys";
  S.r = Math.min(S.r, Math.max(0, S.results.length - 1));
  paintSearch();
}
function paintSearch() {
  [...$("#keys").children].forEach((b, i) => b.classList.toggle("focus", S.zone === "keys" && i === S.k));
  S.results.forEach(({ el }, i) => el.classList.toggle("focus", S.zone === "results" && i === S.r));
  if (S.zone === "results" && S.results[S.r]) slide(S.results[S.r].el);
  updatePrompts();
}
function searchMove(dir) {
  const before = `${S.zone}${S.k}:${S.r}`;
  if (S.zone === "keys") {
    const [row, col] = keyPos(S.k);
    if (dir === "left" && S.k > 0 && keyPos(S.k - 1)[0] === row) S.k--;
    else if (dir === "right" && S.k < KEYS.length - 1 && keyPos(S.k + 1)[0] === row) S.k++;
    else if (dir === "down" && row === 2) { if (S.results.length) S.zone = "results"; }
    else if (dir === "up" || dir === "down") {
      const tr = row + (dir === "up" ? -1 : 1);
      const n = KEYS.findIndex((_, i) => { const [r2, c2, s2] = keyPos(i); return r2 === tr && c2 <= col && col < c2 + s2; });
      if (n >= 0) S.k = n;
    }
  } else if (dir === "left" && S.r > 0) S.r--;
  else if (dir === "right" && S.r < S.results.length - 1) S.r++;
  else if (dir === "up") S.zone = "keys";
  `${S.zone}${S.k}:${S.r}` === before ? Sound.bump() : Sound.move();
  paintSearch();
}
function searchActivate() {
  if (S.zone === "results") {
    const hit = S.results[S.r];
    if (hit) { Sound.select(); closeSearch(); hit.orig.onactivate(); }
    return;
  }
  const k = KEYS[S.k];
  if (k === "del") return searchDelete();
  Sound.select();
  S.q = (S.q + (k === "space" ? " " : k)).slice(0, 30);
  renderSearch();
}
function searchDelete() {
  if (!S.q) return Sound.bump();
  Sound.back(); S.q = S.q.slice(0, -1); renderSearch();
}

// ---------- keyboard (also what Steam's desktop controller layout sends, and the phone's typing box)
// Once controller presses arrive from the server, ignore the keys Steam also sends for them,
// otherwise one press would count twice.
let padSeen = false;
addEventListener("keydown", e => {
  Sound.unlock();
  if (modal?.search && e.key.length === 1 && /[a-z0-9 ]/i.test(e.key)) {  // typing into the search
    e.preventDefault(); S.q = (S.q + e.key.toUpperCase()).slice(0, 30); renderSearch(); return;
  }
  if (modal?.search && e.key === "Backspace") { e.preventDefault(); S.q ? searchDelete() : back(); return; }
  const k = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
  const padKey = k || ["Enter", " ", "Escape", "Backspace"].includes(e.key);
  if (padKey) e.preventDefault();
  if (wake()) return;
  if (padSeen && padKey) return;
  if (k) move(k);
  else if (e.key === "PageUp" || e.key === "PageDown") { e.preventDefault(); category(e.key === "PageUp" ? -1 : 1); }
  else if (e.key === "Enter" || e.key === " ") activate();
  else if (e.key === "Escape" || e.key === "Backspace") back();
  else if (e.key === "/" || e.key === "y") { if (!modal) { Sound.select(); openSearch(); } }
  else if (e.key === "x") gameDetails();
  else if (e.key === "m") quickMenu();
  else if (e.key === "p") { if (!modal) { Sound.select(); showPhone(); } }
});

// ---------- controller: the server reads it (works with or without Steam) and streams presses here
let lastPadAt = -1e9;
function onPad(a) {
  if (a.startsWith("pad:")) { Out.detect(); return showPad(a.slice(4)); }  // a controller came or went
  padSeen = true; lastPadAt = performance.now(); Sound.unlock();
  if (wake()) return;
  if (a === "a") activate();
  else if (a === "b") back();
  else if (a === "l1" || a === "r1") category(a === "l1" ? -1 : 1);
  else if (a === "x") { if (modal?.del) modal.del(); else gameDetails(); }
  else if (a === "y") { if (modal) back(); else { Sound.select(); openSearch(); } }
  else if (a === "options") { if (modal) back(); else quickMenu(); }
  else move(a);
}
async function listenPad() {
  for (;;) {
    try {
      const r = await fetch("/api/events", { headers: { "X-Couch": "1" } });
      const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const msg = buf.slice(0, i); buf = buf.slice(i + 2);
          if (msg.startsWith("data: ")) onPad(msg.slice(6));
        }
      }
    } catch {}
    await new Promise(r => setTimeout(r, 2000)); // server restarting; try again
  }
}
listenPad();

// Fallback when the server can't read the controller (pygame missing): the browser's Gamepad API with the
// standard DualSense mapping. 0 ✕, 1 ○, 2 □, 3 △, 4 L1, 5 R1, 9 Options, 12-15 D-pad, left stick to move.
let gamepadOn = false;
function gamepadLoop() {
  if (gamepadOn) return;
  gamepadOn = true;
  const map = { 0: "a", 1: "b", 2: "x", 3: "y", 4: "l1", 5: "r1", 9: "options" };
  const dpad = { 12: "up", 13: "down", 14: "left", 15: "right" }, down = {}, held = {};
  (function poll() {
    const gp = [...(navigator.getGamepads?.() || [])].find(Boolean);
    if (gp) {
      const now = performance.now(), dirs = new Set();
      for (const [i, a] of Object.entries(map)) {
        const p = !!gp.buttons[i]?.pressed;
        if (p && !down[a]) onPad(a);
        down[a] = p;
      }
      for (const [i, d] of Object.entries(dpad)) if (gp.buttons[i]?.pressed) dirs.add(d);
      const [x = 0, y = 0] = gp.axes;
      if (x < -.6) dirs.add("left"); if (x > .6) dirs.add("right"); if (y < -.6) dirs.add("up"); if (y > .6) dirs.add("down");
      for (const d of ["up", "down", "left", "right"]) {   // repeat while held, like the server does
        if (!dirs.has(d)) { delete held[d]; continue; }
        if (!(d in held)) { held[d] = now + 380; onPad(d); }
        else if (now >= held[d]) { held[d] = now + 110; onPad(d); }
      }
    }
    requestAnimationFrame(poll);
  })();
}

// ---------- load
async function load() {
  try {
    info = await api("/api/info");
    if (info.running) pos.r = 0;  // reloaded mid-game: first press lands on Resume
    build();
    if (info.padReader === false) gamepadLoop();  // null = the server's reader is still starting
    const clipsReady = Sound.loadClips(info.sounds || []);  // decoded in the background; nothing waits on it
    padLight();  // gold while you're in the menu
    if (!PREVIEW) {
      await Out.detect(); await clipsReady;
      if (Sound.has("bgm") && Sound.musicOn) Sound.startBgm(); else Intro.play("startup");
    }
  } catch { $("#games").innerHTML = '<div class="empty">Couch server isn\'t running. Trying again…</div>'; setTimeout(load, 3000); }
}
updatePrompts();
load();
// Re-read the library and what's running. The Now playing row coming or going shifts every row by one.
async function refresh(toResume) {
  if (!info) return;
  let i;
  try { i = await api("/api/info"); } catch { return; }
  const shift = !!i.running - !!info.running;
  if (shift > 0) lastCol.unshift(0); else if (shift < 0) lastCol.shift();
  pos.r = Math.max(0, pos.r + shift);
  info = i;
  build();
  if (toResume && info.running) focus(0, 0);  // back from the game: Resume is where you'd want to be
}
addEventListener("focus", () => { wake(); refresh(true); Out.detect(); padLight(); if (!PREVIEW) Sound.startBgm(); });
</script>
</body>
