<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couch Launcher</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* Poster look: lavender polka dots on purple, pink script with a cyan rim, Johnny's cyan, Gyro's green,
     a gold horseshoe. Layout and buttons follow the PS5 home screen. */
  :root {
    --deep: #24104a; --purple: #5b2fa6; --pink: #e0306e; --johnny: #5ec8ef; --gyro: #6fae3e;
    --gold: #f2b844; --ink: #ffffff; --dim: #cdbfe8;
    --ps-cross: #7ea6ff; --ps-circle: #ff6f7d; --ps-tri: #43d6b0; --ps-square: #f08bd8;
    --logo: "Lobster", "Segoe Script", cursive;
    --ui: "Archivo","Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --tile: 17vh; --poster-h: 28vh;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--deep); color: var(--ink); font: 500 2vh/1.3 var(--ui); cursor: default; user-select: none; }

  /* ---------- backdrop */
  .sky { position: fixed; inset: 0; background:
      url("/poster.webp") right top / auto 100% no-repeat,
      radial-gradient(circle, rgba(232,216,255,.62) 0 2.4vh, rgba(232,216,255,.22) 2.9vh, transparent 3.3vh) 0 0 / 9vh 9vh,
      radial-gradient(140vw 100vh at 30% 10%, #9466dc 0%, var(--purple) 45%, var(--deep) 100%); }
  .bg { position: fixed; inset: 0; background-size: cover; background-position: center 30%; opacity: 0;
        transition: opacity .7s ease; filter: saturate(1.1) brightness(.6); }
  .bg.on { opacity: 1; }
  .shade { position: fixed; inset: 0; background:
      linear-gradient(90deg, rgba(36,16,74,.92) 0%, rgba(36,16,74,.5) 48%, rgba(36,16,74,.1) 100%),
      linear-gradient(0deg, rgba(24,10,52,.96) 0%, rgba(24,10,52,.2) 55%, rgba(24,10,52,.5) 100%); }
  .spiral-mark { position: fixed; right: -14vh; bottom: -20vh; width: 78vh; height: 78vh; opacity: .08; color: var(--gold); pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .app-shell { position: relative; height: 100%; animation: enter .45s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(1.5vh); } }

  /* ---------- header */
  header { display: flex; align-items: center; justify-content: space-between; height: 11vh; padding: 2.6vh 5vw 0; }
  .brand { display: flex; align-items: center; gap: 1.4vw; }
  .brand h1 { margin: 0; font: 400 5.6vh/1 var(--logo); color: var(--pink); -webkit-text-stroke: .18vh #fff;
              text-shadow: .35vh .35vh 0 var(--johnny), .7vh .7vh 1.4vh rgba(0,0,0,.45); transform: rotate(-4deg); }
  .brand .mark { width: 4.4vh; height: 4.4vh; filter: drop-shadow(0 .3vh .4vh rgba(0,0,0,.5)); }
  .time { text-align: right; }
  #clock { font: 600 3.6vh/1 var(--ui); font-variant-numeric: tabular-nums; }
  #date, #pad { color: var(--dim); font-size: 1.9vh; margin-top: .5vh; }
  #pad.low { color: var(--ps-circle); }
  /* idle: dark screen with a wandering clock so the TV doesn't hold a still image for hours */
  #idle { position: fixed; inset: 0; background: #05020c; opacity: 0; pointer-events: none; transition: opacity 1.2s; z-index: 30; }
  body.idle #idle { opacity: 1; }  /* nothing still and bright on the TV, just the clock */
  #idle-clock { position: absolute; font: 600 6vh/1 var(--ui); color: #8a80a0; font-variant-numeric: tabular-nums; }

  /* ---------- details of the focused tile (PS5 game hub) */
  .details { position: relative; height: 20vh; padding: .6vh 5vw 0; }
  #d-title { margin: 0; font: 800 7.2vh/1.02 var(--ui); font-stretch: 75%; max-width: 70vw;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 .4vh 1.6vh rgba(0,0,0,.6); }
  #d-meta { color: var(--dim); font-size: 2vh; margin-top: .5vh; min-height: 1.3em; max-width: 70vw;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cta { display: inline-flex; align-items: center; gap: 1vh; margin-top: 1.4vh; padding: 1vh 3vh 1vh 1.2vh; border-radius: 99vh;
         background: #fff; color: #1a0d33; font: 800 2.1vh/1 var(--ui); box-shadow: 0 .8vh 2.4vh rgba(0,0,0,.35); }
  .cta .glyph { background: #1a0d33; }
  body:not(.chosen) .cta { visibility: hidden; } /* ✕ does nothing until a tile is selected */
  .details.swap #d-title { animation: dash .38s cubic-bezier(.2,.9,.2,1); }
  @keyframes dash { from { opacity: 0; transform: translateX(-3vw) skewX(-12deg); } to { opacity: 1; transform: none; } }
  #sfx { position: absolute; right: 7vw; top: 0; font: 900 6vh/1 "Yu Gothic UI", "Meiryo", "MS Gothic", sans-serif; color: var(--pink);
         -webkit-text-stroke: .22vh #fff; letter-spacing: -.05em; opacity: 0; transform: skewX(-14deg); pointer-events: none;
         text-shadow: .3vh .3vh 0 var(--johnny); }
  #sfx span { display: inline-block; }
  .details.swap #sfx { animation: menace 1.6s ease-out; }
  .details.swap #sfx span:nth-child(1) { animation: shake .18s 4 linear; }
  .details.swap #sfx span:nth-child(2) { animation: shake .18s .06s 4 linear; font-size: .82em; }
  .details.swap #sfx span:nth-child(3) { animation: shake .18s .12s 4 linear; font-size: .66em; }
  @keyframes menace { 0% { opacity: 0; transform: skewX(-14deg) translateY(1vh) scale(.9); } 12% { opacity: .95; transform: skewX(-14deg) scale(1.04); }
                      70% { opacity: .75; } 100% { opacity: 0; transform: skewX(-14deg) translateY(-1vh); } }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(.25vh,-.2vh); } 75% { transform: translate(-.25vh,.2vh); } }
  /* Windows "Animation effects" off: keep ゴゴゴ as a fade, stop spinning, shaking and sliding */
  @media (prefers-reduced-motion: reduce) {
    .app-shell, .details.swap #d-title, .details.swap #sfx span, .item.focus .badge img, .card, .overlay.show, .launch .ball { animation: none !important; }
    .details.swap #sfx { animation: fade-sfx 1.6s ease-out; }
    #rows, .item, .item .badge { transition: opacity .2s, box-shadow .2s, filter .2s; }
    .item.focus, .card .choice.focus { transform: none; }
  }
  @keyframes fade-sfx { 12% { opacity: .95; } 70% { opacity: .75; } 100% { opacity: 0; } }

  /* ---------- rows (PS5 tiles) */
  main { height: calc(100% - 11vh - 20vh - 7vh); overflow: hidden;
         -webkit-mask-image: linear-gradient(#000 calc(100% - 4vh), transparent); mask-image: linear-gradient(#000 calc(100% - 4vh), transparent); }
  #rows { transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  section { padding: .4vh 0 .2vh; opacity: .55; transition: opacity .3s; }
  section.active, body:not(.chosen) section { opacity: 1; }
  section h2 { display: flex; align-items: baseline; gap: 1vw; margin: 0 0 0 5vw; font: 600 2vh/1 var(--ui); color: var(--dim); }
  .strip { display: flex; gap: 1.4vw; padding: 3vh 5vw 2.4vh; overflow: hidden; scroll-behavior: smooth; }

  .item { flex: 0 0 auto; position: relative; border-radius: 1.6vh; outline: none; cursor: pointer;
          box-shadow: 0 1.2vh 2.4vh rgba(10,4,24,.45);
          transition: transform .18s ease, box-shadow .18s ease, filter .18s; filter: brightness(.82); }
  .item.focus { transform: scale(1.1); z-index: 3; filter: none;
                box-shadow: 0 0 0 .35vh #fff, 0 2.4vh 4vh rgba(0,0,0,.55); }
  .item .badge { position: absolute; top: -2.4vh; right: -2.4vh; width: 6.2vh; height: 6.2vh; opacity: 0;
                 transform: scale(.4) rotate(-90deg); transition: opacity .2s, transform .35s cubic-bezier(.2,.9,.3,1.4); pointer-events: none;
                 filter: drop-shadow(0 .3vh .6vh rgba(0,0,0,.7)); }
  .item.focus .badge { opacity: 1; transform: scale(1); }
  .item .badge img { width: 100%; height: 100%; display: block; }
  .item.focus .badge img { animation: spin .9s linear infinite; }

  .app { width: var(--tile); height: var(--tile); display: flex; flex-direction: column; justify-content: flex-end; padding: 1.6vh;
         background: var(--c); }
  .app .name { font: 800 3.2vh/.95 var(--ui); font-stretch: 75%; }
  /* with the app's real icon: a dark card tinted by the brand colour, the icon centred, the name as a caption */
  .app.logo { justify-content: center; align-items: center; background: color-mix(in srgb, var(--c) 28%, #13082b); }
  .app.logo .appicon { width: 9.2vh; height: 9.2vh; object-fit: contain; margin-bottom: 2.2vh; filter: drop-shadow(0 .6vh 1.2vh rgba(0,0,0,.35)); }
  .app.logo .name { position: absolute; left: 1vh; right: 1vh; bottom: 1.5vh; text-align: center; font: 700 1.7vh/1.1 var(--ui); color: var(--dim); }
  .app.logo.focus .name { color: #fff; }

  .poster { width: calc(var(--poster-h) * 2 / 3); height: var(--poster-h); background: linear-gradient(160deg, var(--purple), var(--deep)); }
  .poster .art { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; opacity: 0; transition: opacity .4s ease; }
  .poster.loaded .art { opacity: 1; }
  .poster .name { position: absolute; inset: auto 0 0 0; padding: 4vh 1.2vh 1.2vh; font: 700 1.8vh/1.15 var(--ui);
                  background: linear-gradient(transparent, rgba(24,10,52,.92)); border-radius: 0 0 1.6vh 1.6vh; }
  .poster.loaded .name { display: none; }  /* the name shows until the art arrives, or if there is none */
  .poster.noart .art { display: none; }

  .sys { width: 13vh; height: 13vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vh;
         font: 700 1.9vh/1.1 var(--ui); text-align: center; background: #301866; }
  .sys svg.icon { width: 4.4vh; height: 4.4vh; color: #fff; }
  .sys.danger svg.icon { color: var(--ps-circle); }
  .empty { color: var(--dim); padding: 2vh 0; }

  /* ---------- PlayStation-style button glyphs */
  .glyph { display: inline-grid; place-items: center; width: 3.2vh; height: 3.2vh; border-radius: 50%; background: rgba(10,4,24,.75);
           box-shadow: 0 0 0 .15vh rgba(255,255,255,.25) inset; vertical-align: middle; }
  .glyph svg { width: 1.7vh; height: 1.7vh; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .g-cross svg { stroke: var(--ps-cross); } .g-circle svg { stroke: var(--ps-circle); } .g-tri svg { stroke: var(--ps-tri); } .g-square svg { stroke: var(--ps-square); }

  /* ---------- footer, toast, dialogs */
  footer { position: fixed; left: 0; right: 0; bottom: 0; height: 7vh; display: flex; align-items: center; gap: 2.6vw; padding: 0 5vw;
           color: var(--ink); font-size: 2vh; font-weight: 600; background: linear-gradient(transparent, rgba(16,6,36,.85)); }
  footer > span { display: inline-flex; align-items: center; gap: .8vh; }
  footer .sound { margin-left: auto; color: var(--dim); }
  body:not(.modal) footer .back { display: none; } /* ○ only does something in a dialog */
  body:not(.on-game) footer .opts, body.modal footer .opts { display: none; } /* □ only does something on a game */
  #toast { position: fixed; right: 3vw; top: 3vh; transform: translateX(4vw); opacity: 0; transition: all .3s ease;
           background: #1c0c3c; color: #fff; padding: 1.6vh 2.4vh; border-radius: 1.4vh;
           font: 600 2vh/1.3 var(--ui); box-shadow: 0 1.4vh 3vh rgba(0,0,0,.5); pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; transform: none; }
  .overlay { position: fixed; inset: 0; background: rgba(14,6,32,.78); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.show { display: flex; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } }
  .card { position: relative; background: rgba(34,18,70,.96); color: #fff; border-radius: 2.4vh; padding: 4vh 4.5vw; text-align: center; max-width: 80vw;
          border: 1px solid rgba(255,255,255,.12); box-shadow: 0 3vh 6vh rgba(0,0,0,.55); animation: pop .28s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  .card h3 { margin: 0 0 1vh; font: 800 3.6vh/1.1 var(--ui); }
  .card p { margin: .6vh 0; color: var(--dim); font-size: 2vh; }
  .card .choices { display: flex; gap: 1.6vw; justify-content: center; margin-top: 3vh; }
  .card .choice { padding: 1.5vh 4vh; border-radius: 99vh; font: 700 2.1vh/1 var(--ui); background: rgba(255,255,255,.12); color: #fff; filter: none; }
  .card .choice.focus { background: #fff; color: #1a0d33; transform: scale(1.06); }
  .card .choice.danger.focus { color: #c0203a; }
  /* list dialogs (audio outputs): full-width rows, a second line, a check on the current one */
  .card .choices.vertical { flex-direction: column; align-items: stretch; gap: 1vh; min-width: 38vw; }
  .card .choices.vertical .choice { display: flex; align-items: center; gap: 2vh; padding: 1.8vh 2.6vh; border-radius: 1.6vh; text-align: left; }
  .card .choice small { display: block; margin-top: .6vh; font: 500 1.7vh/1.2 var(--ui); color: var(--dim); }
  .card .choice.focus small { color: #5b4a80; }
  .card .choice .check { width: 2.8vh; height: 2.8vh; margin-left: auto; flex: none; color: var(--johnny); }
  .card .choice.focus .check { color: #1a0d33; }
  .card .choice .dev { width: 3.6vh; height: 3.6vh; flex: none; color: var(--dim); }
  .card .choice.focus .dev { color: #1a0d33; }
  /* starting a game: the steel ball spins over the game's art until its window takes the screen */
  #starting { background: radial-gradient(60vw 60vh at 50% 50%, rgba(14,6,32,.6), rgba(14,6,32,.15)); backdrop-filter: none; }
  .app-shell { transition: opacity .35s ease; }
  body.starting .app-shell { opacity: 0; }                       /* just the game's art behind the ball */
  body.starting .shade { opacity: .55; }
  .shade { transition: opacity .6s ease; }
  body.starting footer > span:not(.back) { visibility: hidden; }  /* only ○ does something here */
  body.starting .bg { filter: saturate(1.1) brightness(.8); transition: opacity .7s ease, filter .6s ease; }
  .launch { text-align: center; max-width: 80vw; }
  .launch .ball { width: 13vh; height: 13vh; animation: spin .9s linear infinite; filter: drop-shadow(0 1vh 2vh rgba(0,0,0,.6)); }
  .launch h3 { margin: 3.4vh 0 1.2vh; font: 800 7vh/1.02 var(--ui); font-stretch: 75%; text-shadow: 0 .4vh 2vh rgba(0,0,0,.7); }
  .launch p { margin: 0; color: var(--dim); font-size: 2.2vh; }
  #qr { background: #fff; padding: 1.4vh; border-radius: 1.4vh; display: inline-block; margin: 2vh 0; }
  #qr svg { display: block; width: 30vh; height: 30vh; }
  .url { font-family: Consolas, monospace; color: #fff !important; }
</style>
</head>
<body>
<div class="sky"></div>
<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
<div class="shade"></div>
<svg class="spiral-mark" viewBox="0 0 2 2"><use href="#spiral"/></svg>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="spiral" viewBox="-1 -1 2 2"><path id="spiral-path" fill="none" stroke="currentColor" stroke-width=".06" stroke-linecap="round"/></symbol>
    <symbol id="horseshoe" viewBox="-1 -1 2 2"><path d="M-.55-.82V-.05A.55.55 0 0 0 .55-.05V-.82" fill="none" stroke="#f2b844" stroke-width=".3" stroke-linecap="round"/><path d="M-.55-.82V-.05A.55.55 0 0 0 .55-.05V-.82" fill="none" stroke="#ffe19a" stroke-width=".08" stroke-linecap="round" transform="translate(-.05 -.03)"/><g fill="#6b4a10"><circle cx="-.55" cy="-.5" r=".05"/><circle cx="-.5" cy="-.15" r=".05"/><circle cx=".55" cy="-.5" r=".05"/><circle cx=".5" cy="-.15" r=".05"/></g></symbol>
    <symbol id="g-cross" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol>
    <symbol id="g-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
    <symbol id="g-tri" viewBox="0 0 24 24"><path d="M12 4l9 15H3z"/></symbol>
    <symbol id="g-square" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><circle cx="12" cy="14.5" r="3.5"/><path d="M12 7h.01"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-resume" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"/></symbol>
  </defs>
</svg>

<div class="app-shell">
  <header>
    <div class="brand"><svg class="mark" viewBox="0 0 2 2"><use href="#horseshoe"/></svg><h1>Couch</h1></div>
    <div class="time"><div id="clock">--:--</div><div id="date"></div><div id="pad"></div></div>
  </header>
  <div class="details" id="details">
    <h2 id="d-title">Pick something to play</h2>
    <div id="d-meta"></div>
    <div class="cta"><span class="glyph g-cross"><svg viewBox="0 0 24 24"><use href="#g-cross"/></svg></span><span id="d-cta">Open</span></div>
    <div id="sfx" aria-hidden="true"><span>ゴ</span><span>ゴ</span><span>ゴ</span></div>
  </div>
  <main><div id="rows">
    <section id="now-row" hidden><h2>Now playing</h2><div class="strip" id="now"></div></section>
    <section><h2>Apps</h2><div class="strip" id="apps"></div></section>
    <section><h2>Games</h2><div class="strip" id="games"><div class="empty">Loading games…</div></div></section>
    <section><h2>PC</h2><div class="strip" id="system"></div></section>
  </div></main>
</div>
<footer>
  <span><span class="glyph g-cross"><svg viewBox="0 0 24 24"><use href="#g-cross"/></svg></span>Select</span>
  <span class="back"><span class="glyph g-circle"><svg viewBox="0 0 24 24"><use href="#g-circle"/></svg></span>Back</span>
  <span class="opts"><span class="glyph g-square"><svg viewBox="0 0 24 24"><use href="#g-square"/></svg></span>Options</span>
  <span><span class="glyph g-tri"><svg viewBox="0 0 24 24"><use href="#g-tri"/></svg></span>Phone remote</span>
  <span class="sound" id="sound-hint"></span>
</footer>
<div id="toast"></div>
<div id="idle"><div id="idle-clock"></div></div>
<div class="overlay" id="dialog"><div class="card">
  <h3 id="dlg-title"></h3><p id="dlg-text"></p>
  <div class="choices" id="dlg-choices"></div>
</div></div>
<div class="overlay" id="starting"><div class="launch">
  <img class="ball" src="/steelball.png" alt="">
  <h3 id="starting-title"></h3>
  <p id="starting-note"></p>
</div></div>
<div class="overlay" id="phone"><div class="card">
  <h3>Phone remote</h3>
  <p>Scan with your phone's camera (same Wi-Fi as this PC).</p>
  <div id="qr"></div>
  <p>Or open <span class="url" id="phone-url"></span></p>
  <p>Press ○ to close</p>
</div></div>

<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = (path, body) => fetch(path, body === undefined
  ? { headers: { "X-Couch": "1" } }
  : { method: "POST", headers: { "X-Couch": "1", "Content-Type": "application/json" }, body: JSON.stringify(body) }
).then(r => r.json());
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let info = null;
let rows = [];            // arrays of focusable elements, one per row
let pos = { r: 1, c: 0 };  // where the first press lands (first game)
let chosen = false;        // nothing is selected until you move, so ✕ can't launch by accident
const lastCol = [];
let modal = null;         // { els: [...], i, onBack }

// ---------- golden spiral (r grows by the golden ratio every quarter turn)
(() => {
  const phi = (1 + Math.sqrt(5)) / 2, b = Math.log(phi) / (Math.PI / 2), turns = 4.25, steps = 260;
  const maxT = turns * 2 * Math.PI, a = 0.92 / Math.exp(b * maxT);
  let d = "";
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * maxT, r = a * Math.exp(b * t);
    d += (i ? "L" : "M") + (r * Math.cos(t)).toFixed(4) + " " + (r * Math.sin(t)).toFixed(4);
  }
  $("#spiral-path").setAttribute("d", d);
})();
const badge = () => '<span class="badge"><img src="/steelball.png" alt=""></span>';
const icon = (name, cls = "icon") =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${name}"/></svg>`;

// ---------- sound: everything is synthesized, no files
const Sound = (() => {
  let ctx, out, on = store.get("couchSound") !== "off", foot = 0;
  function ac() {
    if (!ctx) {
      ctx = new AudioContext();
      out = ctx.createGain(); out.gain.value = 0.55;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 9000;
      out.connect(lp).connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, t0, dur, type = "sine", gain = 0.1, toFreq) {
    const c = ac(), t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t0, dur, f0, f1, gain = 0.12, q = 1.2) {
    const c = ac(), t = c.currentTime + t0, len = Math.ceil(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = "bandpass"; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + dur);
  }
  const clop = (t0, hi) => { tone(hi ? 340 : 270, t0, 0.07, "sine", 0.22, hi ? 120 : 95); noise(t0, 0.03, 2600, 1800, 0.06, 3); };
  const jingle = t0 => [2350, 3120, 4060].forEach((f, i) => tone(f * (0.98 + Math.random() * 0.04), t0 + i * 0.018, 0.22, "triangle", 0.035));
  const whir = t0 => { tone(140, t0, 0.35, "sawtooth", 0.025, 900); noise(t0, 0.3, 600, 4000, 0.05, 6); }; // steel ball spin-up
  const play = fn => { if (on) try { fn(); } catch {} };
  return {
    get on() { return on; },
    toggle() { on = !on; store.set("couchSound", on ? "on" : "off"); if (on) this.select(); },
    move: () => play(() => clop(0, (foot ^= 1))),                    // clip-clop as you move
    bump: () => play(() => tone(95, 0, 0.12, "sine", 0.18, 60)),     // can't go further
    select: () => play(() => { tone(660, 0, 0.09, "triangle", 0.08); tone(990, 0.05, 0.16, "triangle", 0.08); jingle(0.03); whir(0); }),
    back: () => play(() => noise(0, 0.2, 2400, 500, 0.14, 0.9)),     // rope swish
    open: () => play(() => { noise(0, 0.32, 400, 3200, 0.09, 0.8); tone(784, 0.22, 0.3, "sine", 0.06); }),
    launch: () => play(() => {                                       // gallop off + golden chord
      [0, .09, .2, .36, .45, .56].forEach((t, i) => clop(t, i % 3 === 2));
      [392, 494, 587, 784].forEach((f, i) => tone(f, 0.62 + i * 0.07, 0.9, "triangle", 0.06)); whir(0.55);
      jingle(0.62);
    }),
  };
})();
function soundHint() { $("#sound-hint").innerHTML = `${icon(Sound.on ? "sound" : "mute", "icon")}`.replace('class="icon"', 'class="icon" style="width:2.6vh;height:2.6vh;vertical-align:middle;margin-right:.6vw"') + (Sound.on ? "Menu sounds on" : "Menu sounds off"); }
soundHint();

// ---------- clock
function tick() {
  const d = new Date();
  $("#clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  $("#date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  $("#idle-clock").textContent = $("#clock").textContent;
}
tick(); setInterval(tick, 10000);

// ---------- idle: after 10 minutes without input, dim to a wandering clock; the next press only wakes it
const IDLE_MS = 10 * 60 * 1000;
let lastInput = Date.now();
function wake() {
  lastInput = Date.now();
  if (!document.body.classList.contains("idle")) return false;
  document.body.classList.remove("idle");
  return true;
}
function placeIdleClock() {
  const c = $("#idle-clock");
  c.style.left = 5 + Math.random() * 75 + "vw"; c.style.top = 5 + Math.random() * 80 + "vh";
}
setInterval(() => {
  if (document.body.classList.contains("idle")) placeIdleClock();
  else if (!modal && Date.now() - lastInput > IDLE_MS) { placeIdleClock(); document.body.classList.add("idle"); }
}, 60000);
addEventListener("mousemove", wake);

// ---------- controller battery (sent by the server as pad:<level>)
function showPad(level) {
  const p = $("#pad");
  p.textContent = { none: "No controller", empty: "Controller battery empty", low: "Controller battery low",
                    medium: "Controller battery half", wired: "Controller charging" }[level] || "";
  p.classList.toggle("low", level === "empty" || level === "low");
}

// ---------- toast
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

// ---------- backdrop: the focused game's art, crossfaded
let bgFront = $("#bgA"), bgBack = $("#bgB"), bgWant = null, bgTimer;
function setBackdrop(url) {
  if (url === bgWant) return;
  bgWant = url; clearTimeout(bgTimer);
  bgTimer = setTimeout(() => {
    if (!url) { bgFront.classList.remove("on"); return; }
    const img = new Image();
    img.onload = () => {
      if (bgWant !== url) return;
      bgBack.style.backgroundImage = `url("${url}")`;
      bgBack.classList.add("on"); bgFront.classList.remove("on");
      [bgFront, bgBack] = [bgBack, bgFront];
    };
    img.onerror = () => { if (bgWant === url) bgFront.classList.remove("on"); };
    img.src = url;
  }, 140);
}

// ---------- details line for the focused tile
function ago(sec) {
  if (!sec) return "Not played yet";
  const days = Math.floor((Date.now() / 1000 - sec) / 86400);
  return days <= 0 ? "Last played today" : days === 1 ? "Last played yesterday" : `Last played ${days} days ago`;
}
function playtime(min) {
  if (!min) return "";
  if (min < 60) return `${min} minute${min === 1 ? "" : "s"} in total`;
  const h = Math.round(min / 60);
  return `${h} hour${h === 1 ? "" : "s"} in total`;
}
function showDetails(e) {
  const d = $("#details");
  $("#d-title").textContent = e.dataset.title || "";
  $("#d-meta").textContent = e.dataset.meta || "";
  $("#d-cta").textContent = e.dataset.cta || "Open";
  d.classList.remove("swap"); void d.offsetWidth; d.classList.add("swap");
  setBackdrop(e.dataset.hero || null);
}

// ---------- build
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function build() {
  // what's running (launched from here, window still open): Resume / Close, like the PS5's first tile
  const now = $("#now"); now.innerHTML = "";
  $("#now-row").hidden = !info.running;
  if (info.running) {
    const name = info.running.name, g = info.games.find(g => g.name === name);
    for (const [ic, label, cta, cls, fn] of [
      ["resume", "Resume", "Resume", "", () => windowAction("resume")],
      ["close", "Close", "Close game", "danger", () => confirmAction(`Close ${name}?`, "Progress since your last save will be lost.", "Close game", async () => {
        toast(`Closing ${name}…`);
        await windowAction("close-game");
        setTimeout(refresh, 2500); setTimeout(refresh, 6000);
      })],
    ]) {
      const t = el("div", "item sys " + cls, `${icon(ic)}<span>${label}</span>${badge()}`);
      t.dataset.title = name; t.dataset.meta = "Running now"; t.dataset.cta = cta;
      if (g) t.dataset.hero = g.hero || `/art/${g.appid}/hero`;
      t.onactivate = fn; now.append(t);
    }
  }

  const apps = $("#apps"); apps.innerHTML = "";
  for (const a of info.apps) {
    const t = el("div", "item app", `<span class="name">${esc(a.name)}</span>${badge()}`);
    const logo = new Image(); logo.alt = ""; logo.className = "appicon";  // the app's own icon, taken from its program by the server
    logo.onload = () => { t.classList.add("logo"); t.prepend(logo); };
    logo.src = `/appicon/${encodeURIComponent(a.id)}`;
    t.style.setProperty("--c", a.color || "#555");
    t.dataset.title = a.name;
    t.dataset.meta = a.meta || (a.kind === "web" ? "Opens full screen" : "");
    t.onactivate = () => launch({ id: a.id }, a.name);
    apps.append(t);
  }

  const games = $("#games"); games.innerHTML = "";
  if (!info.games.length) games.append(el("div", "empty", info.hidden?.length ? "All your games are hidden. Show them again from the PC row." : "No Steam games installed."));
  for (const g of info.games) {
    const t = el("div", "item poster", `<img class="art" alt="" loading="lazy"><div class="name">${esc(g.name)}</div>${badge()}`);
    const img = t.querySelector(".art");
    img.onload = () => t.classList.add("loaded");
    img.onerror = () => {
      if (!img.dataset.cdn && g.appid) { img.dataset.cdn = 1; img.src = `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/library_600x900.jpg`; }
      else t.classList.add("noart");
    };
    img.src = g.art || `/art/${g.appid}`;
    t.dataset.title = g.name;
    t.dataset.meta = g.meta || [ago(g.lastPlayed), playtime(g.playtime)].filter(Boolean).join(", ");
    t.dataset.hero = g.hero || `/art/${g.appid}/hero`;
    t.dataset.cta = "Play";
    t.game = g;  // for the □ menu
    t.onactivate = () => launch(g.id ? { id: g.id } : { game: g.appid }, g.name);
    games.append(t);
  }

  const sys = $("#system"); sys.innerHTML = "";
  const sysItems = [
    ["phone", "Phone remote", "Scan a code to control the PC from your phone", "Show code", "", showPhone],
    [deviceIcon(info.audio?.name || ""), "Audio output", info.audio ? `Playing on ${deviceName(info.audio.name)[0]}` : "Choose where games and videos play", "Change", "", pickAudio],
    [Sound.on ? "sound" : "mute", "Menu sounds", Sound.on ? "On" : "Off", Sound.on ? "Turn off" : "Turn on", "", () => { Sound.toggle(); soundHint(); const r = pos.r, c = pos.c; build(); focus(r, c); }],
    ...(info.hidden?.length ? [["eye", "Hidden games", info.hidden.join(", "), "Show all", "", () => setChoice("unhide-all")]] : []),
    ["moon", "Sleep", "Wake it with the PC's power button", "Sleep", "", () => { toast("Sleeping…"); api("/api/power", { action: "sleep" }).catch(() => {}); }],  // waking undoes it, so no dialog
    ["restart", "Restart", "Closes all apps and restarts the PC", "Restart", "danger", () => confirmPower("restart", "Restart", "Restart the PC now? Unsaved work in other apps will be lost.")],
    ["power", "Shut down", "Closes all apps and turns the PC off", "Shut down", "danger", () => confirmPower("shutdown", "Shut down", "Shut down the PC now? Unsaved work in other apps will be lost.")],
    ["exit", "Desktop", "Closes the launcher and shows the desktop", "Go to desktop", "", () => api("/api/window", { action: "close-launcher" })],
  ];
  for (const [ic, label, meta, cta, cls, fn] of sysItems) {
    const t = el("div", "item sys " + cls, `${icon(ic)}<span>${esc(label)}</span>${badge()}`);
    t.dataset.title = label; t.dataset.meta = meta; t.dataset.cta = cta;
    t.onactivate = fn; sys.append(t);
  }

  rows = [...document.querySelectorAll(".strip")].map(s => [...s.querySelectorAll(".item")]).filter(r => r.length);
  rows.forEach((row, r) => row.forEach((e, c) => {
    // Steam's desktop layout moves the mouse with the right stick; don't let that steal focus.
    e.addEventListener("mouseenter", () => { if (!modal && performance.now() - lastPadAt > 1500 && (pos.r !== r || pos.c !== c)) { focus(r, c); Sound.move(); } });
    e.addEventListener("click", () => { if (!modal) { focus(r, c); Sound.select(); e.onactivate(); } });
  }));
  if (chosen) focus(Math.min(pos.r, rows.length - 1), lastCol[pos.r] ?? 0);
}

function focus(r, c) {
  document.querySelectorAll("#rows .focus").forEach(e => e.classList.remove("focus"));
  r = Math.max(0, Math.min(rows.length - 1, r));
  c = Math.max(0, Math.min(rows[r].length - 1, c));
  pos = { r, c }; lastCol[r] = c; chosen = true;
  const e = rows[r][c]; e.classList.add("focus");
  document.querySelectorAll("#rows section").forEach(sec => sec.classList.toggle("active", sec.contains(e)));
  document.body.classList.add("chosen");
  document.body.classList.toggle("on-game", !!e.closest("#games"));
  showDetails(e);
  // horizontal: keep focused tile in view
  const strip = e.parentElement;
  const left = e.offsetLeft - strip.offsetLeft, pad = window.innerWidth * 0.05;
  if (left - strip.scrollLeft < pad) strip.scrollLeft = left - pad;
  else if (left + e.offsetWidth - strip.scrollLeft > strip.clientWidth - pad) strip.scrollLeft = left + e.offsetWidth - strip.clientWidth + pad;
  // vertical: slide rows so the focused row is visible
  const sec = e.closest("section"), main = $("main");
  // rects, not offsetTop: once #rows has a transform it becomes the offsetParent.
  // Clamp at the bottom, but snap to a row start so no half-row peeks under the header.
  const box = $("#rows"), y0 = box.getBoundingClientRect().top;
  const tops = [...box.children].map(s => s.getBoundingClientRect().top - y0 - 4);
  const want = Math.min(sec.getBoundingClientRect().top - y0 - 4, box.scrollHeight - main.clientHeight);
  const shift = Math.max(0, tops.find(t => t >= want));
  box.style.transform = `translateY(${-shift}px)`;
}

function move(dir) {
  if (modal) {
    const step = { left: -1, up: -1, right: 1, down: 1 }[dir];  // rows of buttons and lists alike
    if (step) {
      const i = Math.max(0, Math.min(modal.els.length - 1, modal.i + step));
      if (i === modal.i) return Sound.bump();
      modal.i = i; Sound.move();
      modal.els.forEach((e, k) => e.classList.toggle("focus", k === modal.i));
    }
    return;
  }
  if (!chosen) { focus(pos.r, 0); return Sound.move(); }  // first press just shows the highlight
  const before = pos.r + ":" + pos.c;
  if (dir === "left") focus(pos.r, pos.c - 1);
  if (dir === "right") focus(pos.r, pos.c + 1);
  if (dir === "up" && pos.r > 0) focus(pos.r - 1, lastCol[pos.r - 1] ?? 0);
  if (dir === "down" && pos.r < rows.length - 1) focus(pos.r + 1, lastCol[pos.r + 1] ?? 0);
  (pos.r + ":" + pos.c === before) ? Sound.bump() : Sound.move();
}
// L1/R1: jump 5 tiles along the row (long game lists)
function page(n) {
  if (modal || !chosen) return move(n < 0 ? "left" : "right");
  const before = pos.c;
  focus(pos.r, pos.c + n);
  pos.c === before ? Sound.bump() : Sound.move();
}
function activate() {
  if (modal) { const e = modal.els[modal.i]; if (e) { Sound.select(); e.onactivate(); } return; }
  if (!chosen) return;
  Sound.select(); rows[pos.r][pos.c].onactivate();
}
function back() { if (modal) { Sound.back(); modal.onBack(); } }

// ---------- actions
let launching = false;
async function launch(body, name) {
  if (launching) return;
  launching = true; setTimeout(() => launching = false, 3000);
  Sound.launch();
  showStarting(name);
  try {
    const r = await api("/api/launch", body);
    if (!r.ok) { hideStarting(); toast(r.error || "Couldn't start it"); }
  } catch { hideStarting(); toast("Couch server isn't responding"); }
}

// The starting screen stays until the game's window takes the screen (the launcher loses focus),
// ○ hides it, or a minute passes. Hiding it never stops the game from starting.
let startTimer, slowTimer;
function showStarting(name) {
  $("#starting-title").textContent = name;
  $("#starting-note").textContent = "Starting…";
  clearTimeout(slowTimer); slowTimer = setTimeout(() => $("#starting-note").textContent = "Still starting. Big games can take a minute.", 10000);
  $("#starting").classList.add("show"); document.body.classList.add("modal", "starting");
  modal = { els: [], i: 0, onBack: hideStarting };
  clearTimeout(startTimer); startTimer = setTimeout(hideStarting, 60000);
}
function hideStarting() {
  clearTimeout(startTimer); clearTimeout(slowTimer);
  document.body.classList.remove("starting");
  if (modal?.onBack === hideStarting) closeModal($("#starting"));
}
addEventListener("blur", hideStarting);

function openModal(overlay, els, onBack, start = 0) {
  overlay.classList.add("show"); document.body.classList.add("modal"); Sound.open();
  modal = { els, i: start, onBack: onBack || (() => closeModal(overlay)) };
  els.forEach((e, i) => { e.classList.toggle("focus", i === start); e.onclick = () => { Sound.select(); e.onactivate(); }; });
}
function closeModal(overlay) { overlay.classList.remove("show"); document.body.classList.remove("modal"); modal = null; }

// A dialog of choices ({label, sub, fn, cls, check, icon}); ○ closes it.
// vertical: a list (audio outputs), start: which one is focused first.
function choose(title, text, choices, { vertical = false, start = 0 } = {}) {
  const d = $("#dialog");
  $("#dlg-title").textContent = title; $("#dlg-text").textContent = text;
  const els = choices.map(({ label, sub, fn, cls = "", check, icon: ic }) => {
    const b = el("div", "item choice " + cls,
      `${ic ? icon(ic, "dev") : ""}<span>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</span>${check ? icon("check", "check") : ""}`);
    b.onactivate = () => { closeModal(d); if (fn) fn(); };
    return b;
  });
  const c = $("#dlg-choices"); c.innerHTML = ""; c.append(...els); c.classList.toggle("vertical", vertical);
  openModal(d, els, null, start);
}
// Cancel is focused first: these actions can't be undone
function confirmAction(title, text, yesLabel, onYes) {
  choose(title, text, [{ label: "Cancel" }, { label: yesLabel, fn: onYes, cls: "danger" }]);
}

// Audio output: Windows' default for everything; the server keeps it there when devices come and go
// "SAMSUNG (NVIDIA High Definition Audio)" -> ["Samsung", "NVIDIA High Definition Audio"]
function deviceName(full) {
  const m = /^(.*) \(([^()]*)\)$/.exec(full) || [, full, ""];
  const name = m[1] === m[1].toUpperCase() && m[1].length > 3 ? m[1][0] + m[1].slice(1).toLowerCase() : m[1];
  return [name, m[2]];
}
const deviceIcon = full => /headphone|headset|earbud|arctis|airpods|buds/i.test(full) ? "headphones"
  : /nvidia|amd|intel.*display|hdmi|displayport|samsung|lg|sony|tv/i.test(full) ? "tv" : "speaker";
async function pickAudio() {
  const a = await api("/api/audio").catch(() => null);
  if (!a) return toast("Couch server isn't responding");
  const list = a.devices.length ? a.devices : a.current ? [a.current] : [];
  if (!list.length) return toast("No audio outputs are on");
  choose("Audio output", "Games, videos and the PC play here, and it stays that way until you change it.",
    list.map(d => {
      const [label, sub] = deviceName(d.name);
      return { label, sub, icon: deviceIcon(d.name), check: d.id === a.current?.id, fn: () => setAudio(d) };
    }), { vertical: true, start: Math.max(0, list.findIndex(d => d.id === a.current?.id)) });
}
async function setAudio(d) {
  const r = await api("/api/audio", { id: d.id }).catch(() => null);
  if (!r?.ok) return toast(r?.error || "Couch server isn't responding");
  toast(`Sound now plays on ${deviceName(r.name)[0]}`);
  refresh();
}
function confirmPower(action, title, text) {
  confirmAction(title + "?", text, title, () => { toast(title + "…"); api("/api/power", { action }).catch(() => {}); });
}
async function windowAction(action) {
  const r = await api("/api/window", { action }).catch(() => null);
  if (!r?.ok) { toast(r?.error || "Couch server isn't responding"); refresh(); }
}

// □ on a game: pin it to the front or hide it (the server keeps this in choices.json)
function gameOptions() {
  const t = !modal && chosen && rows[pos.r][pos.c], g = t && t.game;
  if (!g) return Sound.bump();
  choose(g.name, "Hidden games can be shown again from the PC row.", [
    { label: g.pinned ? "Unpin" : "Pin to front", fn: () => setChoice(g.pinned ? "unpin" : "pin", g) },
    { label: "Hide", fn: () => setChoice("hide", g) },
    { label: "Cancel" },
  ]);
}
async function setChoice(action, g) {
  const r = await api("/api/games", { action, key: g?.key }).catch(() => null);
  if (!r?.ok) return toast(r?.error || "Couch server isn't responding");
  toast({ pin: `${g?.name} pinned`, unpin: `${g?.name} unpinned`, hide: `${g?.name} hidden`, "unhide-all": "Hidden games are back" }[action]);
  await refresh();
  if (g) {  // follow a pinned or unpinned game to its new place
    const i = rows[pos.r].findIndex(t => t.game?.key === g.key);
    if (i >= 0) focus(pos.r, i);
  } else {  // "Show all": go to the games, not to whatever slid under the cursor (Sleep)
    const r = rows.findIndex(row => row[0].closest("#games"));
    if (r >= 0) focus(r, 0);
  }
}

function showPhone() {
  const p = $("#phone");
  const url = info.urls?.[0];
  $("#phone-url").textContent = url || "(no Wi-Fi/Ethernet address found)";
  const q = $("#qr"); q.innerHTML = ""; q.style.display = "";
  if (url && window.qrcode) {
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    q.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  } else q.style.display = "none";
  openModal(p, [], () => closeModal(p));
}

// ---------- keyboard (also what Steam's desktop controller layout sends)
// Once controller presses arrive from the server, ignore the keys Steam also sends for them,
// otherwise one press would count twice.
let padSeen = false;
addEventListener("keydown", e => {
  const k = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
  const padKey = k || ["Enter", " ", "Escape", "Backspace"].includes(e.key);
  if (padKey) e.preventDefault();
  if (wake()) return;
  if (padSeen && padKey) return;
  if (k) move(k);
  else if (e.key === "PageUp" || e.key === "PageDown") { e.preventDefault(); page(e.key === "PageUp" ? -5 : 5); }
  else if (e.key === "Enter" || e.key === " ") activate();
  else if (e.key === "Escape" || e.key === "Backspace") back();
  else if (e.key === "p" || e.key === "y") { if (!modal) { Sound.select(); showPhone(); } }
});

// ---------- controller: the server reads it (works with or without Steam) and streams presses here
let lastPadAt = -1e9;
function onPad(a) {
  if (a.startsWith("pad:")) return showPad(a.slice(4));
  padSeen = true; lastPadAt = performance.now();
  if (wake()) return;
  if (a === "a") activate(); else if (a === "b") back();
  else if (a === "l1" || a === "r1") page(a === "l1" ? -5 : 5);
  else if (a === "x") gameOptions();
  else if (a === "y") { if (modal) back(); else { Sound.select(); showPhone(); } }
  else move(a);
}
async function listenPad() {
  for (;;) {
    try {
      const r = await fetch("/api/events", { headers: { "X-Couch": "1" } });
      const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const msg = buf.slice(0, i); buf = buf.slice(i + 2);
          if (msg.startsWith("data: ")) onPad(msg.slice(6));
        }
      }
    } catch {}
    await new Promise(r => setTimeout(r, 2000)); // server restarting; try again
  }
}
listenPad();

// ---------- load
async function load() {
  try {
    info = await api("/api/info");
    if (info.running) pos.r = 0;  // reloaded mid-game: first press lands on Resume
    build();
  } catch { $("#games").innerHTML = '<div class="empty">Couch server isn\'t running. Trying again…</div>'; setTimeout(load, 3000); }
}
load();
// Re-read the library and what's running. The Now playing row coming or going shifts every row by one.
async function refresh(toResume) {
  if (!info) return;
  let i;
  try { i = await api("/api/info"); } catch { return; }
  const shift = !!i.running - !!info.running;
  if (shift > 0) lastCol.unshift(0); else if (shift < 0) lastCol.shift();
  pos.r = Math.max(0, pos.r + shift);
  info = i;
  build();
  if (toResume && info.running) focus(0, 0);  // back from the game: Resume is where you'd want to be
}
addEventListener("focus", () => { wake(); refresh(true); });
</script>
