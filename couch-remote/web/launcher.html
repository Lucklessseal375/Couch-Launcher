<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couch Launcher</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Aoboshi+One&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* Steel Ball Run, at night. Warm saddle-brown surfaces and parchment text from the official site's ink; the show's key
     art (and then the focused game's art) fills the screen. One loud thing: the focused title in Aoboshi One (the site's
     display serif) with a hard Johnny-cyan offset like the logo. Around it: the gold horseshoe as the focus ring, Gyro's
     teal race bib as the action, the pink Couch script, ゴゴゴ. Layout, buttons and prompts follow the PS5. */
  :root {
    --obsidian: #150f0b; --glass: rgba(38, 28, 21, .56); --glass-hi: rgba(42, 31, 23, .86); --line: rgba(255, 236, 205, .12);
    --ink: #f3e6cf; --dim: #bfae96; --faint: #8a7a66;
    --ice: #8fe3ff; --pink: #e0306e; --johnny: #5ec8ef; --gyro: #6fae3e; --gold: #f2b844; --bib: #13809a; --serif: "Aoboshi One", Georgia, serif;
    --ps-cross: #7ea6ff; --ps-circle: #ff6f7d; --ps-tri: #43d6b0; --ps-square: #f08bd8;
    --logo: "Lobster", "Segoe Script", cursive;
    --ui: "Archivo", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --spring: cubic-bezier(.22, 1, .36, 1);
    --tile: 17vh; --poster-h: 27vh; --pad: 5vw;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--obsidian); color: var(--ink); font: 500 2.2vh/1.3 var(--ui); cursor: default; user-select: none; }

  /* ---------- full-bleed hero: the show's key art at home, the focused game's art over it, crossfaded */
  .sky, .bg { position: fixed; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
  /* the art (set as --art) twice: blurred and dim across the whole screen, then sharp on the right, its left edge
     faded into the blur so there's no seam, drifting slowly while it's up */
  .sky { overflow: hidden; }
  .sky::before, .sky::after { content: ""; position: absolute; inset: 0; background: var(--art) no-repeat; }
  .sky::before { background-size: cover; background-position: center; filter: blur(48px) saturate(1.25) brightness(.42); transform: scale(1.15); }
  .sky::after { background-size: auto 100%; background-position: right center; transform-origin: 80% 40%;
    --fade: linear-gradient(90deg, transparent var(--f0, 22%), #000 var(--f1, 52%));
    --low: linear-gradient(#000 52%, transparent 88%);  /* fade out behind the lower rows, where the poster's printed logo sat */
    -webkit-mask-image: var(--fade), var(--low); -webkit-mask-composite: source-in; mask-image: var(--fade), var(--low); mask-composite: intersect; }
  .sky.on::after { animation: sky-drift 22s ease-out both; }
  .sky:not(.on)::after { transform: scale(1.06); }  /* fading out: hold where the drift ended, no snap back */
  @keyframes sky-drift { from { transform: scale(1.0); } to { transform: scale(1.06); } }
  .sky.on, .bg.on { opacity: 1; }
  .bg { background-size: cover; background-position: center 30%; background-color: var(--obsidian); filter: saturate(1.08) brightness(.66); }
  .shade { position: fixed; inset: 0; pointer-events: none; transition: opacity .6s ease; background:
      linear-gradient(90deg, rgba(21,15,11,.97) 0%, rgba(21,15,11,.84) 30%, rgba(21,15,11,.32) 60%, rgba(21,15,11,.06) 100%),
      linear-gradient(0deg, rgba(21,15,11,.98) 0%, rgba(21,15,11,.6) 36%, rgba(21,15,11,0) 62%),
      linear-gradient(180deg, rgba(21,15,11,.72) 0%, rgba(21,15,11,0) 20%); }
  .spiral-mark { position: fixed; right: -14vh; bottom: -20vh; width: 78vh; height: 78vh; opacity: .05; color: var(--gold); pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* PS5-style light behind whatever is focused, in its own colour (--focus), following the focus */
  #glow { position: fixed; left: var(--gx, 50vw); top: var(--gy, 60vh); width: 64vh; height: 64vh; margin: -32vh 0 0 -32vh; border-radius: 50%;
          pointer-events: none; opacity: 0; filter: blur(3vh);
          background: radial-gradient(circle, color-mix(in srgb, var(--focus, var(--gold)) 26%, transparent) 0%, transparent 62%);
          transition: left .7s var(--spring), top .7s var(--spring), opacity .5s ease, background .5s ease; }
  body.chosen #glow { opacity: 1; }
  body.modal #glow { opacity: 0; }
  .app-shell { position: relative; height: 100%; animation: enter .7s var(--spring); transition: opacity .35s ease; }
  @keyframes enter { from { opacity: 0; transform: translateY(2vh); } }

  /* ---------- header */
  header { display: flex; align-items: center; justify-content: space-between; height: 11vh; padding: 4vh var(--pad) 0; }
  .brand { display: flex; align-items: center; gap: 1.2vw; }
  .brand h1 { margin: 0; font: 400 5.8vh/1 var(--logo); color: var(--pink);
              text-shadow: 0 .4vh 1.6vh rgba(0,0,0,.55), 0 0 2.4vh color-mix(in srgb, var(--pink) 35%, transparent); transform: rotate(-4deg); }
  .brand .mark { width: 4.6vh; height: 4.6vh; filter: drop-shadow(0 .3vh .4vh rgba(0,0,0,.5)); }
  .status { display: flex; align-items: center; gap: 2.6vw; text-shadow: 0 .2vh 1.2vh rgba(0,0,0,.85); }
  .time { text-align: right; }
  #clock { font: 650 4.2vh/1 var(--ui); font-variant-numeric: tabular-nums; }
  #date { color: var(--dim); font-size: 2.3vh; margin-top: .7vh; }  /* 2.3vh: Apple's 23 pt floor on a TV, plus a little */
  #pad { display: flex; align-items: center; gap: 1vh; color: var(--dim); font-size: 2.3vh; }
  #pad svg { width: 5.2vh; height: 2.8vh; color: var(--ink); }
  #pad.low, #pad.low svg { color: var(--ps-circle); }
  /* weather, after iOS's widget: icon, temperature, then the day in one quiet line */
  #weather { display: flex; align-items: center; gap: 1.2vh; }
  #weather[hidden] { display: none; }
  #weather svg { width: 4.6vh; height: 4.6vh; color: var(--gold); flex: none; }
  #weather b { display: block; font: 650 3.4vh/1 var(--ui); font-variant-numeric: tabular-nums; }
  #weather small { display: block; margin-top: .6vh; font-size: 2.3vh; color: var(--dim); white-space: nowrap; }
  /* while Sunshine streams this screen to another TV (stream.cmd tells the server) */
  #stream { padding: .9vh 1.8vh; border-radius: 1vh; background: var(--bib); color: #fff; font: 700 2.15vh/1 var(--ui); white-space: nowrap;
            box-shadow: 0 .6vh 1.6vh rgba(0,0,0,.4); }
  #stream[hidden] { display: none; }
  #search.prompt .sq > svg { display: none; }  /* a sign-in or PIN, not a search */
  #bell { display: flex; align-items: center; gap: .6vh; font: 700 2.1vh/1 var(--ui); color: var(--ink); }
  #bell[hidden] { display: none; }
  #bell svg { width: 3vh; height: 3vh; color: var(--gold); }
  /* idle: nothing still and bright on the TV, just a dim clock that moves every minute */
  #idle { position: fixed; inset: 0; background: #05060a; opacity: 0; pointer-events: none; transition: opacity 1.2s; z-index: 30; }
  body.idle #idle { opacity: 1; }
  #idle-clock { position: absolute; font: 600 6vh/1 var(--ui); color: #aab2c8; font-variant-numeric: tabular-nums; text-shadow: 0 .3vh 2vh #000c; }
  #idle-clock small { display: block; margin-top: 1.2vh; font: 500 2.4vh/1.2 var(--ui); color: #8a92a8; }  /* the weather, like Apple TV's screensaver */
  /* the show's art, dimmed, a new picture each minute and always drifting so nothing sits still on the TV */
  #idle-art { position: absolute; inset: 0; background: center 25% / cover no-repeat; filter: brightness(.5); opacity: 0; transition: opacity 1.2s;
    animation: idle-pan 60s ease-in-out infinite alternate; }
  #idle-art.on { opacity: 1; }
  /* easter egg: now and then Gyro's steel ball rolls across the screensaver */
  #idle-ball { position: absolute; bottom: 6vh; left: -12vh; width: 9vh; opacity: 0; filter: brightness(.7) drop-shadow(0 1vh 1.5vh #000); }
  #idle-ball.roll { animation: idle-roll 9s linear; }
  @keyframes idle-roll { 0% { opacity: 1; transform: translateX(0) rotate(0); } 100% { opacity: 1; transform: translateX(calc(100vw + 24vh)) rotate(1440deg); } }
  /* easter egg: the Golden Spin (L1 R1 L1 R1) */
  #golden-spin { position: fixed; left: 50%; top: 50%; width: 120vh; height: 120vh; margin: -60vh 0 0 -60vh; color: var(--gold); opacity: 0;
    pointer-events: none; z-index: 40; filter: drop-shadow(0 0 2vh rgba(242,184,68,.8)); }
  #golden-spin.go { animation: golden-spin 2.4s var(--spring); }
  @keyframes golden-spin { 0% { opacity: 0; transform: scale(.2) rotate(0); } 30% { opacity: .9; } 100% { opacity: 0; transform: scale(1.3) rotate(720deg); } }
  @keyframes idle-pan { from { transform: scale(1.04) translate(-1.5%, -1%); } to { transform: scale(1.1) translate(1.5%, 1%); } }

  /* ---------- details of the focused tile (PS5 game hub) */
  .details { position: relative; height: 23vh; padding: .4vh var(--pad) 0; }  /* room under the Play pill before the row title */
  /* no outline copy behind the letters: a soft drop shadow and a faint glow in the focused item's colour; room below for g, y, p */
  #d-title { margin: 0 0 -1.2vh; font: 400 7.4vh/1.08 var(--serif); letter-spacing: -.01em; max-width: 64vw; padding-bottom: 1.7vh;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             text-shadow: 0 .5vh 2.4vh rgba(0,0,0,.75), 0 0 4vh color-mix(in srgb, var(--focus, var(--gold)) 22%, transparent); }
  #d-meta { color: var(--dim); font-size: 2.6vh; margin-top: .7vh; min-height: 1.3em; max-width: 64vw;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cta { display: inline-flex; align-items: center; gap: 1.2vh; margin-top: 1.3vh; padding: 1vh 3.2vh 1vh 1.2vh; border-radius: 1vh;
         background: var(--bib); color: #fff; font: 400 2.6vh/1 var(--serif); transform: rotate(-1.5deg);
         box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 .8vh 2vh rgba(0,0,0,.45),
                     0 0 3.2vh color-mix(in srgb, var(--bib) 55%, transparent); }  /* a soft PS5-style glow */
  .cta .glyph { background: var(--obsidian); box-shadow: none; }
  body:not(.chosen) .cta { visibility: hidden; } /* ✕ does nothing until a tile is selected */
  #d-title.long { font-size: 5.2vh; padding-top: 1.6vh; }
  .details.swap #d-title { animation: dash .5s var(--spring); }
  /* the line and the pill follow the title in, a beat apart, so a focus change reads as one motion */
  .details.swap #d-meta { animation: rise .5s var(--spring) .06s both; }
  .details.swap .cta { animation: rise-cta .5s var(--spring) .12s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(1.2vh); } }
  @keyframes rise-cta { from { opacity: 0; transform: translateY(1.2vh) rotate(-1.5deg); } }
  section h2 { transition: color .35s ease; }
  @keyframes dash { from { opacity: 0; transform: translateX(-3vw) skewX(-12deg); } to { opacity: 1; transform: none; } }
  #sfx { position: absolute; right: 7vw; top: 0; font: 900 6vh/1 "Yu Gothic UI", "Meiryo", "MS Gothic", sans-serif; color: var(--pink);
         -webkit-text-stroke: .22vh #fff; letter-spacing: -.05em; opacity: 0; transform: skewX(-14deg); pointer-events: none;
         text-shadow: .3vh .3vh 0 var(--johnny); }
  #sfx span { display: inline-block; }
  .details.swap #sfx { animation: menace 1.6s ease-out; }
  .details.swap #sfx span:nth-child(1) { animation: shake .18s 4 linear; }
  .details.swap #sfx span:nth-child(2) { animation: shake .18s .06s 4 linear; font-size: .82em; }
  .details.swap #sfx span:nth-child(3) { animation: shake .18s .12s 4 linear; font-size: .66em; }
  @keyframes menace { 0% { opacity: 0; transform: skewX(-14deg) translateY(1vh) scale(.9); } 12% { opacity: .95; transform: skewX(-14deg) scale(1.04); }
                      70% { opacity: .75; } 100% { opacity: 0; transform: skewX(-14deg) translateY(-1vh); } }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(.25vh,-.2vh); } 75% { transform: translate(-.25vh,.2vh); } }

  /* ---------- rows: carousels that glide on a spring */
  main { height: calc(100% - 11vh - 23vh - 8vh); overflow: hidden;
         -webkit-mask-image: linear-gradient(#000 calc(100% - 4vh), transparent); mask-image: linear-gradient(#000 calc(100% - 4vh), transparent); }
  #rows { transition: transform .6s var(--spring); padding-bottom: 4vh; }  /* the last row clears the prompt bar */
  section { padding: .2vh 0; opacity: .62; transition: opacity .45s ease; }
  section.active, body:not(.chosen) section { opacity: 1; }
  section h2 { margin: 0 0 0 var(--pad); font: 400 2.6vh/1 var(--serif); color: var(--dim); }
  section.active h2 { color: var(--ink); }
  .strip { padding: 3vh var(--pad) 2.2vh; overflow: hidden; }
  .track { position: relative; display: flex; gap: 1.5vw; transition: transform .6s var(--spring); }

  .item { flex: 0 0 auto; position: relative; border-radius: 1.4vh; outline: none; cursor: pointer;
          box-shadow: 0 1.4vh 3vh rgba(0,0,0,.5);
          transition: transform .5s var(--spring), box-shadow .35s ease, filter .35s ease; filter: brightness(.8) saturate(.92); }
  .item.focus { transform: scale(1.07); z-index: 3; filter: none;  /* --focus: the focused game's or app's own colour, else gold */
                box-shadow: 0 0 0 .32vh var(--obsidian), 0 0 0 .75vh var(--focus, var(--gold)),
                            0 0 6vh .4vh color-mix(in srgb, var(--focus, var(--gold)) 30%, transparent), 0 2.6vh 5vh rgba(0,0,0,.6); }
  /* focus, after tvOS: the tile lifts and a gold glint crosses it once, like light on the steel ball (motion allowed only) */
  @media (prefers-reduced-motion: no-preference) {
    .item.focus { transform: translateY(-1.2vh) scale(1.07); }
    .item::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1; opacity: 0;
      background: linear-gradient(115deg, transparent 38%, color-mix(in srgb, var(--focus, #ffecbe) 45%, rgba(255,255,255,.28)) 50%, transparent 62%)
                  160% 0 / 260% 100% no-repeat; }
    .item.focus::before { animation: glint .9s var(--spring) .08s both; }
    body.calm .item.focus { transform: translateY(-1.6vh) scale(1.12); }  /* idle, after tvOS: the focused tile grows */
    .item.focus.press { transform: scale(.96); transition-duration: .08s; }  /* pressed, after tvOS "highlighted": dips, then springs back */
    @keyframes glint { from { opacity: 1; background-position: 160% 0; } to { opacity: 1; background-position: -60% 0; } }
  }
  body.calm .item:not(.focus) { filter: brightness(.45) saturate(.8); transition-duration: .5s, .35s, 1.2s; }  /* ...and the rest dim */
  .item.focus.press, .card .choice.focus.press, .key.focus.press { filter: brightness(1.3); }
  .item.nudge { animation: nudge .32s var(--spring); }  /* `translate`, so the focus lift (transform) stays put */
  @keyframes nudge { 35% { translate: var(--nx) var(--ny); } }
  .item .badge { position: absolute; top: -2vh; right: -2vh; width: 5.8vh; height: 5.8vh; opacity: 0; z-index: 2;
                 transform: scale(.4) rotate(-90deg); transition: opacity .2s, transform .5s var(--spring); pointer-events: none;
                 filter: drop-shadow(0 .3vh .6vh rgba(0,0,0,.7)); }
  .item.focus .badge { opacity: 1; transform: scale(1); }
  .item .badge img { width: 100%; height: 100%; display: block; }
  .item.focus .badge img { animation: spin .9s linear infinite; }

  .app { width: var(--tile); height: var(--tile); display: flex; flex-direction: column; justify-content: flex-end; padding: 1.8vh; background: var(--c); }
  .app .name { font: 800 3.3vh/.95 var(--ui); font-stretch: 75%; }
  /* with the app's real icon: a dark card tinted by the brand colour, the icon centred, the name as a caption */
  .app.logo { justify-content: center; align-items: center; background: color-mix(in srgb, var(--c) 24%, #10131a); }
  .app.logo .appicon { width: 9vh; height: 9vh; object-fit: contain; margin-bottom: 2.4vh; filter: drop-shadow(0 .6vh 1.2vh rgba(0,0,0,.4)); }
  .app.logo .name { position: absolute; left: 1vh; right: 1vh; bottom: 1.5vh; text-align: center; font: 700 2.15vh/1.1 var(--ui); font-stretch: 80%; color: var(--dim);
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app.logo.focus .name { color: #fff; }

  .poster { width: calc(var(--poster-h) * 2 / 3); height: var(--poster-h); background: #161a24; }
  .poster .art { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; opacity: 0; transition: opacity .5s ease; }
  .poster.loaded .art { opacity: 1; }
  .poster .name { position: absolute; inset: auto 0 0 0; padding: 4vh 1.3vh 1.3vh; font: 700 2.15vh/1.15 var(--ui);
                  background: linear-gradient(transparent, rgba(21,15,11,.94)); border-radius: 0 0 1.4vh 1.4vh; }
  .poster.loaded .name { display: none; }  /* the name shows until the art arrives, or if there is none */
  .poster.noart .art { display: none; }
  /* a game with no cover, and Surprise me: the steel ball on the race's dusk, not a blank card */
  .poster.noart, .poster.surprise { background: radial-gradient(circle at 50% 36%, rgba(242,184,68,.3), transparent 50%),
    url(/steelball.png) 50% 34% / 42% no-repeat, linear-gradient(165deg, #3a2716, #120d09 70%); }
  .poster.surprise .name { display: block; text-align: center; }
  .poster .running { position: absolute; top: 1.2vh; left: 1.2vh; padding: .4vh 1vh; border-radius: 99vh; z-index: 1;
                     font: 700 2.2vh/1.2 var(--ui); color: #120d09; background: var(--gold); box-shadow: 0 .3vh 1vh #0008; }

  .sys { width: 15vh; height: 15vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4vh;
         font: 700 2.1vh/1.1 var(--ui); text-align: center; background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); }
  .sys svg.icon { width: 5vh; height: 5vh; color: #fff; }
  .sys.danger svg.icon { color: var(--ps-circle); }
  /* live tiles, after the PS5's control-center cards and iOS widgets: status at a glance, the label still says what it is */
  .sys .glance { display: flex; gap: .8vh; align-items: center; justify-content: center; min-height: 5.6vh; }
  .sys .ring { width: 5.6vh; height: 5.6vh; border-radius: 50%; flex: none;
    background: conic-gradient(var(--rc, var(--gold)) calc(var(--v) * 100%), rgba(255,255,255,.16) 0);
    -webkit-mask: radial-gradient(circle, transparent 56%, #000 58%); mask: radial-gradient(circle, transparent 56%, #000 58%); }
  @property --v { syntax: "<number>"; inherits: true; initial-value: 0; }
  .sys .ring { animation: fill 1.1s var(--spring) .15s both; }  /* rings fill up when they appear */
  @keyframes fill { from { --v: 0; } }
  footer .p.new { animation: rise .35s var(--spring) both; }
  .sys .glance .ring:not(:only-child) { width: 4.4vh; height: 4.4vh; }
  .sys small { display: block; margin-top: -.6vh; font: 500 2.15vh/1 var(--ui); color: var(--dim); white-space: nowrap; }
  .sys.focus small { color: var(--ink); }
  .sys.shot { justify-content: flex-end; padding-bottom: 1.4vh; background: center / cover no-repeat; }
  .sys.shot .glance { display: none; }
  .sys.shot { background-image: linear-gradient(transparent 35%, rgba(21,15,11,.9)), var(--shot); }  /* shade, not a box, under the label */
  .sys.shot > span { text-shadow: 0 .2vh .8vh rgba(0,0,0,.9); }
  .empty { color: var(--dim); padding: 2vh 0; font-size: 2.4vh; }

  /* ---------- PlayStation button glyphs (SVG) */
  .glyph { display: inline-grid; place-items: center; width: 3.7vh; height: 3.7vh; border-radius: 50%; flex: none;
           background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 .14vh rgba(255,255,255,.24); vertical-align: middle; }
  .glyph svg { width: 2vh; height: 2vh; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .g-cross svg { stroke: var(--ps-cross); } .g-circle svg { stroke: var(--ps-circle); } .g-tri svg { stroke: var(--ps-tri); } .g-square svg { stroke: var(--ps-square); }
  .sh { display: inline-grid; place-items: center; flex: none; color: var(--ink); }
  .sh svg { width: 6.2vh; height: 3.7vh; }

  /* ---------- context-aware prompt bar */
  footer { position: fixed; left: 0; right: 0; bottom: 0; height: 8vh; display: flex; align-items: center; gap: 3vw; padding: 0 var(--pad);
           font: 600 2.4vh/1 var(--ui); color: var(--ink); background: rgba(21,15,11,.5); backdrop-filter: blur(22px) saturate(1.3);
           box-shadow: inset 0 1px 0 var(--line); z-index: 12; }
  footer .p { display: inline-flex; align-items: center; gap: 1.1vh; white-space: nowrap; }
  footer .p .sh + .sh { margin-left: -.4vh; }
  footer .sound { margin-left: auto; color: var(--dim); font-weight: 500; }
  footer .sound svg { width: 2.8vh; height: 2.8vh; }

  /* ---------- toast, overlays, dialogs: frosted glass with a 1px inner light edge */
  #toast { position: fixed; right: var(--pad); top: 12vh;  /* under the header, never over the clock */ transform: translateY(-2vh); opacity: 0; transition: opacity .35s ease, transform .5s var(--spring);
           background: var(--glass-hi); backdrop-filter: blur(24px); color: #fff; padding: 1.6vh 3vh; border-radius: 99vh;
           font: 600 2.3vh/1.25 var(--ui); box-shadow: inset 0 0 0 1px var(--line), 0 1.4vh 3vh rgba(0,0,0,.5); pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; transform: none; }
  .overlay { position: fixed; inset: 0; background: rgba(5,6,9,.6); backdrop-filter: blur(16px) saturate(1.1); display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.show { display: flex; animation: fade .25s ease; }
  /* media gallery: one screenshot at a time, as large as the TV allows */
  #gallery { background: #000; backdrop-filter: none; }
  .gallery { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2vh; }
  #gal-img { max-width: 92vw; max-height: 76vh; object-fit: contain; border-radius: 1.2vh; box-shadow: 0 2vh 5vh rgba(0,0,0,.6); }
  #gal-cap { font: 500 2.3vh/1.3 var(--ui); color: var(--dim); }
  @keyframes fade { from { opacity: 0; } }
  .card { position: relative; background: var(--glass-hi); backdrop-filter: blur(30px) saturate(1.2); color: #fff; border-radius: 2.8vh; padding: 4.4vh 4.6vw;
          text-align: center; max-width: 80vw; box-shadow: inset 0 0 0 1px var(--line), 0 4vh 8vh rgba(0,0,0,.6); animation: pop .45s var(--spring); }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } }
  .card::before { content: ""; position: absolute; left: 2.8vh; right: 2.8vh; top: 0; height: 1.3vh; border-radius: 0 0 1vh 1vh; pointer-events: none;
    background: radial-gradient(circle, #ffe3b0 .22vh, transparent .3vh) 0 .62vh / 1.4vh 1.4vh repeat-x,
      linear-gradient(#21a7c4 0 22%, var(--pink) 22% 44%, #fe5000 44%); }
  .card h3 { margin: 0 0 1vh; font: 400 4.2vh/1.15 var(--serif); }
  .card p { margin: .8vh 0; color: var(--dim); font-size: 2.3vh; }
  .card .choices { display: flex; gap: 1.4vw; justify-content: center; margin-top: 3.2vh; }
  .card .choice { display: inline-flex; align-items: center; gap: 1.2vh; padding: 1.7vh 4.2vh; border-radius: 99vh; font: 700 2.4vh/1 var(--ui);
                  background: rgba(255,255,255,.1); color: #fff; filter: none; box-shadow: inset 0 0 0 1px var(--line); }
  .card .choice::after { display: none; }
  .card .choice.focus { background: var(--ink); color: var(--obsidian); transform: scale(1.06); box-shadow: 0 0 0 .3vh var(--gold), 0 0 4vh rgba(242,184,68,.35); }
  .card .choice.danger.focus { color: #c0203a; }
  .card .choice .dev { width: 2.8vh; height: 2.8vh; flex: none; color: var(--dim); }
  .card .choice.focus .dev { color: var(--obsidian); }
  /* list dialogs (menu, audio outputs): rows with a second line and a check on the current one */
  .card .choices.vertical { flex-direction: column; align-items: stretch; gap: .9vh; min-width: 42vw; }
  .card .choices.vertical .choice { gap: 2vh; padding: 1.4vh 2.4vh; border-radius: 1.6vh; text-align: left; transform-origin: center; }
  .card .choices.vertical .choice.focus { transform: scale(1.03); }
  .card .choices.vertical .dev { width: 3.4vh; height: 3.4vh; }
  .card .choice small { display: block; margin-top: .5vh; font: 500 2.15vh/1.2 var(--ui); color: var(--dim); }
  .card .choice.focus small { color: #6b5a48; }
  .card .choice .bar { margin-left: auto; width: 14vh; height: .8vh; border-radius: 99vh; background: rgba(255,255,255,.14); overflow: hidden; flex: none; }
  .card .choice .bar i { display: block; height: 100%; background: var(--ice); border-radius: inherit; transition: width .3s var(--spring); }
  .card .choice.focus .bar { background: rgba(21,15,11,.15); }
  .card .choice.focus .bar i { background: var(--obsidian); }
  .card .choice .check { width: 2.8vh; height: 2.8vh; margin-left: auto; flex: none; color: var(--ice); }
  .card .choice.focus .check { color: var(--obsidian); }
  /* game details (□): the cover beside its facts and actions */
  #dlg-art { display: none; }
  .card.art { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4.4vh; align-items: center; text-align: left; max-width: 76vw; }
  .card.art #dlg-art { display: block; width: 27vh; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 1.6vh; box-shadow: 0 2vh 4vh rgba(0,0,0,.5); }
  .card.art h3 { font: 400 5.6vh/1.1 var(--serif); }
  .card.art .choices { justify-content: flex-start; }
  #dlg-lines { list-style: none; padding: 0; margin: 1.4vh auto 0; width: fit-content; text-align: left; display: grid; gap: .9vh; font-size: 2.5vh; color: var(--dim); }
  #dlg-lines[hidden], #dlg-text[hidden], #dlg-gauges:empty { display: none; }
  #dlg-gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; margin: 2.4vh 0 .6vh; text-align: left; }
  .gauge .g-top { display: flex; justify-content: space-between; align-items: baseline; font: 600 2.2vh/1.2 var(--ui); color: var(--dim); }
  .gauge .g-top b { font: 700 2.8vh/1 var(--ui); color: var(--ink); font-variant-numeric: tabular-nums; }
  .gauge .g-bar { height: 1.1vh; margin-top: 1vh; border-radius: 99vh; background: rgba(255, 236, 205, .12); overflow: hidden; }
  .gauge .g-bar i { display: block; height: 100%; border-radius: inherit; background: var(--gold); transition: width .6s var(--spring); }
  .gauge.high .g-bar i { background: var(--ps-circle); }
  #dlg-lines li::before { content: ""; display: inline-block; width: .9vh; height: .9vh; margin: 0 1.4vh .25vh 0; border-radius: 50%; background: var(--gold); }

  /* ---------- △ search: on-screen keyboard and results */
  #search { align-items: flex-start; }
  .search { width: 90vw; margin-top: 7vh; }
  .sq { display: flex; align-items: center; gap: 2vh; height: 9vh; padding: 0 3vh; border-radius: 2vh; background: var(--glass-hi);
        box-shadow: inset 0 0 0 1px var(--line); font: 700 4.4vh/1 var(--ui); }
  .sq svg { width: 4vh; height: 4vh; color: var(--dim); flex: none; }
  .sq-hint { color: var(--faint); font-weight: 500; font-size: 3vh; }
  .caret { width: .35vh; height: 5vh; background: var(--ice); margin-left: -1.2vh; }
  .keys { display: grid; grid-template-columns: repeat(13, 1fr); gap: 1vh; margin: 3vh 0 2vh; }
  .key { height: 7.4vh; display: grid; place-items: center; border-radius: 1.3vh; background: rgba(255,255,255,.07);
         box-shadow: inset 0 0 0 1px var(--line); font: 700 3vh/1 var(--ui); transition: transform .4s var(--spring), background .2s, color .2s; }
  .key .kicon { width: 3.4vh; height: 3.4vh; }
  .key.focus { background: var(--ink); color: var(--obsidian); transform: scale(1.08); box-shadow: 0 0 0 .3vh var(--gold), 0 0 4vh rgba(242,184,68,.4); }
  .results-wrap h2 { margin: 0; font: 650 2.5vh/1 var(--ui); color: var(--dim); min-height: 2.5vh; }
  .results-wrap .strip { padding: 3vh 1.6vh 2vh; margin: 0 -1.6vh; }  /* room for the focus glow */
  #results { --poster-h: 24vh; --tile: 15vh; }

  /* ---------- starting a game: the steel ball spins over the game's own art until its window takes over */
  #starting { background: radial-gradient(60vw 60vh at 50% 50%, rgba(21,15,11,.6), rgba(21,15,11,.12)); backdrop-filter: none; }
  body.starting .app-shell { opacity: 0; }
  body.starting .shade { opacity: .55; }
  body.starting .bg { filter: saturate(1.1) brightness(.8); transition: opacity .7s ease, filter .6s ease; }
  .launch { text-align: center; max-width: 80vw; }
  .launch .ball { width: 13vh; height: 13vh; animation: spin .9s linear infinite; filter: drop-shadow(0 1vh 2vh rgba(0,0,0,.6)); }
  .launch h3 { margin: 3.4vh 0 1.2vh; font: 800 7.2vh/1.02 var(--ui); font-stretch: 75%; text-shadow: 0 .4vh 2vh rgba(0,0,0,.7); }
  .launch p { margin: 0; color: var(--dim); font-size: 2.4vh; }
  #qr { background: #fff; padding: 1.4vh; border-radius: 1.4vh; display: inline-block; margin: 2vh 0; }
  #qr svg { display: block; width: 30vh; height: 30vh; }
  .url { font-family: Consolas, monospace; color: #fff !important; }

  /* Windows "Animation effects" off: ゴゴゴ becomes a fade; nothing spins, shakes, slides or zooms */
  /* Windows "Transparency effects" off: solid surfaces instead of frosted glass (Apple: Reduce Transparency) */
  @media (prefers-reduced-transparency: reduce) {
    :root { --glass: #2a1f17; --glass-hi: #2a1f17; }
    * { backdrop-filter: none !important; }
    footer { background: #1d1510; }
    .overlay { background: rgba(5, 6, 9, .92); }
  }
  /* Windows contrast settings on: full-strength text and rows (Apple: Increase Contrast) */
  @media (prefers-contrast: more) {
    :root { --dim: #ece0cb; --line: rgba(255, 236, 205, .45); }
    section { opacity: 1; }
    .item { filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sky::after, #idle-art, #idle-ball, #golden-spin, .app-shell, .details.swap #d-title, .details.swap #sfx span, .item.focus .badge img, .card, .overlay.show, .launch .ball,
    .details.swap #d-meta, .details.swap .cta, .sys .ring, footer .p.new { animation: none !important; }
    .details.swap #sfx { animation: fade-sfx 1.6s ease-out; }
    #rows, .track, .item, .item .badge, .key { transition: opacity .2s, box-shadow .2s, filter .2s; }
    #glow { transition: opacity .2s; }
    .item.nudge { animation: none; }
    .item.focus, .card .choice.focus, .key.focus { transform: none; }
  }
  @keyframes fade-sfx { 12% { opacity: .95; } 70% { opacity: .75; } 100% { opacity: 0; } }
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const api = (path, body) => fetch(path, body === undefined
  ? { headers: { "X-Couch": "1" } }
  : { method: "POST", headers: { "X-Couch": "1", "Content-Type": "application/json" }, body: JSON.stringify(body) }
).then(r => r.json());
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const PREVIEW = location.search.includes("preview");  // a test copy: no microphone check, no startup music

let info = null;
let rows = [];            // arrays of focusable elements, one per row
let pos = { r: 1, c: 0 };  // where the first press lands (first game)
let chosen = false;        // nothing is selected until you move, so ✕ can't launch by accident
const lastCol = [];
let modal = null;         // { els, i, onBack, move?, activate?, del?, search? }

// ---------- golden spiral (r grows by the golden ratio every quarter turn)
(() => {
  const phi = (1 + Math.sqrt(5)) / 2, b = Math.log(phi) / (Math.PI / 2), turns = 4.25, steps = 260;
  const maxT = turns * 2 * Math.PI, a = 0.92 / Math.exp(b * maxT);
  let d = "";
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * maxT, r = a * Math.exp(b * t);
    d += (i ? "L" : "M") + (r * Math.cos(t)).toFixed(4) + " " + (r * Math.sin(t)).toFixed(4);
  }
  $("#spiral-path").setAttribute("d", d);
})();
const badge = () => '<span class="badge"><img src="/steelball.png" alt=""></span>';
const icon = (name, cls = "icon") =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${name}"/></svg>`;
// PlayStation button glyphs for prompts, all SVG
const GLYPH = {
  cross: '<span class="glyph g-cross"><svg viewBox="0 0 24 24"><use href="#g-cross"/></svg></span>',
  circle: '<span class="glyph g-circle"><svg viewBox="0 0 24 24"><use href="#g-circle"/></svg></span>',
  square: '<span class="glyph g-square"><svg viewBox="0 0 24 24"><use href="#g-square"/></svg></span>',
  tri: '<span class="glyph g-tri"><svg viewBox="0 0 24 24"><use href="#g-tri"/></svg></span>',
  l1: '<span class="sh"><svg viewBox="0 0 44 26"><use href="#g-l1"/></svg></span>',
  r1: '<span class="sh"><svg viewBox="0 0 44 26"><use href="#g-r1"/></svg></span>',
  options: '<span class="sh"><svg viewBox="0 0 44 26"><use href="#g-options"/></svg></span>',
};

// ---------- a wireless DualSense's speaker and grips: Windows can't play to them, so the server sends them what
// this page plays (padspeaker.py). This runs in the audio thread. Input 0 (everything) becomes the speaker: mono,
// resampled to the controller's 45 kHz. Input 1 (the menu sounds, not music) becomes what the grips feel: how loud
// its low end (below ~400 Hz) is sets a 150 Hz buzz, full strength at once and fading in ~25 ms, so each sound
// lands as a crisp tap the way the PS5 menu's do. Each report's worth (2048 bytes: 960 16-bit samples, then
// 64 x 2 grips of 8-bit at 3 kHz) is handed over in one block; after 0.5 s of quiet it rests.
function padTapWorklet() {
  const A = 1 - Math.exp(-2 * Math.PI * 400 / 45000), R = Math.exp(-1 / (0.025 * 45000)), W = 2 * Math.PI * 150 / 3000;
  const clamp = x => Math.max(-1, Math.min(1, x));
  registerProcessor("pad-tap", class extends AudioWorkletProcessor {
    constructor() {
      super(); this.step = sampleRate / 45000; this.t = 0; this.prev = 0; this.prevH = 0; this.lp1 = 0; this.lp2 = 0; this.env = 0; this.ph = 0;
      this.buf = new ArrayBuffer(2048); this.block = new Int16Array(this.buf, 0, 960); this.feel = new Int8Array(this.buf, 1920, 128);
      this.n = 0; this.loud = false; this.quiet = 99;
    }
    process([a, f]) {
      const [l, r = l] = a, [fl, fr = fl] = f, len = (l || fl)?.length || 128;
      for (let i = 0; i < len; i++) {
        const s = l ? (l[i] + r[i]) / 2 : 0, h = fl ? (fl[i] + fr[i]) / 2 : 0;
        for (; this.t < 1; this.t += this.step) this.push(this.prev + (s - this.prev) * this.t, this.prevH + (h - this.prevH) * this.t);
        this.t -= 1; this.prev = s; this.prevH = h;
      }
      return true;
    }
    push(v, h) {
      if (v > 1e-4 || v < -1e-4 || h > 1e-4 || h < -1e-4) this.loud = true;
      this.block[this.n] = clamp(v) * 32767;
      this.lp1 += (h - this.lp1) * A; this.lp2 += (this.lp1 - this.lp2) * A;  // two gentle low-pass stages
      this.env = Math.max(Math.abs(this.lp2) * 120, this.env * R);            // instant attack, ~25 ms fade
      if (this.n % 15 === 14) {  // every 15th sample (45 kHz -> 3 kHz): the buzz, the same in both grips
        const k = (this.n - 14) / 15 * 2;
        this.ph = (this.ph + W) % (2 * Math.PI);
        this.feel[k] = this.feel[k + 1] = Math.min(1, this.env) * Math.sin(this.ph) * 127;
      }
      if (++this.n < 960) return;
      this.quiet = this.loud ? 0 : this.quiet + 1;
      if (this.quiet < 24) this.port.postMessage(this.buf.slice(0));
      this.n = 0; this.loud = false;
    }
  });
}
// Posts the blocks in order, one request at a time (blocks that pile up meanwhile go together).
const PadLink = {
  q: [], busy: false,
  async send(block) {
    this.q.push(block);
    if (this.busy) return;
    this.busy = true;
    while (this.q.length) {
      const blocks = this.q.splice(0, 50), body = new Uint8Array(blocks.length * 2048);
      blocks.forEach((b, i) => body.set(new Uint8Array(b), i * 2048));
      const ok = await fetch("/api/padaudio", { method: "POST", headers: { "X-Couch": "1" }, body }).then(r => r.ok, () => false);
      if (!ok) { this.q.length = 0; Out.detect(); break; }  // that controller's gone: back to the TV
    }
    this.busy = false;
  },
};

// ---------- sound: synthesized menu sounds, plus your intro music if there's a file for it
const Sound = (() => {
  let ctx, out, bus, sfx, padIn, padReady, music = null, bgm = null, on = store.get("couchSound") !== "off", foot = 0;
  let sfxVol = +(store.get("couchSfxVol") ?? 0.8), musicOn = store.get("couchMusic") !== "off";
  let musicVol = +(store.get("couchMusicVol") ?? 0.35), voiceOn = store.get("couchVoice") !== "off";
  // Your clips from web/audio/sbr, decoded once at load: slot -> [{ buf, voice, name }]. Variants
  // (launch-1, launch-2...) play at random; files with "-voice" in the name are character voice lines.
  const clips = {};
  const SLOT_OF = n => ({ "nav-move": "move", "tab-switch": "tab", "confirm-launch": "launch", launch: "launch", back: "back",
                          "control-center": "menu", "bgm-loop": "bgm" })[n.replace(/\.[^.]+$/, "").replace("-voice", "").replace(/-\d+$/, "")];
  function ac() {
    if (!ctx) {
      ctx = new AudioContext();
      bus = ctx.createGain(); bus.connect(ctx.destination);  // every sound meets here; route() points it
      sfx = ctx.createGain(); sfx.connect(bus);              // the menu sounds (not music), which the grips feel too
      out = ctx.createGain(); out.gain.value = 0.55 * sfxVol;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 9000;
      out.connect(lp).connect(sfx);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  // Every part of one sound is scheduled from the same instant: currentTime is read once per task, not per part.
  let T = null;
  const now = () => { if (T === null) { T = ac().currentTime; queueMicrotask(() => { T = null; }); } return T; };
  function tone(freq, t0, dur, type = "sine", gain = 0.1, toFreq) {
    const c = ac(), t = now() + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t0, dur, f0, f1, gain = 0.12, q = 1.2, attack = 0.01) {
    const c = ac(), t = now() + t0, len = Math.ceil(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = "bandpass"; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + dur + 0.01);
    s.onended = () => { s.disconnect(); f.disconnect(); g.disconnect(); };
  }
  // FM bell: a carrier bent by an inharmonic modulator (ratio 1.41) rings like struck metal; ratio 2 is warmer
  function bell(freq, t0, dur, gain = 0.05, ratio = 1.41, bright = 1.2) {
    const c = ac(), t = now() + t0, m = c.createOscillator(), mg = c.createGain(), o = c.createOscillator(), g = c.createGain();
    m.frequency.value = freq * ratio; o.frequency.value = freq;
    mg.gain.setValueAtTime(freq * bright, t); mg.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.8);  // bright strike, mellowing
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    m.connect(mg).connect(o.frequency); o.connect(g).connect(out);
    m.start(t); o.start(t); m.stop(t + dur + 0.02); o.stop(t + dur + 0.02);
  }
  // A hoof: a hollow knock (coconut-shell foley, which TV speakers carry) over a low thump the grips feel.
  // Slightly different every time, so a run of moves sounds like a horse, not a metronome.
  const clop = (t0, hi) => {
    const v = 0.96 + Math.random() * 0.08;
    noise(t0, 0.04, (hi ? 1250 : 950) * v, (hi ? 800 : 620) * v, 0.5, 5, 0.002);
    tone((hi ? 210 : 175) * v, t0, 0.06, "sine", 0.17, hi ? 90 : 75);
  };
  const jingle = t0 => [2350, 3120, 4060].forEach((f, i) => bell(f * (0.98 + Math.random() * 0.04), t0 + i * 0.02, 0.14, 0.012, 1.41, 0.5));  // spurs
  const whir = t0 => { tone(150, t0, 0.3, "triangle", 0.04, 700); noise(t0, 0.28, 600, 3600, 0.2, 2.5); };  // steel ball spin-up
  const play = fn => { if (on) try { fn(); } catch {} };
  // A clip for this slot, started right away (clips overlap; nothing waits for them). False = none added.
  function clip(slot, gain = sfxVol) {
    const list = (clips[slot] || []).filter(c => voiceOn || !c.voice);
    if (!list.length) return false;
    const c = ac(), s = c.createBufferSource(), g = c.createGain();
    s.buffer = list[Math.floor(Math.random() * list.length)].buf; g.gain.value = gain;
    s.connect(g).connect(sfx); s.start();
    return true;
  }
  // Built-in sounds, used for any slot you haven't added a clip for. Loudest last, as heard on the TV: move (you
  // hear it most), bump, back and tab, menu and select, battery, launch; measured offline, 4 to 10 dB apart.
  const synth = {
    move: () => clop(0, (foot ^= 1)),                                 // clip-clop as you move
    tab: () => { noise(0, 0.2, 700, 3800, 0.33, 2); tone(170, 0, 0.18, "triangle", 0.075, 680); bell(1319, 0.07, 0.35, 0.075); },  // a steel ball spins and rings
    back: () => { noise(0, 0.16, 2800, 600, 0.34, 1.2); tone(240, 0, 0.05, "sine", 0.09, 110); },  // rope swish, with a light tap
    menu: () => { noise(0, 0.26, 400, 3000, 0.26, 1); bell(784, 0.12, 0.5, 0.08, 1.41, 0.8); bell(1175, 0.2, 0.45, 0.056, 1.41, 0.8); },  // swoosh up, two-note chime
    launch: () => {                                                   // gallop off + golden chord
      [0, .09, .2, .36, .45, .56].forEach((t, i) => clop(t, i % 3 === 2));
      [392, 494, 587, 784].forEach((f, i) => bell(f, 0.62 + i * 0.07, 1.1, 0.1, 2, 0.5)); whir(0.55);
      jingle(0.66);
    },
  };
  const cue = slot => play(() => clip(slot) || synth[slot]());
  function startBgm() {  // looping menu music, low and faded in
    if (!on || !musicOn || bgm || !clips.bgm) return;
    const c = ac(), s = c.createBufferSource(), g = c.createGain(), t = c.currentTime;
    s.buffer = clips.bgm[0].buf; s.loop = true;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(musicVol, 0.001), t + 2.5);
    s.connect(g).connect(bus); s.start(t);
    bgm = { s, g };
  }
  function stopBgm(fade = 0.8) {  // ducks it away (a game is starting, or music was turned off)
    if (!bgm) return;
    const t = ac().currentTime, { s, g } = bgm; bgm = null;
    try { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t); g.gain.exponentialRampToValueAtTime(0.0001, t + fade); s.stop(t + fade + 0.05); } catch {}
  }
  function stopMusic(fade = 0.6) {
    if (!music) return;
    const t = ac().currentTime, { s, g } = music; music = null;
    try { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t); g.gain.exponentialRampToValueAtTime(0.0001, t + fade); s.stop(t + fade + 0.05); } catch {}
  }
  return {
    get on() { return on; },
    toggle() { on = !on; store.set("couchSound", on ? "on" : "off"); if (on) { this.select(); startBgm(); } else { stopMusic(); stopBgm(); } },
    unlock() { if (ctx && ctx.state === "suspended") ctx.resume(); },  // browsers start audio on the first press
    async loadClips(names) {
      await Promise.all(names.map(async name => {
        const slot = SLOT_OF(name);
        if (!slot) return;
        try {
          const buf = await ac().decodeAudioData(await (await fetch("/audio/sbr/" + encodeURIComponent(name))).arrayBuffer());
          (clips[slot] ||= []).push({ buf, voice: name.includes("-voice"), name });
        } catch {}  // a file that won't decode is skipped; the built-in sound stays
      }));
    },
    has: slot => !!clips[slot]?.length,
    names: slot => (clips[slot] || []).map(c => c.name),
    get sfxVol() { return sfxVol; },
    set sfxVol(v) { sfxVol = v; store.set("couchSfxVol", v); if (out) out.gain.value = 0.55 * v; },
    get musicOn() { return musicOn; },
    set musicOn(v) { musicOn = v; store.set("couchMusic", v ? "on" : "off"); v ? startBgm() : stopBgm(); },
    get musicVol() { return musicVol; },
    set musicVol(v) { musicVol = v; store.set("couchMusicVol", v); if (bgm) bgm.g.gain.setTargetAtTime(Math.max(v, 0.0001), ac().currentTime, 0.1); },
    get voiceOn() { return voiceOn; },
    set voiceOn(v) { voiceOn = v; store.set("couchVoice", v ? "on" : "off"); },
    startBgm, stopBgm,
    test(slot) {  // the soundboard: plays a slot even with sounds off
      if (slot === "bgm") { if (clips.bgm) this.music(clips.bgm[0].buf, 8, Math.max(musicVol, 0.05), true); return; }
      clip(slot) || synth[slot]();
    },
    // where everything plays: "" = Windows' default (the TV), a device id = the DualSense speaker on USB,
    // "bt" = the TV and a DualSense over Bluetooth (through the server)
    async route(id) {
      const c = ac();
      if (id === "bt") padReady ||= c.audioWorklet.addModule(URL.createObjectURL(new Blob([`(${padTapWorklet})()`], { type: "text/javascript" })))
        .then(() => {
          const tap = new AudioWorkletNode(c, "pad-tap", { numberOfInputs: 2, numberOfOutputs: 0 }), lift = c.createGain(), limit = c.createDynamicsCompressor();
          tap.port.onmessage = e => PadLink.send(e.data);
          // its speaker is small: 4x (+12 dB), with the peaks limited so loud bits don't crackle
          lift.gain.value = 4;
          limit.threshold.value = -9; limit.knee.value = 3; limit.ratio.value = 20; limit.attack.value = 0.002; limit.release.value = 0.15;
          lift.connect(limit).connect(tap, 0, 0);
          return { lift, tap };
        });
      padIn = id === "bt" ? await padReady.catch(() => null) : null;
      bus.disconnect(); bus.connect(c.destination);
      sfx.disconnect(); sfx.connect(bus);
      if (padIn) { bus.connect(padIn.lift); sfx.connect(padIn.tap, 0, 1); }  // speaker: everything; grips: menu sounds
      if (c.setSinkId) c.setSinkId(id === "bt" ? "" : id).catch(() => {});
    },
    decode: data => ac().decodeAudioData(data),
    music(buf, seconds, gain, force, padOnly) {  // fades in, plays `seconds`, fades out (padOnly: not on the TV)
      if (!on && !force) return;
      stopMusic(0.3);
      const c = ac(), s = c.createBufferSource(), g = c.createGain(), t = c.currentTime, end = Math.min(seconds, buf.duration);
      s.buffer = buf;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 1.2);
      g.gain.setValueAtTime(gain, t + Math.max(1.3, end - 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + end);
      s.connect(g).connect(padOnly && padIn?.lift || bus); s.start(t); s.stop(t + end + 0.05);
      music = { s, g };
    },
    stopMusic,
    move: () => cue("move"),
    tab: () => cue("tab"),
    menu: () => cue("menu"),
    bump: () => play(() => { tone(110, 0, 0.11, "sine", 0.23, 55); noise(0, 0.025, 500, 350, 0.29, 1.5, 0.002); }),  // can't go further: a dull wooden thud
    select: () => play(() => { tone(330, 0, 0.05, "sine", 0.15, 140); bell(659, 0, 0.22, 0.09, 2, 0.6); bell(988, 0.06, 0.32, 0.09, 2, 0.6); jingle(0.05); }),  // rising fifth + spurs
    back: () => cue("back"),
    open: () => play(synth.menu),
    battery: () => play(() => { bell(880, 0, 0.18, 0.105, 2, 0.4); bell(587, 0.2, 0.3, 0.105, 2, 0.4); }),  // controller low: falling, soft
    launch: () => { stopBgm(0.5); cue("launch"); },
    fanfare: () => play(() => {                                      // original "race start": gallop, bugle call, spurs
      [0, .11, .24, .42, .53, .66, .84, .95, 1.08].forEach((t, i) => clop(t, i % 3 === 2));
      [[392, 1.2, .2], [523, 1.4, .2], [659, 1.6, .2], [784, 1.8, 1]].forEach(([f, t, d]) => { tone(f, t, d, "sawtooth", 0.09); tone(f * 2, t, d, "triangle", 0.075); });
      jingle(1.85); whir(1.75);
    }),
  };
})();

// ---------- where launcher sounds play: the DualSense speaker, otherwise the TV. On a USB cable Windows has it
// as a sound device (device names need a media permission; the server pre-grants it in this page's own Edge
// profile, allow_audio_names, so there is no prompt). Over Bluetooth the server plays it ("bt", see PadLink).
const Out = {
  id: "", where: "TV",
  async detect() {
    if (PREVIEW) return;
    let id = "";
    try {
      const md = navigator.mediaDevices;
      let devs = await md.enumerateDevices();
      if (!devs.some(d => d.kind === "audiooutput" && d.label)) {
        const s = await md.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop());
        devs = await md.enumerateDevices();
      }
      id = devs.find(d => d.kind === "audiooutput" && /wireless controller|dualsense/i.test(d.label))?.deviceId || "";
    } catch {}
    if (!id) try { if ((await api("/api/padspeaker")).ok) id = "bt"; } catch {}
    if (id !== this.id) { this.id = id; this.where = { "": "TV", bt: "TV and controller" }[id] || "controller"; Sound.route(id); if (info) build(); updatePrompts(); }
  },
};
navigator.mediaDevices?.addEventListener?.("devicechange", () => Out.detect());

// Intro music: the first file in web/audio (e.g. the SBR opening, from your own copy). It plays at startup, and on the
// TV while a game is starting, fading out as soon as the game's window takes over. No file: the race-start fanfare.
const Intro = {
  buf: null,
  async get() {
    if (!info?.intro) return null;
    if (!this.buf) try { this.buf = await Sound.decode(await (await fetch("/audio/intro")).arrayBuffer()); } catch { return null; }
    return this.buf;
  },
  async play(when) {
    if (!Sound.on) return;
    const buf = await this.get();
    if (when === "launch" && !document.body.classList.contains("starting")) return;  // the game was up before the file decoded
    if (buf) Sound.music(buf, when === "launch" ? 60 : 45, Out.id ? 0.6 : 0.35);
    else Sound.fanfare();
  },
};

// ---------- clock
let wxLine = "";  // the weather in words ("58° Clear"), set by renderWeather, shown under the screensaver clock
function tick() {
  const d = new Date();
  $("#clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  $("#date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  const c = $("#idle-clock"); c.textContent = $("#clock").textContent;  // runs at startup: nothing defined further down
  if (wxLine) c.append(Object.assign(document.createElement("small"), { textContent: wxLine }));
}
tick(); setInterval(tick, 10000);

// ---------- idle: after 10 minutes without input, a dark screen and a wandering clock; the next press only wakes it
const IDLE_MS = 10 * 60 * 1000;
let lastInput = Date.now();
function wake() {
  lastInput = Date.now();
  document.body.classList.remove("calm");
  if (!document.body.classList.contains("idle")) return false;
  document.body.classList.remove("idle");
  // woken on one of your games: it's selected (this press only wakes; the next plays it)
  const r = idleGame && !modal ? rows.findIndex(row => row.some(t => t.game?.key === idleGame)) : -1;
  if (r >= 0) focus(r, rows[r].findIndex(t => t.game?.key === idleGame));
  idleGame = null;
  return true;
}
let idleN = 0, idleGame = null, idleShots = [];
// the screensaver's slides: the show's art, your recent games' art (waking it selects the game shown) and your
// newest screenshots, in turn
function idleSlides() {
  const games = (info?.games || []).filter(g => g.hero || g.appid).slice(0, 4)
    .map(g => ({ url: g.hero || `/art/${g.appid}/hero`, game: g.key, label: g.title || g.name }));
  const shots = idleShots.slice(0, 4).map(s => ({ url: "/media/" + encodeURIComponent(s.name) }));
  const out = [], n = Math.max(IDLE_ART.length, games.length, shots.length);
  for (let i = 0; i < n; i++) for (const list of [IDLE_ART.map(url => ({ url })), games, shots]) if (list[i]) out.push(list[i]);
  return out;
}
function placeIdleClock() {
  const a = $("#idle-art"), c = $("#idle-clock");
  a.classList.remove("on");
  const slides = idleSlides(), s = slides[idleN++ % slides.length];
  setTimeout(() => { a.style.backgroundImage = `url("${s.url}")`; a.classList.add("on"); idleGame = s.game || null; tick();
    if (s.label) c.append(Object.assign(document.createElement("small"), { textContent: s.label })); }, 1200);
  const b = $("#idle-ball"); b.classList.remove("roll");
  if (Math.random() < .25) { void b.offsetWidth; b.classList.add("roll"); }
  c.style.left = 5 + Math.random() * 75 + "vw"; c.style.top = 5 + Math.random() * 80 + "vh";
}
setInterval(() => {
  if (document.body.classList.contains("idle")) placeIdleClock();
  else if (!modal && Date.now() - lastInput > IDLE_MS) {
    api("/api/media").then(r => { idleShots = r.shots || []; }).catch(() => {});  // your newest screenshots join in
    placeIdleClock(); document.body.classList.add("idle");
    api("/api/padoff", { idle: true }).catch(() => {});  // like a PS5: save the wireless controller's battery
  }
}, 60000);
setInterval(() => { if (!modal && Date.now() - lastInput > 8000) document.body.classList.add("calm"); }, 1000);  // 8 s untouched
addEventListener("mousemove", wake);

// ---------- controller battery (sent by the server as pad:<level>): a DualSense-style battery icon
let padLevel = null;
const PAD_ORDER = ["empty", "low", "medium", "full", "max", "wired"];
const padSvg = level => {  // a level ending in + is on charge
  const chg = level.endsWith("+"); level = level.replace("+", "");
  const fill = { empty: .08, low: .25, medium: .6 }[level] ?? 1;
  return `<svg viewBox="0 0 34 18" aria-hidden="true"><rect x="1" y="1" width="28" height="16" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/>`
    + `<rect x="30" y="6" width="3" height="6" rx="1" fill="currentColor"/><rect x="4" y="4" width="${(22 * fill).toFixed(1)}" height="10" rx="1.5" fill="currentColor"/>`
    + (level === "wired" || chg ? '<path d="M16.5 3l-5 7h4l-2 5 6-8h-4z" fill="#0b0d12"/>' : "") + `</svg>`;
};
// live PC tiles: a battery ring per controller, the fullest drive's space, the newest screenshot
const ring = (v, color) => `<span class="ring" style="--v:${Math.max(.04, Math.min(1, v)).toFixed(2)}${color ? `;--rc:${color}` : ""}"></span>`;
const PAD_FILL = { empty: .05, low: .2, medium: .55, full: .85, max: 1, wired: 1 };
let padList = [];
function padTile() {
  const g = $("#system .pads .glance");
  if (g) g.innerHTML = padList.length ? padList.map(lv => ring(PAD_FILL[lv.replace("+", "")] ?? 1,
    lv === "wired" || lv.endsWith("+") ? "var(--ice)" : lv === "low" || lv === "empty" ? "var(--ps-circle)" : null)).join("") : icon("pad");
}
async function liveTiles() {
  const [s, m] = await Promise.all([api("/api/storage").catch(() => null), api("/api/media").catch(() => null)]);
  const st = $("#system .storage"), me = $("#system .media");
  if (st && s?.drives?.length) {
    const d = s.drives.reduce((a, b) => b.free / b.total < a.free / a.total ? b : a), used = 1 - d.free / d.total;
    st.querySelector(".glance").innerHTML = ring(used, used > .9 ? "var(--ps-circle)" : null);
    st.querySelector("small").textContent = `${d.name} ${Math.round(d.free / 1e9)} GB free`;
  }
  if (me && m?.shots?.length) { me.classList.add("shot"); me.style.setProperty("--shot", `url("/media/${encodeURIComponent(m.shots[0].name)}")`); }
}

function showPad(levels) {  // "none", or one level per controller: "full,low"
  const list = levels === "none" ? [] : levels.split(",");
  padList = list; padTile();
  const eff = list.map(lv => lv.endsWith("+") ? "wired" : lv);  // on charge counts as fine, whatever the level
  const weakest = eff.reduce((a, b) => PAD_ORDER.indexOf(b) < PAD_ORDER.indexOf(a) ? b : a, eff[0]) || "none";
  const low = weakest === "empty" || weakest === "low", p = $("#pad");
  if (low && padLevel && padLevel !== "low" && padLevel !== "empty") {
    Sound.battery(); toast(list.length > 1 ? "A controller's battery is low. Charge it soon." : "Controller battery low. Charge it soon.");
  }
  padLevel = weakest;
  p.classList.toggle("low", low);
  if (!list.length) { p.innerHTML = "<span>No controller</span>"; p.title = ""; return; }
  const label = { empty: "Battery empty", low: "Battery low", wired: list.some(lv => lv.endsWith("+")) ? "Charging" : "Plugged in" }[weakest] || (list.length > 1 ? `${list.length} controllers` : "");
  p.innerHTML = list.map(padSvg).join("") + `<span>${label}</span>`;
  p.title = list.map((lv, i) => `Controller ${i + 1}: ${lv}`).join(", ");
}

// ---------- toast
let toastTimer;
// what toasts said, newest first, so a missed one can be read later; kept in this browser profile across restarts
const notes = (() => { try { return JSON.parse(store.get("couchNotes")) || []; } catch { return []; } })(); let unseen = 0;
function bell() {
  const b = $("#bell"); b.hidden = !unseen; b.innerHTML = `${icon("bell")}<span>${unseen}</span>`;
  const t = $("#system .notes"); if (t) t.dataset.meta = notes[0] ? `Latest: ${notes[0].msg}` : "Nothing yet";
}

    notes.length ? notes.map(n => ({ label: n.msg, sub: at(n.t) })) : [{ label: "Done" }], { vertical: true });
}

// ---------- home backdrop: the show's official key art, crossfading slowly; a focused game's art covers it
const SKIES = ["/poster.webp", "/img/sbr-riders.jpg", "/img/sbr-race.jpg"];
const IDLE_ART = [...SKIES, "/img/sbr-desert.jpg"];  // too wide for the home backdrop: Johnny would sit under the menu
let skyFront = $("#skyA"), skyBack = $("#skyB"), skyN = 0;
function nextSky() {
  const url = SKIES[skyN++ % SKIES.length], img = new Image();
  img.onload = () => {
    skyBack.style.setProperty("--art", `url("${url}")`);
    // fade from where the picture starts: a tall poster begins well right of a wide one
    const left = Math.max(0, 100 - 100 * innerHeight * img.naturalWidth / img.naturalHeight / innerWidth);
    skyBack.style.setProperty("--f0", Math.max(22, left) + "%");
    skyBack.style.setProperty("--f1", Math.max(52, left + 14) + "%");
    skyBack.classList.add("on"); skyFront.classList.remove("on");
    [skyFront, skyBack] = [skyBack, skyFront];
  };
  img.src = url;
}
nextSky();
setInterval(() => { if (!document.hidden && !bgWant) nextSky(); }, 20000);

// ---------- backdrop: the focused game's art, crossfaded
let bgFront = $("#bgA"), bgBack = $("#bgB"), bgWant = null, bgTimer;
function setBackdrop(url) {
  if (url === bgWant) return;
  bgWant = url; clearTimeout(bgTimer);
  bgTimer = setTimeout(() => {
    if (!url) { bgFront.classList.remove("on"); return; }
    const img = new Image();
    img.onload = () => {
      if (bgWant !== url) return;
      bgBack.style.backgroundImage = `url("${url}")`;
      bgBack.classList.add("on"); bgFront.classList.remove("on");
      [bgFront, bgBack] = [bgBack, bgFront];
    };
    img.onerror = () => { if (bgWant === url) bgFront.classList.remove("on"); };
    img.src = url;
  }, 140);
}

  : c <= 57 ? ["rain", "Drizzle"] : c <= 67 ? ["rain", "Rain"] : c <= 77 ? ["snow", "Snow"] : c <= 82 ? ["rain", "Showers"]
  : c <= 86 ? ["snow", "Snow showers"] : ["storm", "Thunderstorms"];

function ago(sec) {

}

// The PC row and the Options menu share these

// Sunshine by controller: the server holds its login (encrypted for this Windows account) and makes the calls
let sunBusy = 0;  // a Sunshine call in flight: presses wait, so none lands on a tile behind a closing dialog
async function sunshineCall(action, extra = {}) {
  sunBusy++;
  const r = await api("/api/sunshine", { action, ...extra }).catch(() => ({ error: "Couch isn't responding. Try again in a moment." }))
    .finally(() => sunBusy--);
  if (r.error === "login") { info.sunshineLogin = false; toast("Sunshine needs its login again: Streaming → Connect to Sunshine"); return null; }
  if (r.error) { toast(r.error); return null; }
  return r.result ?? r;
}
async function connectSunshine() {
  const user = await promptText("Sunshine username");
  if (user == null) return;
  const password = await promptText("Sunshine password", { secret: true });
  if (password == null) return;
  toast("Checking with Sunshine…");
  if ((await sunshineCall("login", { user, password }))?.ok) { info.sunshineLogin = true; toast("Connected to Sunshine"); streamMenu(); }
}
async function pairDevice(again) {
  const r = await sunshineCall("pending");
  if (!r) return again && closeModal($("#dialog"));
  const list = r.pairings || [], nameOf = p => p.name || p.client_name || p.device_name || "Moonlight device";
  if (!list.length && again) return toast("Nothing is asking to pair yet. Keep the PIN on the other screen and try again.");
  if (!list.length) return choose("Pair a device", "On the new device, open Moonlight and choose this PC. While it shows a PIN, press below.",
    [{ label: "It shows a PIN now", stay: true, fn: () => pairDevice(true) }, { label: "Done" }], { vertical: true });
  if (again) closeModal($("#dialog"));
  const pair = async p => {
    const pin = await promptText(`PIN shown on ${nameOf(p)}`);
    if (!pin) return;
    const res = await sunshineCall("pair", { pairing_id: p.id, pin: pin.trim(), name: nameOf(p) });
    if (res) toast(res.status === false || res.status === "false" ? "Sunshine didn't accept that PIN. Try again." : `${nameOf(p)} paired`);
  };
  if (list.length === 1) return pair(list[0]);
  choose("Pair a device", "Which device is asking?", list.map(p => ({ label: nameOf(p), fn: () => pair(p) })), { vertical: true });
}

    const t = el("div", "item sys " + (p.cls || "") + (p.live ? " " + p.live : ""),
      `<span class="glance">${icon(p.icon)}</span><span>${esc(p.label)}</span>${p.live === "storage" ? "<small></small>" : ""}${badge()}`);
    t.dataset.title = p.label; t.dataset.meta = p.meta; t.dataset.cta = p.cta;
    t.onactivate = p.fn; sys.append(t);
  }
  padTile(); liveTiles();

  for (const tr of document.querySelectorAll("#rows .track")) { tr.dataset.x = 0; tr.style.transform = ""; }
  rows = [...document.querySelectorAll("#rows .track")].map(s => [...s.querySelectorAll(".item")]).filter(r => r.length);
  rows.forEach((row, r) => row.forEach((e, c) => {
    // Steam's desktop layout moves the mouse with the right stick; don't let that steal focus.
    e.addEventListener("mouseenter", () => { if (!modal && performance.now() - lastPadAt > 1500 && (pos.r !== r || pos.c !== c)) { focus(r, c); Sound.move(); } });
    e.addEventListener("click", () => { if (!modal) { focus(r, c); Sound.select(); e.onactivate(); } });
  }));
  if (chosen) focus(Math.min(pos.r, rows.length - 1), lastCol[pos.r] ?? 0);
  updatePrompts();
}

// Horizontal: glide the row (on a spring) so the tile is in view
function slide(e) {
  const track = e.parentElement, strip = track.parentElement;
  const padL = parseFloat(getComputedStyle(strip).paddingLeft) || 0, view = strip.clientWidth - 2 * padL;
  let x = +track.dataset.x || 0;
  const left = e.offsetLeft, w = e.offsetWidth;
  if (left < x) x = left; else if (left + w > x + view) x = left + w - view;
  x = Math.max(0, Math.min(x, Math.max(0, track.scrollWidth - view)));
  track.dataset.x = x; track.style.transform = `translateX(${-x}px)`;
}

function focus(r, c) {
  document.querySelectorAll("#rows .focus").forEach(e => e.classList.remove("focus"));
  r = Math.max(0, Math.min(rows.length - 1, r));
  c = Math.max(0, Math.min(rows[r].length - 1, c));
  pos = { r, c }; lastCol[r] = c; chosen = true;
  const e = rows[r][c]; e.classList.add("focus");
  // tint the focus by what's focused, after iOS's tinted icons: a game's cover colour, an app's brand colour, else gold
  if (e.tint === undefined && e.classList.contains("loaded")) e.tint = artColor(e.querySelector(".art"));
  document.body.style.setProperty("--focus", e.tint ? `rgb(${e.tint})` : "");
  const glowAt = () => { const r = e.getBoundingClientRect(), b = document.body.style;  // twice: the rows glide into place
    b.setProperty("--gx", `${r.left + r.width / 2}px`); b.setProperty("--gy", `${r.top + r.height / 2}px`); };
  glowAt(); clearTimeout(focus.glow); focus.glow = setTimeout(glowAt, 620);
  document.querySelectorAll("#rows section").forEach(sec => sec.classList.toggle("active", sec.contains(e)));
  document.body.classList.add("chosen");
  showDetails(e);
  slide(e);
  // vertical: slide rows so the focused row is visible
  const sec = e.closest("section"), main = $("main");
  // rects, not offsetTop: once #rows has a transform it becomes the offsetParent.
  // Clamp at the bottom, but snap to a row start so no half-row peeks under the header.
  const box = $("#rows"), y0 = box.getBoundingClientRect().top;
  const tops = [...box.children].map(s => s.getBoundingClientRect().top - y0 - 4);
  const want = Math.min(sec.getBoundingClientRect().top - y0 - 4, box.scrollHeight - main.clientHeight);
  const shift = Math.max(0, tops.find(t => t >= want));
  box.style.transform = `translateY(${-shift}px)`;
  updatePrompts();
}

function move(dir) {
  if (modal) {
    if (modal.move) return modal.move(dir);
    const cur = modal.els[modal.i];
    if ((dir === "left" || dir === "right") && cur?.choice?.adjust) return cur.choice.adjust(dir === "left" ? -1 : 1, cur);
    const step = { left: -1, up: -1, right: 1, down: 1 }[dir];  // rows of buttons and lists alike
    if (step) {
      const i = Math.max(0, Math.min(modal.els.length - 1, modal.i + step));
      if (i === modal.i) return Sound.bump();
      modal.i = i; Sound.move();
      modal.els.forEach((e, k) => e.classList.toggle("focus", k === modal.i));
    }
    return;
  }
  if (!chosen) { focus(pos.r, 0); return Sound.move(); }  // first press just shows the highlight
  const before = pos.r + ":" + pos.c;
  if (dir === "left") focus(pos.r, pos.c - 1);
  if (dir === "right") focus(pos.r, pos.c + 1);
  if (dir === "up" && pos.r > 0) focus(pos.r - 1, lastCol[pos.r - 1] ?? 0);
  if (dir === "down" && pos.r < rows.length - 1) focus(pos.r + 1, lastCol[pos.r + 1] ?? 0);
  if (pos.r + ":" + pos.c !== before) return Sound.move();
  Sound.bump();  // the end of a row: like tvOS, the tile nudges that way and springs back
  const e = rows[pos.r][pos.c], d = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[dir] || [0, 0];
  e.style.setProperty("--nx", `${d[0] * 1.4}vh`); e.style.setProperty("--ny", `${d[1] * 1.4}vh`);
  e.classList.remove("nudge"); void e.offsetWidth; e.classList.add("nudge");
}
// L1/R1: previous/next category (row)
function category(step) {
  if (modal) return Sound.bump();
  if (!chosen) { focus(pos.r, 0); return Sound.move(); }
  const r = pos.r + step;
  if (r < 0 || r >= rows.length) return Sound.bump();
  focus(r, lastCol[r] ?? 0); Sound.tab();
}
// L2/R2: five tiles at a time along a row (a long games row in a couple of pulls)
function page(step) {
  if (modal) return Sound.bump();
  if (!chosen) { focus(pos.r, 0); return Sound.move(); }
  const c = Math.max(0, Math.min(rows[pos.r].length - 1, pos.c + 5 * step));
  if (c === pos.c) return Sound.bump();
  focus(pos.r, c); Sound.tab();
}
function pressFx() {  // a quick press look on whatever is focused
  const e = document.querySelector(".item.focus, .card .choice.focus, .key.focus");
  if (e) { e.classList.add("press"); setTimeout(() => e.classList.remove("press"), 140); }
}
function activate() {
  if (sunBusy) return Sound.bump();  // waiting on Sunshine (see sunshineCall)
  if (modal) {
    if (modal.activate) return modal.activate();
    const e = modal.els[modal.i]; if (e) { Sound.select(); e.onactivate(); } return;
  }
  if (!chosen) return;
  Sound.select(); rows[pos.r][pos.c].onactivate();
}
function back() { if (modal) { Sound.back(); modal.onBack(); } }

// ---------- the controllers' light bar (the server sets it): Steel Ball Run gold in the menu, and while a game
// starts and plays, its own colour: the most vivid part of its cover, or a store app's brand colour
const GOLD = [242, 184, 68];  // --gold
let gameLight = null;
const padLight = rgb => { if (!PREVIEW) api("/api/light", { rgb: rgb || GOLD }).catch(() => {}); };
// LED-ready: part of the grey taken out, then full brightness (a pastel would just light up white)
const ledColor = rgb => { const lo = Math.min(...rgb) * 0.6, c = rgb.map(v => v - lo), m = Math.max(...c); return m ? c.map(v => Math.round(v * 255 / m)) : null; };
const hexColor = h => ledColor([1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
function artColor(img) {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 16;
    const x = c.getContext("2d"); x.drawImage(img, 0, 0, 16, 16);
    const d = x.getImageData(0, 0, 16, 16).data, sum = [0, 0, 0]; let w = 0;
    for (let i = 0; i < d.length; i += 4) {
      const hi = Math.max(d[i], d[i + 1], d[i + 2]), lo = Math.min(d[i], d[i + 1], d[i + 2]);
      const k = hi ? ((hi - lo) / hi) ** 2 * hi / 255 : 0;  // saturated, bright pixels count most
      for (let j = 0; j < 3; j++) sum[j] += d[i + j] * k;
      w += k;
    }
    return w > 4 ? ledColor(sum) : null;  // a grey cover, or art from another site (unreadable): gold
  } catch { return null; }
}

// ---------- actions
let launching = false;
async function launch(body, name, rgb) {
  if (launching) return;
  launching = true; setTimeout(() => launching = false, 3000);
  gameLight = rgb; padLight(rgb);
  Sound.launch();
  Intro.play("launch");
  showStarting(name);
  try {
    const r = await api("/api/launch", body);
    if (!r.ok) { hideStarting(); toast(r.error || `Couldn't start ${name}. Try again in a moment.`); }
    else if (r.took) $("#starting-note").textContent = startHint = `Starting… Last time it took about ${r.took} seconds.`;
  } catch { hideStarting(); toast("Couch isn't responding. Try again in a moment; if it keeps happening, restart the PC."); }
}

// The starting screen stays until the game's window takes the screen (the launcher loses focus for good),
// ○ hides it, or 90 s pass (the server's limit for showing a launcher that's stuck). Hiding it never stops the game from starting.
let startTimer, slowTimer, startHint;

  $("#starting-note").textContent = "Starting…"; startHint = null;
  clearTimeout(slowTimer); slowTimer = setTimeout(() => { if (!startHint) $("#starting-note").textContent = "Still starting. Big games can take a minute."; }, 10000);
  $("#starting").classList.add("show"); document.body.classList.add("modal", "starting");

}

  clearTimeout(startTimer); clearTimeout(slowTimer);

}
let blurTimer;  // a store launcher the server keeps behind Couch can take focus for a moment; Couch takes it back
addEventListener("blur", () => { clearTimeout(blurTimer); blurTimer = setTimeout(hideStarting, 1500); });
addEventListener("focus", () => clearTimeout(blurTimer));

function openModal(overlay, els, onBack, start = 0, sound = "open") {

  modal = { els, i: start, onBack: onBack || (() => closeModal(overlay)) };

// A dialog of choices ({label, sub, fn, cls, check, icon}); ○ closes it.
// vertical: a list (menu, audio outputs); start: which one is focused first; art + lines: a game's details.
function choose(title, text, choices, { vertical = false, start = 0, art = "", lines = [], gauges = "", sound = "open" } = {}) {

  $("#dlg-gauges").innerHTML = gauges;

      + (bar != null ? `<span class="bar"><i style="width:${Math.round(bar * 100)}%"></i></span>` : "") + (check ? icon("check", "check") : ""));

}

// Audio output: Windows' default for everything; the server keeps it there when devices come and go
// "SAMSUNG (NVIDIA High Definition Audio)" -> ["Samsung", "NVIDIA High Definition Audio"]
function deviceName(full) {
  const m = /^(.*) \(([^()]*)\)$/.exec(full) || [, full, ""];
  const name = m[1] === m[1].toUpperCase() && m[1].length > 3 ? m[1][0] + m[1].slice(1).toLowerCase() : m[1];
  return [name, m[2]];
}
const deviceIcon = full => /headphone|headset|earbud|arctis|airpods|buds/i.test(full) ? "headphones"
  : /nvidia|amd|intel.*display|hdmi|displayport|samsung|lg|sony|tv/i.test(full) ? "tv" : "speaker";

  const a = await api("/api/audio").catch(() => null);
  if (!a) return toast("Couch isn't responding. Try again in a moment; if it keeps happening, restart the PC.");
  const list = a.devices.length ? a.devices : a.current ? [a.current] : [];
  if (!list.length) return toast("No speakers or screens are on. Turn one on, then try again.");
  choose("Audio output", "Games, videos and the PC play here, and it stays that way until you change it.",
    list.map(d => {
      const [label, sub] = deviceName(d.name);
      return { label, sub, icon: deviceIcon(d.name), check: d.id === a.current?.id, fn: () => setAudio(d) };
    }), { vertical: true, start: Math.max(0, list.findIndex(d => d.id === a.current?.id)) });

// Sound settings (Menu > Sound): effects, volumes, menu music, voice lines, and a soundboard to test your clips.
// Up/down moves; left/right changes a volume.
function soundSettings(start = 0) {
  const pct = v => `${Math.round(v * 100)}%`;
  const slider = key => ({
    sub: `${pct(Sound[key])}. Left and right change it`, bar: Sound[key], stay: true,
    adjust(step, b) {
      Sound[key] = Math.max(0, Math.min(1, Math.round((Sound[key] + step * 0.1) * 10) / 10));
      b.querySelector(".bar i").style.width = pct(Sound[key]);
      b.querySelector("small").textContent = `${pct(Sound[key])}. Left and right change it`;
      if (key === "sfxVol") Sound.move();
    },
  });
  const again = i => () => { rebuildKeepFocus(); soundSettings(i); };
  choose("Sound", "", [
    { label: "Sound effects", sub: Sound.on ? `On, playing on the ${Out.where}` : "Off", icon: Sound.on ? "sound" : "mute",
      check: Sound.on, fn: () => { Sound.toggle(); again(0)(); } },
    { label: "Effects volume", icon: "sound", ...slider("sfxVol") },
    { label: "Menu music", icon: "music", check: Sound.musicOn,
      sub: !Sound.musicOn ? "Off" : Sound.has("bgm") ? "On" : "On, once you add bgm-loop.mp3",
      fn: () => { Sound.musicOn = !Sound.musicOn; again(2)(); } },
    { label: "Music volume", icon: "music", ...slider("musicVol") },
    { label: "Voice lines", icon: "voice", check: Sound.voiceOn, sub: Sound.voiceOn ? "On" : "Off: effects only",
      fn: () => { Sound.voiceOn = !Sound.voiceOn; again(4)(); } },
    { label: "Test sounds", icon: "resume", sub: "Hear each slot, with your clips or the built-in sounds", fn: soundboard },
  ], { vertical: true, start });
}
const SLOTS = [["move", "Move", "nav-move"], ["tab", "Category (L1 / R1)", "tab-switch"], ["launch", "Start a game", "launch-1"],
               ["back", "Back", "back"], ["menu", "Menu", "control-center"], ["bgm", "Menu music", "bgm-loop"]];

// □ Details on a game: its cover, facts, and Play / Pin to front / Hide (the server keeps pins and hides)

    { label: "Rename", icon: "edit", sub: "Your own name for it, here only", fn: async () => {

    ...(own ? [{ label: "Original name and art", icon: "restart", fn: () => setChoice("rename", g, "").then(() => setChoice("art", g, "")) }] : []),

async function setChoice(action, g, value) {
  const r = await api("/api/games", { action, key: g?.key, value }).catch(() => null);

// ---------- task manager: what's running on the PC, processor and memory use, and closing apps

function taskSub(a) {
  if (a.hung) return "Not responding";
  if (closing.has(a.id) && Date.now() - closing.get(a.id) > 4000) return "Still open. Choose it to force close";
  return `Using ${mem(a.bytes)}`;
}
async function taskManager(start = 0, quiet = false) {
  let t;
  try { t = await api("/api/tasks"); } catch { return toast("Couch isn't responding. Try again in a moment; if it keeps happening, restart the PC."); }
  const ids = t.apps.map(a => a.id).join(), token = {};
  choose("Task manager", t.apps.length ? "" : "Nothing else is open. Games and apps you start show up here.",
    t.apps.length ? t.apps.map(a => ({ label: a.name, sub: taskSub(a), fn: () => taskActions(a) })) : [{ label: "Done" }],
    { vertical: true, start: Math.min(start, Math.max(0, t.apps.length - 1)), gauges: taskGauges(t), sound: quiet ? "" : "menu" });
  modal.tasks = token;
  const tick = setInterval(async () => {  // keep the numbers live while it's open
    if (modal?.tasks !== token) return clearInterval(tick);
    let n; try { n = await api("/api/tasks"); } catch { return; }
    if (modal?.tasks !== token) return clearInterval(tick);
    if (n.apps.map(a => a.id).join() !== ids) { clearInterval(tick); return taskManager(modal.i, true); }  // something opened or closed
    $("#dlg-gauges").innerHTML = taskGauges(n);
    n.apps.forEach((a, i) => { const s = modal.els[i]?.querySelector("small"); if (s) s.textContent = taskSub(a); });
  }, 2000);
}
function taskActions(a) {
  const act = action => api("/api/tasks", { id: a.id, action }).then(r => {
    if (r.error) { toast(r.error); return taskManager(0, true); }
    if (action === "close") { closing.set(a.id, Date.now()); toast(`Closing ${a.name}…`); setTimeout(() => taskManager(0, true), 1500); }
    if (action === "force") { toast(`Force closed ${a.name}`); setTimeout(() => taskManager(0, true), 1500); }
  }).catch(() => toast("Couch isn't responding. Try again in a moment; if it keeps happening, restart the PC."));
  const stuck = a.hung || (closing.has(a.id) && Date.now() - closing.get(a.id) > 4000);
  choose(a.name, a.hung ? "It isn't responding." : `Using ${mem(a.bytes)} of memory.`, [
    { label: "Switch to", icon: "resume", fn: () => act("switch") },
    { label: "Close", icon: "close", sub: "Like its own close button: it can still ask to save", fn: () => act("close") },
    ...(stuck ? [{ label: "Force close", icon: "power", cls: "danger", sub: "Unsaved work in it will be lost",
                   fn: () => confirmAction("Force close?", /steam/i.test(a.exe) ? "Steam closes completely, with any game it started."
                     : `${a.name} closes right away without saving.`, "Force close", () => act("force")) }] : []),
  ], { vertical: true });
}
