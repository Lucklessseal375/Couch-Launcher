<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couch Launcher</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* Poster look: lavender polka dots on purple, pink script with a cyan rim, Johnny's cyan, Gyro's green,
     a gold horseshoe. Layout and buttons follow the PS5 home screen. */
  :root {
    --deep: #24104a; --purple: #5b2fa6; --pink: #e0306e; --johnny: #5ec8ef; --gyro: #6fae3e;
    --gold: #f2b844; --ink: #ffffff; --dim: #cdbfe8;
    --ps-cross: #7ea6ff; --ps-circle: #ff6f7d; --ps-tri: #43d6b0;
    --logo: "Lobster", "Segoe Script", cursive;
    --ui: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --tile: 17vh; --poster-h: 28vh;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--deep); color: var(--ink); font: 500 2vh/1.3 var(--ui); cursor: default; user-select: none; }

  /* ---------- backdrop */
  .sky { position: fixed; inset: 0; background:
      url("/poster.webp") right top / auto 100% no-repeat,
      radial-gradient(circle, rgba(232,216,255,.62) 0 2.4vh, rgba(232,216,255,.22) 2.9vh, transparent 3.3vh) 0 0 / 9vh 9vh,
      radial-gradient(140vw 100vh at 30% 10%, #9466dc 0%, var(--purple) 45%, var(--deep) 100%); }
  .bg { position: fixed; inset: -2vh; background-size: cover; background-position: center 30%; opacity: 0;
        transition: opacity .7s ease; filter: saturate(1.1) brightness(.6); transform: scale(1.04); }
  .bg.on { opacity: 1; animation: drift 24s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: scale(1.04) translateX(-1vw); } to { transform: scale(1.09) translateX(1vw); } }
  .shade { position: fixed; inset: 0; background:
      linear-gradient(90deg, rgba(36,16,74,.92) 0%, rgba(36,16,74,.5) 48%, rgba(36,16,74,.1) 100%),
      linear-gradient(0deg, rgba(24,10,52,.96) 0%, rgba(24,10,52,.2) 55%, rgba(24,10,52,.5) 100%); }
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .spiral-mark { position: fixed; right: -14vh; bottom: -20vh; width: 78vh; height: 78vh; opacity: .08; color: var(--gold);
                 animation: spin 90s linear infinite; pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .star { position: fixed; width: 2.2vh; height: 2.2vh; color: var(--johnny); opacity: .3; animation: twinkle 4s ease-in-out infinite; pointer-events: none; }
  @keyframes twinkle { 50% { opacity: .9; transform: scale(1.25) rotate(18deg); } }
  .app-shell { position: relative; height: 100%; animation: enter .45s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(1.5vh); } }

  /* ---------- header */
  header { display: flex; align-items: center; justify-content: space-between; height: 11vh; padding: 2.6vh 5vw 0; }
  .brand { display: flex; align-items: center; gap: 1.4vw; }
  .brand h1 { margin: 0; font: 400 5.6vh/1 var(--logo); color: var(--pink); -webkit-text-stroke: .18vh #fff;
              text-shadow: .35vh .35vh 0 var(--johnny), .7vh .7vh 1.4vh rgba(0,0,0,.45); transform: rotate(-4deg); }
  .brand .mark { width: 4.4vh; height: 4.4vh; filter: drop-shadow(0 .3vh .4vh rgba(0,0,0,.5)); }
  .brand span { color: var(--dim); font-size: 1.8vh; font-weight: 600; letter-spacing: .08em; }
  .time { text-align: right; }
  #clock { font: 600 3.6vh/1 var(--ui); font-variant-numeric: tabular-nums; }
  #date { color: var(--dim); font-size: 1.7vh; margin-top: .5vh; }

  /* ---------- details of the focused tile (PS5 game hub) */
  .details { position: relative; height: 20vh; padding: .6vh 5vw 0; }
  #d-stage { color: var(--johnny); font-size: 1.7vh; letter-spacing: .2em; text-transform: uppercase; font-weight: 800; }
  #d-title { margin: .4vh 0 0; font: 800 6vh/1.08 var(--ui); letter-spacing: -.01em; max-width: 70vw;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 .4vh 1.6vh rgba(0,0,0,.6); }
  #d-meta { color: var(--dim); font-size: 2vh; margin-top: .5vh; }
  .cta { display: inline-flex; align-items: center; gap: 1vh; margin-top: 1.4vh; padding: 1vh 3vh 1vh 1.2vh; border-radius: 99vh;
         background: #fff; color: #1a0d33; font: 800 2.1vh/1 var(--ui); box-shadow: 0 .8vh 2.4vh rgba(0,0,0,.35); }
  .cta .glyph { background: #1a0d33; }
  .details.swap #d-title { animation: dash .38s cubic-bezier(.2,.9,.2,1); }
  @keyframes dash { from { opacity: 0; transform: translateX(-3vw) skewX(-12deg); } to { opacity: 1; transform: none; } }
  #sfx { position: absolute; right: 7vw; top: 0; font: 900 6vh/1 "Yu Gothic UI", "Meiryo", "MS Gothic", sans-serif; color: var(--pink);
         -webkit-text-stroke: .22vh #fff; letter-spacing: -.05em; opacity: 0; transform: skewX(-14deg); pointer-events: none;
         text-shadow: .3vh .3vh 0 var(--johnny); }
  #sfx span { display: inline-block; }
  .details.swap #sfx { animation: menace 1.6s ease-out; }
  .details.swap #sfx span:nth-child(1) { animation: shake .18s 4 linear; }
  .details.swap #sfx span:nth-child(2) { animation: shake .18s .06s 4 linear; font-size: .82em; }
  .details.swap #sfx span:nth-child(3) { animation: shake .18s .12s 4 linear; font-size: .66em; }
  @keyframes menace { 0% { opacity: 0; transform: skewX(-14deg) translateY(1vh) scale(.9); } 12% { opacity: .95; transform: skewX(-14deg) scale(1.04); }
                      70% { opacity: .75; } 100% { opacity: 0; transform: skewX(-14deg) translateY(-1vh); } }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(.25vh,-.2vh); } 75% { transform: translate(-.25vh,.2vh); } }

  /* ---------- rows (PS5 tiles) */
  main { height: calc(100% - 11vh - 20vh - 7vh); overflow: hidden; }
  #rows { transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  section { padding: .4vh 0 .2vh; opacity: .55; transition: opacity .3s; }
  section.active, body:not(.chosen) section { opacity: 1; }
  section h2 { display: flex; align-items: baseline; gap: 1vw; margin: 0 0 0 5vw; font: 600 1.8vh/1 var(--ui); color: var(--dim); letter-spacing: .06em; }
  section h2 b { font: 400 2.8vh/1 var(--logo); color: var(--pink); -webkit-text-stroke: .08vh #fff; text-shadow: .2vh .2vh 0 var(--johnny); }
  .strip { display: flex; gap: 1.4vw; padding: 3vh 5vw 2.4vh; overflow: hidden; scroll-behavior: smooth; }

  .item { flex: 0 0 auto; position: relative; border-radius: 1.6vh; outline: none; cursor: pointer;
          box-shadow: 0 1.2vh 2.4vh rgba(10,4,24,.45), inset 0 .15vh 0 rgba(255,255,255,.18);
          transition: transform .18s ease, box-shadow .18s ease, filter .18s; filter: brightness(.82); }
  .item.focus { transform: scale(1.1); z-index: 3; filter: none;
                box-shadow: 0 0 0 .35vh #fff, 0 0 0 .7vh rgba(94,200,239,.55), 0 2.4vh 4vh rgba(0,0,0,.55), 0 0 5vh rgba(94,200,239,.35); }
  .item .badge { position: absolute; top: -2.4vh; right: -2.4vh; width: 6.2vh; height: 6.2vh; opacity: 0;
                 transform: scale(.4) rotate(-90deg); transition: opacity .2s, transform .35s cubic-bezier(.2,.9,.3,1.4); pointer-events: none;
                 filter: drop-shadow(0 .3vh .6vh rgba(0,0,0,.7)); }
  .item.focus .badge { opacity: 1; transform: scale(1); }
  .item::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
                 background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%) -150% 0 / 250% 100% no-repeat; }
  .item.focus::after { animation: sweep .9s ease-out .1s; }
  @keyframes sweep { 0% { opacity: 1; background-position: -150% 0; } 100% { opacity: 1; background-position: 250% 0; } }
  .item .badge img { width: 100%; height: 100%; display: block; }
  .item.focus .badge img { animation: spin .9s linear infinite; }

  .app { width: var(--tile); height: var(--tile); display: flex; flex-direction: column; justify-content: flex-end; padding: 1.4vh;
         background: radial-gradient(110% 90% at 20% 0%, color-mix(in srgb, var(--c) 85%, #fff 15%), color-mix(in srgb, var(--c) 55%, #120830) 80%); }
  .app svg.icon { position: absolute; top: 50%; left: 50%; width: 6vh; height: 6vh; transform: translate(-50%, -70%); color: #fff; }
  .app .name { font: 700 1.8vh/1.15 var(--ui); text-shadow: 0 .2vh .6vh rgba(0,0,0,.5); }

  .poster { width: calc(var(--poster-h) * 2 / 3); height: var(--poster-h); background: linear-gradient(160deg, var(--purple), var(--deep)); }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
  .poster .name { position: absolute; inset: auto 0 0 0; padding: 4vh 1.2vh 1.2vh; font: 700 1.8vh/1.15 var(--ui);
                  background: linear-gradient(transparent, rgba(24,10,52,.92)); border-radius: 0 0 1.6vh 1.6vh; }
  .poster:not(.noart) .name { display: none; }
  .poster.noart img { display: none; }

  .sys { width: 13vh; height: 13vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vh;
         font: 700 1.6vh/1.1 var(--ui); text-align: center; background: rgba(255,255,255,.1); backdrop-filter: blur(8px);
         border: 1px solid rgba(255,255,255,.14); }
  .sys svg.icon { width: 4.4vh; height: 4.4vh; color: #fff; }
  .sys.danger svg.icon { color: var(--ps-circle); }
  .empty { color: var(--dim); padding: 2vh 0; }

  /* ---------- PlayStation-style button glyphs */
  .glyph { display: inline-grid; place-items: center; width: 3.2vh; height: 3.2vh; border-radius: 50%; background: rgba(10,4,24,.75);
           box-shadow: 0 0 0 .15vh rgba(255,255,255,.25) inset; vertical-align: middle; }
  .glyph svg { width: 1.7vh; height: 1.7vh; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .g-cross svg { stroke: var(--ps-cross); } .g-circle svg { stroke: var(--ps-circle); } .g-tri svg { stroke: var(--ps-tri); }

  /* ---------- footer, toast, dialogs */
  footer { position: fixed; left: 0; right: 0; bottom: 0; height: 7vh; display: flex; align-items: center; gap: 2.6vw; padding: 0 5vw;
           color: var(--ink); font-size: 1.8vh; font-weight: 600; background: linear-gradient(transparent, rgba(16,6,36,.85)); }
  footer > span { display: inline-flex; align-items: center; gap: .8vh; }
  footer .sound { margin-left: auto; color: var(--dim); }
  #toast { position: fixed; right: 3vw; top: 3vh; transform: translateX(4vw); opacity: 0; transition: all .3s ease;
           background: rgba(20,10,44,.92); backdrop-filter: blur(10px); color: #fff; padding: 1.6vh 2.4vh; border-radius: 1.4vh;
           font: 600 2vh/1.3 var(--ui); border-left: .5vh solid var(--johnny); box-shadow: 0 1.4vh 3vh rgba(0,0,0,.5); pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; transform: none; }
  .overlay { position: fixed; inset: 0; background: rgba(14,6,32,.78); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.show { display: flex; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } }
  .card { position: relative; background: rgba(34,18,70,.96); color: #fff; border-radius: 2.4vh; padding: 4vh 4.5vw; text-align: center; max-width: 80vw;
          border: 1px solid rgba(255,255,255,.12); box-shadow: 0 3vh 6vh rgba(0,0,0,.55); animation: pop .28s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  .card h3 { margin: 0 0 1vh; font: 800 3.6vh/1.1 var(--ui); }
  .card p { margin: .6vh 0; color: var(--dim); font-size: 2vh; }
  .card .choices { display: flex; gap: 1.6vw; justify-content: center; margin-top: 3vh; }
  .card .choice { padding: 1.5vh 4vh; border-radius: 99vh; font: 700 2.1vh/1 var(--ui); background: rgba(255,255,255,.12); color: #fff; filter: none; }
  .card .choice.focus { background: #fff; color: #1a0d33; transform: scale(1.06); box-shadow: 0 0 3vh rgba(94,200,239,.5); }
  .card .choice.danger.focus { color: #c0203a; }
  #qr { background: #fff; padding: 1.4vh; border-radius: 1.4vh; display: inline-block; margin: 2vh 0; }
  #qr svg { display: block; width: 30vh; height: 30vh; }
  .url { font-family: Consolas, monospace; color: #fff !important; }
</style>
</head>
<body>

  <defs>

    <symbol id="i-gamepad" viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01M17.3 5H6.7a4 4 0 0 0-4 3.6l-.9 7.2a2.5 2.5 0 0 0 4.7 1.4l1-2.2h9l1 2.2a2.5 2.5 0 0 0 4.7-1.4l-.9-7.2a4 4 0 0 0-4-3.6z"/></symbol>

<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = (path, body) => fetch(path, body === undefined
  ? { headers: { "X-Couch": "1" } }
  : { method: "POST", headers: { "X-Couch": "1", "Content-Type": "application/json" }, body: JSON.stringify(body) }
).then(r => r.json());
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let info = null;
let rows = [];            // arrays of focusable elements, one per row
let pos = { r: 1, c: 0 };  // where the first press lands (first game)
let chosen = false;        // nothing is selected until you move, so ✕ can't launch by accident
const lastCol = [];
let modal = null;         // { els: [...], i, onBack }

// ---------- golden spiral (r grows by the golden ratio every quarter turn)
(() => {
  const phi = (1 + Math.sqrt(5)) / 2, b = Math.log(phi) / (Math.PI / 2), turns = 4.25, steps = 260;
  const maxT = turns * 2 * Math.PI, a = 0.92 / Math.exp(b * maxT);
  let d = "";
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * maxT, r = a * Math.exp(b * t);
    d += (i ? "L" : "M") + (r * Math.cos(t)).toFixed(4) + " " + (r * Math.sin(t)).toFixed(4);
  }
  $("#spiral-path").setAttribute("d", d);
})();
const badge = () => '<span class="badge"><img src="/steelball.png" alt=""></span>';
const icon = (name, cls = "icon") =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${name}"/></svg>`;

// ---------- sound: everything is synthesized, no files
const Sound = (() => {
  let ctx, out, on = store.get("couchSound") !== "off", foot = 0;
  function ac() {
    if (!ctx) {
      ctx = new AudioContext();
      out = ctx.createGain(); out.gain.value = 0.55;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 9000;
      out.connect(lp).connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, t0, dur, type = "sine", gain = 0.1, toFreq) {
    const c = ac(), t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t0, dur, f0, f1, gain = 0.12, q = 1.2) {
    const c = ac(), t = c.currentTime + t0, len = Math.ceil(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = "bandpass"; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + dur);
  }
  const clop = (t0, hi) => { tone(hi ? 340 : 270, t0, 0.07, "sine", 0.22, hi ? 120 : 95); noise(t0, 0.03, 2600, 1800, 0.06, 3); };
  const jingle = t0 => [2350, 3120, 4060].forEach((f, i) => tone(f * (0.98 + Math.random() * 0.04), t0 + i * 0.018, 0.22, "triangle", 0.035));
  const whir = t0 => { tone(140, t0, 0.35, "sawtooth", 0.025, 900); noise(t0, 0.3, 600, 4000, 0.05, 6); }; // steel ball spin-up
  const play = fn => { if (on) try { fn(); } catch {} };
  return {
    get on() { return on; },
    toggle() { on = !on; store.set("couchSound", on ? "on" : "off"); if (on) this.select(); },
    move: () => play(() => clop(0, (foot ^= 1))),                    // clip-clop as you move
    bump: () => play(() => tone(95, 0, 0.12, "sine", 0.18, 60)),     // can't go further
    select: () => play(() => { tone(660, 0, 0.09, "triangle", 0.08); tone(990, 0.05, 0.16, "triangle", 0.08); jingle(0.03); whir(0); }),
    back: () => play(() => noise(0, 0.2, 2400, 500, 0.14, 0.9)),     // rope swish
    open: () => play(() => { noise(0, 0.32, 400, 3200, 0.09, 0.8); tone(784, 0.22, 0.3, "sine", 0.06); }),
    launch: () => play(() => {                                       // gallop off + golden chord
      [0, .09, .2, .36, .45, .56].forEach((t, i) => clop(t, i % 3 === 2));
      [392, 494, 587, 784].forEach((f, i) => tone(f, 0.62 + i * 0.07, 0.9, "triangle", 0.06)); whir(0.55);
      jingle(0.62);
    }),
  };
})();
function soundHint() { $("#sound-hint").innerHTML = `${icon(Sound.on ? "sound" : "mute", "icon")}`.replace('class="icon"', 'class="icon" style="width:2.6vh;height:2.6vh;vertical-align:middle;margin-right:.6vw"') + (Sound.on ? "Sound on" : "Sound off"); }
soundHint();

// ---------- dust drifting across the plains
(() => {
  const cv = $("#dust"), cx = cv.getContext("2d");
  let W, H, motes = [];
  function size() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    motes = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + .4,
      vx: Math.random() * .35 + .08, vy: -(Math.random() * .12), a: Math.random() * .35 + .08 }));
  }
  size(); addEventListener("resize", size);
  (function frame() {
    if (!document.hidden) {
      cx.clearRect(0, 0, W, H);
      for (const m of motes) {
        m.x += m.vx; m.y += m.vy;
        if (m.x > W + 5) { m.x = -5; m.y = Math.random() * H; }
        if (m.y < -5) m.y = H + 5;
        cx.fillStyle = `rgba(236,224,255,${m.a})`; cx.beginPath(); cx.arc(m.x, m.y, m.r, 0, 6.283); cx.fill();
      }
    }
    requestAnimationFrame(frame);
  })();
})();

// ---------- clock & greeting
function tick() {
  const d = new Date(), h = d.getHours();
  $("#clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  $("#date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  $("#greet").textContent = (h < 5 ? "Riding late" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening") + ", jockeys";
}
tick(); setInterval(tick, 10000);

// ---------- toast
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

// ---------- backdrop: the focused game's art, crossfaded
let bgFront = $("#bgA"), bgBack = $("#bgB"), bgWant = null, bgTimer;
function setBackdrop(url) {
  if (url === bgWant) return;
  bgWant = url; clearTimeout(bgTimer);
  bgTimer = setTimeout(() => {
    if (!url) { bgFront.classList.remove("on"); return; }
    const img = new Image();
    img.onload = () => {
      if (bgWant !== url) return;
      bgBack.style.backgroundImage = `url("${url}")`;
      bgBack.classList.add("on"); bgFront.classList.remove("on");
      [bgFront, bgBack] = [bgBack, bgFront];
    };
    img.onerror = () => { if (bgWant === url) bgFront.classList.remove("on"); };
    img.src = url;
  }, 140);
}

// ---------- details line for the focused tile
const STAGES = ["Stage I · The Stable", "Stage II · The Trail", "Stage III · Camp"];
function ago(sec) {
  if (!sec) return "Never ridden";
  const days = Math.floor((Date.now() / 1000 - sec) / 86400);
  return days <= 0 ? "Last played today" : days === 1 ? "Last played yesterday" : `Last played ${days} days ago`;
}
function showDetails(e, r) {
  const d = $("#details");
  $("#d-stage").textContent = STAGES[r] || "";
  $("#d-title").textContent = e.dataset.title || "";
  $("#d-meta").textContent = e.dataset.meta || "";
  $("#d-cta").textContent = e.dataset.cta || "Open";
  d.classList.remove("swap"); void d.offsetWidth; d.classList.add("swap");
  setBackdrop(e.dataset.hero || null);
}

// ---------- build
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function build() {
  const apps = $("#apps"); apps.innerHTML = "";
  for (const a of info.apps) {
    const t = el("div", "item app", `${icon(a.icon || "gamepad")}<span class="name">${esc(a.name)}</span>${badge()}`);
    t.style.setProperty("--c", a.color || "#555");
    t.dataset.title = a.name;
    t.dataset.meta = a.kind === "web" ? "Opens full screen" : "App";
    t.onactivate = () => launch({ id: a.id }, a.name);
    apps.append(t);
  }

  const games = $("#games"); games.innerHTML = "";
  if (!info.games.length) games.append(el("div", "empty", "No Steam games installed."));
  for (const g of info.games) {
    const t = el("div", "item poster", `<img alt="" loading="lazy"><div class="name">${esc(g.name)}</div>${badge()}`);
    const img = t.querySelector("img");
    img.onerror = () => {
      if (!img.dataset.cdn) { img.dataset.cdn = 1; img.src = `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/library_600x900.jpg`; }
      else t.classList.add("noart");
    };
    img.src = g.art || `/art/${g.appid}`;
    t.dataset.title = g.name;
    t.dataset.meta = g.meta || `${ago(g.lastPlayed)}  ·  ${(g.size / 1e9).toFixed(g.size > 1e10 ? 0 : 1)} GB`;
    t.dataset.hero = g.hero || `/art/${g.appid}/hero`;
    t.dataset.cta = "Play";
    t.onactivate = () => launch(g.id ? { id: g.id } : { game: g.appid }, g.name);
    games.append(t);
  }

  const sys = $("#system"); sys.innerHTML = "";
  const sysItems = [
    ["phone", "Phone remote", "Scan a code to control the PC from your phone", "", showPhone],
    [Sound.on ? "sound" : "mute", Sound.on ? "Sound on" : "Sound off", "Hoofbeats and spurs while you browse", "", () => { Sound.toggle(); soundHint(); const r = pos.r, c = pos.c; build(); focus(r, c); }],
    ["moon", "Sleep", "Rest the horse — wake with the power button", "", () => confirmPower("sleep", "Sleep", "Put the PC to sleep?")],
    ["restart", "Restart", "Start the race over", "danger", () => confirmPower("restart", "Restart", "Restart the PC now? Unsaved work in other apps will be lost.")],
    ["power", "Shut down", "Make camp for the night", "danger", () => confirmPower("shutdown", "Shut down", "Shut down the PC now? Unsaved work in other apps will be lost.")],
    ["exit", "Desktop", "Close the launcher", "", () => api("/api/window", { action: "close-launcher" })],
  ];
  for (const [ic, label, meta, cls, fn] of sysItems) {
    const t = el("div", "item sys " + cls, `${icon(ic)}<span>${esc(label)}</span>${badge()}`);
    t.dataset.title = label; t.dataset.meta = meta; t.dataset.cta = "Select";
    t.onactivate = fn; sys.append(t);
  }

  rows = [...document.querySelectorAll(".strip")].map(s => [...s.querySelectorAll(".item")]).filter(r => r.length);
  rows.forEach((row, r) => row.forEach((e, c) => {
    // Steam's desktop layout moves the mouse with the right stick; don't let that steal focus.
    e.addEventListener("mouseenter", () => { if (!modal && performance.now() - lastPadAt > 1500 && (pos.r !== r || pos.c !== c)) { focus(r, c); Sound.move(); } });
    e.addEventListener("click", () => { if (!modal) { focus(r, c); Sound.select(); e.onactivate(); } });
  }));
  if (chosen) focus(Math.min(pos.r, rows.length - 1), lastCol[pos.r] ?? 0);
}

function focus(r, c) {
  document.querySelectorAll("#rows .focus").forEach(e => e.classList.remove("focus"));
  r = Math.max(0, Math.min(rows.length - 1, r));
  c = Math.max(0, Math.min(rows[r].length - 1, c));
  pos = { r, c }; lastCol[r] = c; chosen = true;
  const e = rows[r][c]; e.classList.add("focus");
  document.querySelectorAll("#rows section").forEach(sec => sec.classList.toggle("active", sec.contains(e)));
  document.body.classList.add("chosen");
  showDetails(e, r);
  // horizontal: keep focused tile in view
  const strip = e.parentElement;
  const left = e.offsetLeft - strip.offsetLeft, pad = window.innerWidth * 0.05;
  if (left - strip.scrollLeft < pad) strip.scrollLeft = left - pad;
  else if (left + e.offsetWidth - strip.scrollLeft > strip.clientWidth - pad) strip.scrollLeft = left + e.offsetWidth - strip.clientWidth + pad;
  // vertical: slide rows so the focused row is visible
  const sec = e.closest("section"), main = $("main");
  const shift = Math.max(0, Math.min(sec.offsetTop - main.offsetTop - 4, $("#rows").scrollHeight - main.clientHeight));
  $("#rows").style.transform = `translateY(${-shift}px)`;
}

function move(dir) {
  if (modal) {
    if (dir === "left" || dir === "right") {
      const i = Math.max(0, Math.min(modal.els.length - 1, modal.i + (dir === "left" ? -1 : 1)));
      if (i === modal.i) return Sound.bump();
      modal.i = i; Sound.move();
      modal.els.forEach((e, k) => e.classList.toggle("focus", k === modal.i));
    }
    return;
  }
  if (!chosen) { focus(pos.r, 0); return Sound.move(); }  // first press just shows the highlight
  const before = pos.r + ":" + pos.c;
  if (dir === "left") focus(pos.r, pos.c - 1);
  if (dir === "right") focus(pos.r, pos.c + 1);
  if (dir === "up" && pos.r > 0) focus(pos.r - 1, lastCol[pos.r - 1] ?? 0);
  if (dir === "down" && pos.r < rows.length - 1) focus(pos.r + 1, lastCol[pos.r + 1] ?? 0);
  (pos.r + ":" + pos.c === before) ? Sound.bump() : Sound.move();
}
function activate() {
  if (modal) { const e = modal.els[modal.i]; if (e) { Sound.select(); e.onactivate(); } return; }
  if (!chosen) return;
  Sound.select(); rows[pos.r][pos.c].onactivate();
}
function back() { if (modal) { Sound.back(); modal.onBack(); } }

// ---------- actions
let launching = false;
async function launch(body, name) {
  if (launching) return;
  launching = true; setTimeout(() => launching = false, 3000);
  Sound.launch();
  toast(`And they're off — ${name}`);
  try {
    const r = await api("/api/launch", body);
    if (!r.ok) toast(r.error || "Couldn't start it");
  } catch { toast("Couch server isn't responding"); }
}

function openModal(overlay, els, onBack) {
  overlay.classList.add("show"); Sound.open();
  modal = { els, i: 0, onBack: onBack || (() => closeModal(overlay)) };
  els.forEach((e, i) => { e.classList.toggle("focus", i === 0); e.onclick = () => { Sound.select(); e.onactivate(); }; });
}
function closeModal(overlay) { overlay.classList.remove("show"); modal = null; }

function confirmPower(action, title, text) {
  const d = $("#dialog");
  $("#dlg-title").textContent = title + "?"; $("#dlg-text").textContent = text;
  const no = el("div", "item choice", "Cancel"), yes = el("div", "item choice danger", esc(title));
  no.onactivate = () => closeModal(d);
  yes.onactivate = async () => { closeModal(d); toast(title + "…"); await api("/api/power", { action }).catch(() => {}); };
  const c = $("#dlg-choices"); c.innerHTML = ""; c.append(no, yes);
  openModal(d, [no, yes]);
}

function showPhone() {
  const p = $("#phone");
  const url = info.urls?.[0];
  $("#phone-url").textContent = url || "(no Wi-Fi/Ethernet address found)";
  const q = $("#qr"); q.innerHTML = ""; q.style.display = "";
  if (url && window.qrcode) {
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    q.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  } else q.style.display = "none";
  openModal(p, [], () => closeModal(p));
}

// ---------- keyboard (also what Steam's desktop controller layout sends)
// Once controller presses arrive from the server, ignore the keys Steam also sends for them,
// otherwise one press would count twice.
let padSeen = false;
addEventListener("keydown", e => {
  const k = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
  const padKey = k || ["Enter", " ", "Escape", "Backspace"].includes(e.key);
  if (padKey) e.preventDefault();
  if (padSeen && padKey) return;
  if (k) move(k);
  else if (e.key === "Enter" || e.key === " ") activate();
  else if (e.key === "Escape" || e.key === "Backspace") back();
  else if (e.key === "p" || e.key === "y") { if (!modal) { Sound.select(); showPhone(); } }
});

// ---------- controller: the server reads it (works with or without Steam) and streams presses here
let lastPadAt = -1e9;
function onPad(a) {
  padSeen = true; lastPadAt = performance.now();
  if (a === "a") activate(); else if (a === "b") back();
  else if (a === "y") { if (modal) back(); else { Sound.select(); showPhone(); } }
  else move(a);
}
async function listenPad() {
  for (;;) {
    try {
      const r = await fetch("/api/events", { headers: { "X-Couch": "1" } });
      const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const msg = buf.slice(0, i); buf = buf.slice(i + 2);
          if (msg.startsWith("data: ")) onPad(msg.slice(6));
        }
      }
    } catch {}
    await new Promise(r => setTimeout(r, 2000)); // server restarting; try again
  }
}
listenPad();

// ---------- load
async function load() {
  try {
    info = await api("/api/info");
    build();
  } catch { $("#games").innerHTML = '<div class="empty">Couch server isn\'t running.</div>'; setTimeout(load, 3000); }
}
load();
addEventListener("focus", () => { if (info) api("/api/info").then(i => { info = i; const r = pos.r, c = lastCol[pos.r] ?? 0; build(); focus(r, c); }).catch(() => {}); });
</script>
</body>
</html>
