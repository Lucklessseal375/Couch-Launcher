// ---------- △ Search: an on-screen keyboard (or the phone's keyboard) filters your games and apps
const KEYS = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789", "space", "del"];
const keyPos = i => i < 26 ? [Math.floor(i / 13), i % 13, 1] : i < 36 ? [2, i - 26, 1] : i === 36 ? [2, 10, 2] : [2, 12, 1];  // [row, col, span]
let S = null;  // { q, zone: "keys" | "results", k, r, results: [{ el, orig }] }
function openSearch() {
  if (!info) return;
  S = { q: "", zone: "keys", k: 0, r: 0, results: [] };
  const keys = $("#keys"); keys.innerHTML = "";
  KEYS.forEach((k, i) => {
    const b = el("div", "key", k === "space" ? "Space" : k === "del" ? icon("del", "kicon") : k);
    b.style.gridColumn = `span ${keyPos(i)[2]}`;
    b.onclick = () => { S.zone = "keys"; S.k = i; searchActivate(); };
    keys.append(b);
  });
  $("#search").classList.add("show"); document.body.classList.add("modal"); Sound.open();
  modal = { search: true, els: [], i: 0, onBack: closeSearch, move: searchMove, activate: searchActivate, del: () => searchDelete() };
  renderSearch();
}
function closeSearch() { S = null; closeModal($("#search")); }
// a text prompt on the same keyboard (the Streaming menu's Sunshine sign-in and pairing PIN): L1/R1 switch lowercase,
// capitals and symbols, the Space key becomes Done, a secret shows dots. Resolves to the text, or null on ○.
const LAYERS = ["abcdefghijklmnopqrstuvwxyz", "ABCDEFGHIJKLMNOPQRSTUVWXYZ", "!@#$%^&*()-_=+[]{};:'\",./?"];
function promptText(title, { secret = false } = {}) {
  return new Promise(resolve => {
    openSearch();
    S.prompt = { title, secret, resolve }; S.layer = 0;
    modal.layer = d => { S.layer = (S.layer + d + 3) % 3; Sound.move(); labelKeys(); updatePrompts(); };
    modal.onBack = () => { closeSearch(); resolve(null); };
    labelKeys(); renderSearch();
  });
}
function labelKeys() {
  const keys = [...$("#keys").children];
  for (let i = 0; i < 26; i++) keys[i].textContent = S.prompt ? LAYERS[S.layer][i] : KEYS[i];
  keys[36].textContent = S.prompt ? "Done" : "Space";
}
// ---------- easter eggs from Steel Ball Run
const EGGS = [
  [/^johnny|^joestar/, "Johnny Joestar. The jockey who got back on the horse."],
  [/^tusk/, "Tusk Act 1… Act 2… Act 3… ACT 4!", true],
  [/^gyro|^zeppeli|^nyo/, "Nyo-ho! Gyro Zeppeli, steel balls ready."],
  [/^(spin|rotation|golden)/, "Trust the spin. Follow the golden rectangle.", true],
  [/^slow ?dancer/, "Slow Dancer: Johnny's spotted horse."],
  [/^valkyrie/, "Valkyrie: Gyro's horse, the one with the striped legs."],
  [/^(diego|dio|scary)/, "Diego Brando on Silver Bullet. Scary Monsters!"],
  [/^silver ?bullet/, "Silver Bullet: Diego's horse, fast and mean."],
  [/^(valentine|d4c|president)/, "D4C. Dojyaaan~"],
  [/^(lucy|steel$)/, "Lucy Steel: braver than everyone in the race."],
  [/^hot ?pants/, "Hot Pants. Cream Starter, sprayed on."],
  [/^(pizza|mozzarella)/, "Gyro's cheese song is stuck in your head now."],
  [/^(corpse|saint)/, "A Saint's Corpse part! Keep it hidden."],
  [/^(sbr|steel ball)/, "6,000 km from San Diego to New York. Ready?", true],
  [/^(horseshoe|wanted|cowboy)/, "Yeehaw."],
];
function showEgg(q) {
  if (q.length < 3) return "";
  const hit = EGGS.find(([re]) => re.test(q));
  if (!hit) return "";
  if (hit[2] && showEgg.last !== hit[1]) goldenSpin();
  showEgg.last = hit[1];
  return hit[1];
}
function goldenSpin() {
  const g = $("#golden-spin"); g.classList.remove("go"); void g.getBoundingClientRect(); g.classList.add("go");
  Sound.select();
}
// L1 R1 L1 R1 (PageUp PageDown twice on a keyboard): the Golden Spin
let combo = [];
function comboPress(a) {
  combo = [...combo.filter(([, t]) => Date.now() - t < 2500), [a, Date.now()]].slice(-4);
  if (combo.map(([k]) => k).join() === "l1,r1,l1,r1") { combo = []; goldenSpin(); toast("Golden Spin!"); }
}
// the race started on San Diego beach on September 25, 1890
{ const d = new Date(); if (d.getMonth() === 8 && d.getDate() === 25) setTimeout(() => toast(`The Steel Ball Run started ${d.getFullYear() - 1890} years ago today. Giddy up!`), 4000); }

function renderSearch() {
  $("#sq-text").textContent = S.prompt?.secret ? "•".repeat(S.q.length) : S.q;
  $("#sq-hint").hidden = !!S.q;
  $("#sq-hint").textContent = S.prompt ? S.prompt.title : "Search games and apps";
  $("#search").classList.toggle("prompt", !!S.prompt);
  if (S.prompt) { S.results = []; $("#results").innerHTML = ""; $("#sr-title").textContent = ""; S.zone = "keys"; return paintSearch(); }
  const q = S.q.trim().toLowerCase();
  const pool = rows.flat().filter(t => t.closest("#apps, #games"));
  const hits = q ? pool.filter(t => (t.dataset.title || "").toLowerCase().includes(q)) : [];
  const box = $("#results"); box.innerHTML = ""; box.dataset.x = 0; box.style.transform = "";
  S.results = hits.map(orig => {
    const c = orig.cloneNode(true); c.classList.remove("focus");
    c.onclick = () => { closeSearch(); orig.onactivate(); };
    box.append(c); return { el: c, orig };
  });
  const egg = !hits.length && showEgg(q);
  $("#sr-title").textContent = !q ? "" : hits.length ? `${hits.length} result${hits.length === 1 ? "" : "s"}` : egg || "Nothing matches";
  if (!S.results.length) S.zone = "keys";
  S.r = Math.min(S.r, Math.max(0, S.results.length - 1));
  paintSearch();
}
function paintSearch() {
  [...$("#keys").children].forEach((b, i) => b.classList.toggle("focus", S.zone === "keys" && i === S.k));
  S.results.forEach(({ el }, i) => el.classList.toggle("focus", S.zone === "results" && i === S.r));
  if (S.zone === "results" && S.results[S.r]) slide(S.results[S.r].el);
  updatePrompts();
}
function searchMove(dir) {
  const before = `${S.zone}${S.k}:${S.r}`;
  if (S.zone === "keys") {
    const [row, col] = keyPos(S.k);
    if (dir === "left" && S.k > 0 && keyPos(S.k - 1)[0] === row) S.k--;
    else if (dir === "right" && S.k < KEYS.length - 1 && keyPos(S.k + 1)[0] === row) S.k++;
    else if (dir === "down" && row === 2) { if (S.results.length) S.zone = "results"; }
    else if (dir === "up" || dir === "down") {
      const tr = row + (dir === "up" ? -1 : 1);
      const n = KEYS.findIndex((_, i) => { const [r2, c2, s2] = keyPos(i); return r2 === tr && c2 <= col && col < c2 + s2; });
      if (n >= 0) S.k = n;
    }
  } else if (dir === "left" && S.r > 0) S.r--;
  else if (dir === "right" && S.r < S.results.length - 1) S.r++;
  else if (dir === "up") S.zone = "keys";
  `${S.zone}${S.k}:${S.r}` === before ? Sound.bump() : Sound.move();
  paintSearch();
}
function searchActivate() {
  if (S.zone === "results") {
    const hit = S.results[S.r];
    if (hit) { Sound.select(); closeSearch(); hit.orig.onactivate(); }
    return;
  }
  const k = KEYS[S.k];
  if (k === "del") return searchDelete();
  Sound.select();
  if (S.prompt) {
    if (k === "space") { const text = S.q, done = S.prompt.resolve; closeSearch(); return done(text); }  // Done
    S.q = (S.q + (S.k < 26 ? LAYERS[S.layer][S.k] : k)).slice(0, 64);
    return renderSearch();
  }
  S.q = (S.q + (k === "space" ? " " : k)).slice(0, 30);
  renderSearch();
}
function searchDelete() {
  if (!S.q) return Sound.bump();
  Sound.back(); S.q = S.q.slice(0, -1); renderSearch();
}

// ---------- keyboard (also what Steam's desktop controller layout sends, and the phone's typing box)
// Once controller presses arrive from the server, ignore the keys Steam also sends for them,
// otherwise one press would count twice.
let padSeen = false;
addEventListener("keydown", e => {
  Sound.unlock();
  if (modal?.search && e.key.length === 1 && (S?.prompt || /[a-z0-9 ]/i.test(e.key))) {  // typing into the search or a prompt
    e.preventDefault(); S.q = S.prompt ? (S.q + e.key).slice(0, 64) : (S.q + e.key.toUpperCase()).slice(0, 30); renderSearch(); return;
  }
  if (modal?.search && e.key === "Backspace") { e.preventDefault(); S.q ? searchDelete() : back(); return; }
  const k = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
  const padKey = k || ["Enter", " ", "Escape", "Backspace"].includes(e.key);
  if (padKey) e.preventDefault();
  if (e.repeat && !k) return;  // a held key repeats ~30 ms apart: once fired Sleep 63 times; only arrows repeat
  if (wake()) return;
  if (padSeen && padKey) return;
  if (k) move(k);
  else if (e.key === "PageUp" || e.key === "PageDown") { e.preventDefault(); comboPress(e.key === "PageUp" ? "l1" : "r1"); category(e.key === "PageUp" ? -1 : 1); }
  else if (e.key === "Enter" || e.key === " ") activate();
  else if (e.key === "Escape" || e.key === "Backspace") back();
  else if (e.key === "/" || e.key === "y") { if (!modal) { Sound.select(); openSearch(); } }
  else if (e.key === "x") gameDetails();
  else if (e.key === "m") quickMenu();
  else if (e.key === "p") { if (!modal) { Sound.select(); showPhone(); } }
});

// ---------- controller: the server reads it (works with or without Steam) and streams presses here
let lastPadAt = -1e9;
function onPad(a) {
  if (a.startsWith("pad:")) { Out.detect(); return showPad(a.slice(4)); }  // a controller came or went
  if (a.startsWith("stream:")) {  // a Sunshine stream started or ended; keep info in step so a rebuild shows the same
    const d = a === "stream:off" ? null : a.slice(7);
    if (info) info.stream = d;
    document.querySelectorAll("#system .sys").forEach(t => { if (t.dataset.title === "Streaming") t.dataset.meta = streamStatus(); });
    return showStream(d);
  }
  if (a === "shot") return toast("Screenshot saved. See it in Media gallery");
  if (a.startsWith("mic:")) return toast({ on: "Microphone on", off: "Microphone muted", none: "No microphone found" }[a.slice(4)]);
  padSeen = true; lastPadAt = performance.now(); Sound.unlock();
  if (wake()) return;
  if (a === "a") { pressFx(); activate(); }
  else if (a === "b") back();
  else if ((a === "l1" || a === "r1") && modal?.layer) modal.layer(a === "l1" ? -1 : 1);  // a text prompt's letters/symbols
  else if (a === "l1" || a === "r1") { comboPress(a); category(a === "l1" ? -1 : 1); }
  else if (a === "l2" || a === "r2") page(a === "l2" ? -1 : 1);
  else if (a === "x") { if (modal?.del) modal.del(); else gameDetails(); }
  else if (a === "y") { if (modal) back(); else { Sound.select(); openSearch(); } }
  else if (a === "options") { if (modal) back(); else quickMenu(); }
  else move(a);
}
async function listenPad() {
  for (;;) {
    try {
      const r = await fetch("/api/events", { headers: { "X-Couch": "1" } });
      const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const msg = buf.slice(0, i); buf = buf.slice(i + 2);
          if (msg.startsWith("data: ")) onPad(msg.slice(6));
        }
      }
    } catch {}
    await new Promise(r => setTimeout(r, 2000)); // server restarting; try again
  }
}
listenPad();

// Fallback when the server can't read the controller (pygame missing): the browser's Gamepad API with the
// standard DualSense mapping. 0 ✕, 1 ○, 2 □, 3 △, 4 L1, 5 R1, 9 Options, 12-15 D-pad, left stick to move.
let gamepadOn = false;
function gamepadLoop() {
  if (gamepadOn) return;
  gamepadOn = true;
  const map = { 0: "a", 1: "b", 2: "x", 3: "y", 4: "l1", 5: "r1", 9: "options" };
  const dpad = { 12: "up", 13: "down", 14: "left", 15: "right" }, down = {}, held = {};
  (function poll() {
    const gp = [...(navigator.getGamepads?.() || [])].find(Boolean);
    if (gp) {
      const now = performance.now(), dirs = new Set();
      for (const [i, a] of Object.entries(map)) {
        const p = !!gp.buttons[i]?.pressed;
        if (p && !down[a]) onPad(a);
        down[a] = p;
      }
      for (const [i, d] of Object.entries(dpad)) if (gp.buttons[i]?.pressed) dirs.add(d);
      const [x = 0, y = 0] = gp.axes;
      if (x < -.6) dirs.add("left"); if (x > .6) dirs.add("right"); if (y < -.6) dirs.add("up"); if (y > .6) dirs.add("down");
      for (const d of ["up", "down", "left", "right"]) {   // repeat while held, like the server does
        if (!dirs.has(d)) { delete held[d]; continue; }
        if (!(d in held)) { held[d] = now + 380; onPad(d); }
        else if (now >= held[d]) { held[d] = now + 110; onPad(d); }
      }
    }
    requestAnimationFrame(poll);
  })();
}

// ---------- load
async function load() {
  try {
    info = await api("/api/info");
    if (info.running) pos.r = 0;  // reloaded mid-game: first press lands on Resume
    build();
    if (info.padReader === false) gamepadLoop();  // null = the server's reader is still starting
    const clipsReady = Sound.loadClips(info.sounds || []);  // decoded in the background; nothing waits on it
    padLight();  // gold while you're in the menu
    if (info.installerChanged) toast("Couch updated. Run Install Couch.cmd once on this PC to finish");
    if (!PREVIEW) {
      await Out.detect(); await clipsReady;
      if (Sound.has("bgm") && Sound.musicOn) Sound.startBgm(); else Intro.play("startup");
    }
  } catch { $("#games").innerHTML = '<div class="empty">Couch server isn\'t running. Trying again…</div>'; setTimeout(load, 3000); }
}
updatePrompts();

// Re-read the library and what's running. The Now playing row coming or going shifts every row by one.
async function refresh(toResume) {
  if (!info) return;
  let i;
  try { i = await api("/api/info"); } catch { return; }
  const shift = !!i.running - !!info.running;
  if (shift > 0) lastCol.unshift(0); else if (shift < 0) lastCol.shift();
  pos.r = Math.max(0, pos.r + shift);
  info = i;
  build();
  if (toResume && info.running) focus(0, 0);  // back from the game: Resume is where you'd want to be
}
// Now playing stays current while the launcher is up: a game can close from the phone, the task manager or a crash
setInterval(async () => {
  if (!info || document.hidden || modal) return;
  let r; try { r = await api("/api/running"); } catch { return; }
  if (r.version && info.version && r.version !== info.version) return location.reload();  // Couch updated itself
  if (!!r.running !== !!info.running || r.running?.name !== info.running?.name) refresh();
}, 3000);
addEventListener("focus", () => { wake(); refresh(true); Out.detect(); padLight(); if (!PREVIEW) Sound.startBgm(); });
</script>
</body>
</html>
